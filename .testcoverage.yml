# Coverage gate: >=95% total, >=90% per package, blocking in CI.
# The profile is produced by `make cover`, which merges every cover/*
# directory (unit tests on each OS, acceptance runs) with `go tool covdata`.
profile: cover/coverage.out
threshold:
  file: 0
  package: 90
  total: 95
exclude:
  paths:
    # Binary entry points: thin shims over internal/.
    - ^cmd/
    # Maintainer tools (specref): thin cobra shims over internal/.
    - ^tools/
    # The acceptance harness: test code that every acceptance run exercises,
    # whose remaining statements are failures of Docker, the build or a
    # container that no scenario can stage.
    - ^test/
    # The PostgreSQL test harness, for the same reason: every database test
    # runs it, and what no test reaches is Docker or a container failing and
    # Main's teardown after m.Run has written the profile.
    - ^internal/platform/sql/sqltest/
    # The object store contract, for the same reason: every driver's test
    # runs it, and what none reaches is a driver failing a clause.
    - ^internal/platform/objectstore/objectstoretest/
    # oapi-codegen and stubgen output; the generators are tested instead.
    - ^internal/platform/gen/
    - ^pkg/client/
