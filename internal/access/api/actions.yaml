# Each value of the reference's Action enum, in the snapshot's order: the
# kind of entity whose space decides it (subject), the legacy access level
# that grants it when no role does (fallback: reader, writer or admin), and
# whether the schema marks it disabled or deprecated. Report 14 section 3.3
# is the source. specref actions generates actions.gen.go from this file
# and api/reference/spacelift/introspection.json, and fails when either
# names a value the other lacks or a flag disagrees with the schema.
#
# STACK_SCHEDULED_DELETE_UPDATE's fallback is undocumented (report 14,
# C117); it takes admin, as the other scheduling actions do.
