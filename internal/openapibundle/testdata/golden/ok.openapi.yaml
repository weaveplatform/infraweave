# Generated by `make bundle` from api/src/ok/; edit the fragments, not this file.
openapi: 3.0.3
info:
  title: Fixture API
  version: 0.0.1
servers:
  - url: /api/v1
tags:
  - name: widgets
security:
  - bearerAuth: []
paths:
  /widgets:
    get:
      operationId: listWidgets
      tags: [widgets]
      responses:
        "200":
          description: Every widget.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Widget'
  /widgets/{widgetId}:
    get:
      operationId: getWidget
      tags: [widgets]
      parameters:
        - name: widgetId
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The widget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
        "404":
          $ref: '#/components/responses/NotFound'
components:
  responses:
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    # Kept: a comment on a component survives into the bundle.
    Problem:
      type: object
      required: [title, status]
      properties:
        title: {type: string}
        status: {type: integer, format: int32}
    Widget:
      type: object
      properties:
        id: {type: string}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
