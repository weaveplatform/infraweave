name: go | Quality gate

# Every pull request passes vet, blocking lint, unit tests on Linux, macOS and
# Windows, govulncheck, a cross-compile of every cmd/* binary, and the merged
# coverage gate (>=95% total, >=90% per package), the acceptance partitions
# against real dependencies in Docker, the unit tests and every partition
# again in FIPS 140-only mode, the parity check over their results, and the
# runner images when their definitions change. The `gate` job is the single
# required status check: make it required in branch protection. Every
# required job is in its `needs` and, when it produces coverage, in the
# coverage job's.
# ref: decision 0016

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'
  # Every test binary removes its own containers, and a runner's containers
  # end with the runner. Ryuk adds nothing here, and its one reaper per
  # go test invocation, shared by package binaries running in parallel,
  # fails a package that starts while another's reaper is exiting: "the
  # container name /reaper_<session> is already in use".
  TESTCONTAINERS_RYUK_DISABLED: 'true'

jobs:
  unit:
    name: 'Unit tests (${{ matrix.os }})'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Vet
        run: go vet ./...

      - name: Unit tests (race, shuffle, coverage)
        shell: bash
        run: make test

      - name: Record tested revision
        if: always()
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/validation"
          jq -n --arg head "$PR_HEAD" --arg base "$PR_BASE" \
            --arg checkout "$(git rev-parse HEAD)" --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{head:$head,base:$base,checkout:$checkout,tree:$tree,run:$run,attempt:$attempt}' \
            > "$RUNNER_TEMP/validation/revision.json"

      - name: Upload tested revision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-unit-${{ matrix.os }}
          path: ${{ runner.temp }}/validation/revision.json
          retention-days: 7

      - name: Upload unit coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-unit-${{ matrix.os }}
          path: cover/unit
          include-hidden-files: true
          retention-days: 7

  # A scenario runs in the first of terraform-plans, terraform-vcs, terraform,
  # run-credentials, runs, integrations, identity and core that lists one of its tags; TestUnitFeaturePartitions
  # fails a tag no partition lists. A partition near its timeout splits by
  # tag into two jobs; scenarios are never dropped to fit.
  # ref: decision 0016
  accept:
    name: 'accept-${{ matrix.partition }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: core
            timeout: 20
          - partition: identity
            timeout: 20
          - partition: terraform
            timeout: 30
          - partition: terraform-vcs
            timeout: 30
          - partition: terraform-plans
            timeout: 30
          - partition: run-credentials
            timeout: 30
          - partition: runs
            timeout: 30
          - partition: integrations
            timeout: 20
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      # The runner has Docker, so a scenario skipped for want of a daemon
      # fails the job rather than passing unseen.
      - name: Acceptance partition ${{ matrix.partition }}
        env:
          INFRAWEAVE_ACCEPT_REQUIRE_DOCKER: '1'
          INFRAWEAVE_ACCEPT_PROGRESS: '1'
        run: make accept PARTITION=${{ matrix.partition }}

      # go test shows a passing test's output only with -v, so the count
      # comes from the partition's report, to the log and the job summary.
      - name: Report the partition's scenarios
        if: success()
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          n=$(jq '[.[].elements[]?] | length' cover/accept/cucumber.json)
          if [ "$n" -eq 0 ]; then
            line="accept-${PARTITION} has no scenarios yet."
          else
            line="accept-${PARTITION} ran ${n} scenarios."
          fi
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failed-scenario evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accept-evidence-${{ matrix.partition }}
          path: test/acceptance/out
          retention-days: 7

      # cover/accept also holds the partition's cucumber.json, which the
      # parity job reads.
      - name: Record tested revision
        if: always()
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/validation"
          jq -n --arg head "$PR_HEAD" --arg base "$PR_BASE" \
            --arg checkout "$(git rev-parse HEAD)" --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{head:$head,base:$base,checkout:$checkout,tree:$tree,run:$run,attempt:$attempt}' \
            > "$RUNNER_TEMP/validation/revision.json"

      - name: Upload tested revision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-accept-${{ matrix.partition }}
          path: ${{ runner.temp }}/validation/revision.json
          retention-days: 7

      - name: Upload acceptance coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-accept-${{ matrix.partition }}
          path: cover/accept
          include-hidden-files: true
          retention-days: 7

  native:
    name: accept-native
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Native acceptance and capture replays
        env:
          INFRAWEAVE_ACCEPT_REQUIRE_DOCKER: '1'
          INFRAWEAVE_ACCEPT_PROGRESS: '1'
        run: make accept-native

      - name: Upload failed native evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accept-evidence-native
          path: test/acceptance/out
          retention-days: 7

      - name: Record tested revision
        if: always()
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/validation"
          jq -n --arg head "$PR_HEAD" --arg base "$PR_BASE" \
            --arg checkout "$(git rev-parse HEAD)" --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{head:$head,base:$base,checkout:$checkout,tree:$tree,run:$run,attempt:$attempt}' \
            > "$RUNNER_TEMP/validation/revision.json"

      - name: Upload tested revision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-native
          path: ${{ runner.temp }}/validation/revision.json
          retention-days: 7

      - name: Upload native coverage and capture reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-native
          path: cover/native
          include-hidden-files: true
          retention-days: 7

  lab-batch:
    name: Terraform ${{ matrix.label }} acceptance batch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: policies
            label: policy
          - batch: kubernetes
            label: Kubernetes
    env:
      GOFLAGS: '-p=1'
      GOMAXPROCS: '2'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
      - name: Download Go modules
        uses: ./.github/actions/go-mod-download
      - name: Read the pinned Terraform release
        id: pins
        run: |
          version=$(sed -n '/^var Terraform = /,/^}/ s/.*Version: *"\([^"]*\)".*/\1/p' test/deps/tools.go)
          test -n "$version"
          echo "terraform=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: ${{ steps.pins.outputs.terraform }}
      - name: Verify batch lifecycle controls
        run: python3 -m unittest discover -s test/terraform/lab -p 'test_*.py'
      - name: Build the verification-only lab helper
        # Scope FIPS to infraweave. The provisioning CLI authenticates provider
        # releases with OpenPGP, whose key IDs require legacy SHA-1 hashing.
        env:
          GOFIPS140: certified
          GODEBUG: fips140=only
        run: go build -o "$RUNNER_TEMP/infraweave-lab" ./test/acceptance/cmd/infraweave-lab
      - name: Prove real Kubernetes ownership and readiness failure controls
        if: matrix.batch == 'kubernetes'
        run: |
          python3 test/terraform/lab/verify_kubernetes.py \
            --directory "$RUNNER_TEMP/infraweave-kubernetes-controls" --helper "$RUNNER_TEMP/infraweave-lab"
      - name: Run real OPA and worker scenarios on Terraform infrastructure
        id: batch
        run: |
          python3 test/terraform/lab/labctl.py run --batch "${{ matrix.batch }}" --fips \
            --directory "$RUNNER_TEMP/infraweave-lab-${{ matrix.batch }}" --helper "$RUNNER_TEMP/infraweave-lab"
      - name: Verify Terraform cleanup even after interruption
        if: always()
        run: |
          outcome=0
          directory="$RUNNER_TEMP/infraweave-lab-${{ matrix.batch }}"
          if [ -f "$directory/deployment.json" ]; then
            python3 test/terraform/lab/labctl.py down --directory "$directory" || outcome=$?
          fi
          for controls in "$RUNNER_TEMP/infraweave-kubernetes-controls"/a "$RUNNER_TEMP/infraweave-kubernetes-controls"/b; do
            if [ -f "$controls/deployment.json" ]; then
              python3 test/terraform/lab/labctl.py down --directory "$controls" || outcome=$?
            fi
          done
          exit "$outcome"
      - name: Retain executed scenarios and cleanup proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-${{ matrix.batch }}-lab-evidence
          path: |
            ${{ runner.temp }}/infraweave-lab-${{ matrix.batch }}/evidence
            ${{ runner.temp }}/infraweave-lab-${{ matrix.batch }}/result.json
            ${{ runner.temp }}/infraweave-lab-${{ matrix.batch }}/readiness.json
            ${{ runner.temp }}/infraweave-lab-${{ matrix.batch }}/cleanup.json
            ${{ runner.temp }}/infraweave-kubernetes-controls/controls.json
          retention-days: 7
      - name: Upload Terraform lab coverage
        if: steps.batch.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-lab-${{ matrix.batch }}
          path: ${{ runner.temp }}/infraweave-lab-${{ matrix.batch }}/coverage
          include-hidden-files: true
          retention-days: 7

  # Each complete suite has its own package deadline and runner. The stable
  # fips-only check requires every catalogue job's successful execution receipt.
  # FIPS repeats the ordinary tests, so its coverage is not merged again.
  # ref: decision 0016
  fips-unit:
    name: fips-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
      - name: Download Go modules
        uses: ./.github/actions/go-mod-download
      - name: Name the certified FIPS build cache
        id: fips_cache
        env:
          DEPS_HASH: ${{ hashFiles('go.mod', 'go.sum') }}
        run: |
          echo "path=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "prefix=fips-go-build-v1-${RUNNER_OS}-${RUNNER_ARCH}-${DEPS_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore incremental certified FIPS builds
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.fips_cache.outputs.path }}
          key: ${{ steps.fips_cache.outputs.prefix }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-unit
          restore-keys: |
            ${{ steps.fips_cache.outputs.prefix }}-${{ github.sha }}-${{ github.run_id }}-
            ${{ steps.fips_cache.outputs.prefix }}-
      - name: Check progress reporting and fail-closed receipts
        run: python3 -m unittest discover -s .github -p 'test_*.py'
      - name: Read the complete acceptance catalogue
        id: matrix
        env:
          GOFIPS140: certified
          GODEBUG: fips140=only
        run: |
          matrix=$(go run ./test/acceptance/cmd/fips-matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Unit tests in fips140=only mode
        id: suite
        run: |
          date +%s > "$RUNNER_TEMP/fips-started"
          make test FIPS=1
      - name: Record execution and tested revision
        if: always()
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
          SUITE_STATUS: ${{ steps.suite.outcome }}
        run: |
          python3 .github/fips_gate.py record --shard "unit" --status "$SUITE_STATUS" \
            --started "$RUNNER_TEMP/fips-started" --directory "$RUNNER_TEMP/validation"
      - name: Upload tested revision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-fips-unit-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation/revision.json
          retention-days: 7
      - name: Retain bounded execution receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fips-result-unit-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation/result.json
          if-no-files-found: error
          retention-days: 7
      - name: Save passing certified FIPS builds
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.fips_cache.outputs.path }}
          key: ${{ steps.fips_cache.outputs.prefix }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-unit

  fips-tests:
    name: fips-${{ matrix.shard }}
    needs: [fips-unit]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fips-unit.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
      - name: Download Go modules
        uses: ./.github/actions/go-mod-download
      - name: Name the certified FIPS build cache
        id: fips_cache
        env:
          DEPS_HASH: ${{ hashFiles('go.mod', 'go.sum') }}
        run: |
          echo "path=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "prefix=fips-go-build-v1-${RUNNER_OS}-${RUNNER_ARCH}-${DEPS_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore incremental certified FIPS builds
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.fips_cache.outputs.path }}
          key: ${{ steps.fips_cache.outputs.prefix }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          restore-keys: |
            ${{ steps.fips_cache.outputs.prefix }}-${{ github.sha }}-${{ github.run_id }}-
            ${{ steps.fips_cache.outputs.prefix }}-
      - name: Execute one complete certified FIPS suite
        id: suite
        env:
          INFRAWEAVE_ACCEPT_REQUIRE_DOCKER: '1'
          INFRAWEAVE_ACCEPT_PROGRESS: '1'
          SHARD: ${{ matrix.shard }}
          PARTITION: ${{ matrix.partition }}
        run: |
          set -euo pipefail
          date +%s > "$RUNNER_TEMP/fips-started"
          python3 .github/accept_progress.py test/acceptance/out &
          progress=$!
          trap 'kill "$progress" 2>/dev/null || true; wait "$progress" 2>/dev/null || true' EXIT
          if [ "$SHARD" = native ]; then
            make accept-native FIPS=1
          else
            make accept FIPS=1 PARTITION="$PARTITION"
          fi
      - name: Upload failed-scenario evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accept-evidence-fips-${{ matrix.shard }}-${{ github.run_attempt }}
          path: test/acceptance/out
          retention-days: 7
      - name: Record execution and tested revision
        if: always()
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
          SUITE_STATUS: ${{ steps.suite.outcome }}
        run: |
          python3 .github/fips_gate.py record --shard "${{ matrix.shard }}" --status "$SUITE_STATUS" \
            --started "$RUNNER_TEMP/fips-started" --directory "$RUNNER_TEMP/validation"
      - name: Upload tested revision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-fips-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation/revision.json
          retention-days: 7
      - name: Retain bounded execution receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fips-result-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation/result.json
          if-no-files-found: error
          retention-days: 7
      - name: Save passing certified FIPS builds
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.fips_cache.outputs.path }}
          key: ${{ steps.fips_cache.outputs.prefix }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}

  fips-only:
    name: fips-only
    if: always()
    needs: [fips-unit, fips-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download every FIPS attempt receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fips-result-*
          path: ${{ runner.temp }}/fips-results
      - name: Require every declared suite to pass on the exact tested source
        shell: bash
        env:
          FIPS_CHILDREN: ${{ toJSON(needs) }}
          FIPS_MATRIX: ${{ needs.fips-unit.outputs.matrix }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          python3 .github/fips_gate.py check --directory "$RUNNER_TEMP/fips-results" --matrix "$FIPS_MATRIX" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain aggregate timings and receipt provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fips-summary-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fips-results/summary.json
          retention-days: 7

  # The sqltest suites and accept-core on the next PostgreSQL major, its
  # beta or release candidate until it is generally available. It reports
  # and never blocks: gate does not need it and its coverage is not merged,
  # so a floor raise is never a surprise and an upstream regression never
  # stops a merge.
  # ref: decisions 0005 and 0016
  postgres-next:
    name: 'postgres-next (${{ matrix.partition }})'
    strategy:
      fail-fast: false
      matrix:
        partition: [core, identity, native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      # Preserve both feature cohorts and every native SQL contract.
      - name: Acceptance on the next major
        id: accept
        env:
          INFRAWEAVE_POSTGRES: next
          INFRAWEAVE_ACCEPT_REQUIRE_DOCKER: '1'
          PARTITION: ${{ matrix.partition }}
        run: |
          if [ "$PARTITION" = native ]; then
            make accept-native
          else
            make accept PARTITION="$PARTITION"
          fi

      - name: Record tested revision
        if: always()
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/validation"
          jq -n --arg head "$PR_HEAD" --arg base "$PR_BASE" \
            --arg checkout "$(git rev-parse HEAD)" --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{head:$head,base:$base,checkout:$checkout,tree:$tree,run:$run,attempt:$attempt}' \
            > "$RUNNER_TEMP/validation/revision.json"

      - name: Upload tested revision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-postgres-next-${{ matrix.partition }}
          path: ${{ runner.temp }}/validation/revision.json
          retention-days: 7

      - name: Report the PostgreSQL version
        if: always()
        env:
          OUTCOME: ${{ steps.accept.outcome }}
        run: |
          img=$(sed -nE 's/^[[:space:]]*ImagePostgresNext = "([^"]+)"/\1/p' test/deps/images.go)
          version=$(docker run --rm --entrypoint postgres "$img" -V)
          line="postgres-next ran on ${version} (${img%@*}): ${OUTCOME}."
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

  # A recorded capability state is a claim that the acceptance results must
  # back, so parity runs on the merged results of every partition.
  parity:
    name: 'parity'
    needs: [accept]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Download every partition's results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cover-accept-*
          path: partitions

      - name: Merge the cucumber reports
        run: |
          set -euo pipefail
          mkdir -p cover/accept
          jq -s 'add' partitions/*/cucumber.json > cover/accept/cucumber.json
          jq -r '"\(length) features, \([.[].elements[]?] | length) scenarios"' cover/accept/cucumber.json

      - name: Parity outcomes and the state check
        run: make verify-parity

  reference:
    name: 'Spacelift reference up to date'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      # Offline: regenerates both products' references from the committed
      # snapshots and diffs, so an edit to either rest-mapping.yaml, the Flows
      # schemas.yaml or the generator without `make reference` (or
      # `make reference-inventory` for the data-model inventory and the two
      # registers) fails here rather than shipping a stale spec or inventory.
      - name: Verify the generated reference
        run: make verify-reference

  generated:
    name: 'Generated code up to date'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      # Rebundles the fragments and reruns oapi-codegen and stubgen, so a
      # fragment edited without `make generate` fails here rather than
      # leaving the server out of step with its spec.
      - name: Verify the generated bundle, server, client and stubs
        run: make verify-generate

  lint:
    name: 'Lint (blocking)'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      # The linter version lives in a plain file so the deps refresh job can
      # move it without the workflows permission a workflow edit would need.
      - name: Linter version
        id: lintver
        run: echo "version=$(tr -d '[:space:]' < .github/golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.lintver.outputs.version }}
          args: --config=.golangci.yml --new=false --fix=false

      # The fixtures prove each depguard rule and the time.Sleep ban fire;
      # the action above put golangci-lint on PATH.
      - name: Lint fixtures
        run: make lint-fixtures

      # golines wraps a line longer than its max-len but never joins one, so
      # sig-check keeps each signature that fits on one line there.
      - name: Signatures
        run: make sig-check

      # The wrapper would print each command's output twice.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # Every lab root the scheduled cloud and VCS jobs apply, against its
      # committed lock file.
      - name: Validate the lab roots
        run: make labs-cloud labs-vcs

  vuln:
    name: 'govulncheck'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: govulncheck
        run: make vuln

  build:
    name: 'Cross-compile'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Build every cmd/* binary for every release platform (CGO disabled)
        run: make build

  coverage:
    name: 'Coverage gate (≥95% total, ≥90% per package)'
    needs: [unit, accept, native, lab-batch]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Download every coverage directory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cover-*
          path: cover

      - name: Merge and enforce the gate
        run: make cover

  # Which of the path-dependent jobs the change needs: images when it
  # touches deploy/images/ or this workflow. A run with no base commit to
  # compare against, a dispatch or a branch's first push, needs them all.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.diff.outputs.images }}
      image_matrix: ${{ steps.diff.outputs.image_matrix }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Diff against the base
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          images=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null &&
            git diff --quiet "$BASE" HEAD -- deploy/images .github/workflows/quality-gate.yml \
              ':(exclude)deploy/images/images.lock.json' \
              ':(exclude)deploy/images/upstream.json' \
              ':(exclude)deploy/images/README.md' \
              ':(exclude)deploy/images/IMPLEMENTATION.md'; then
            images=false
          fi
          echo "images=$images" | tee -a "$GITHUB_OUTPUT"
          echo "image_matrix=$(python3 deploy/images/imagectl.py matrix)" >> "$GITHUB_OUTPUT"
          python3 -m unittest discover -s tools/runnerimages -p 'test_*.py'
          if [ "$images" = true ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python3 deploy/images/imagectl.py validate-revision --base "$BASE"
          fi

  # infraweave's runner images, each built for both platforms a worker runs
  # on, arm64 under QEMU, and held to the runner image contract by
  # deploy/images/contract.sh in a container of each. gate requires it when
  # it runs.
  # ref: decision 0008 § "Runner images"
  images:
    name: 'Runner image (${{ matrix.candidate.id }}, ${{ matrix.platform }})'
    needs: [changes]
    if: needs.changes.outputs.images == 'true'
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(needs.changes.outputs.image_matrix).include }}
        platform: [linux/amd64, linux/arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Build
        env:
          IMAGE: ${{ matrix.candidate.kind }}
          VERSION: ${{ matrix.candidate.version }}
          IMAGE_ID: ${{ matrix.candidate.id }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 deploy/images/imagectl.py generate --check
          python3 deploy/images/imagectl.py build "$IMAGE" --platform "$PLATFORM" --version "$VERSION" \
            --tag "infraweave-image-check:$IMAGE_ID-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Check the contract
        env:
          IMAGE: ${{ matrix.candidate.kind }}
          VERSION: ${{ matrix.candidate.version }}
          IMAGE_ID: ${{ matrix.candidate.id }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 deploy/images/imagectl.py smoke "$IMAGE" \
            "infraweave-image-check:$IMAGE_ID-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --platform "$PLATFORM" --version "$VERSION"
          echo "$IMAGE ($PLATFORM): real tool contract passed (ARM64 uses QEMU)" >> "$GITHUB_STEP_SUMMARY"

  # The worker image and chart worker-artifacts.yml publishes, built from
  # this revision without pushing: the certified FIPS binaries, each
  # platform's image run under its own architecture (arm64 under QEMU), and
  # the chart packaged with an image digest as its default and linted.
  # ref: decision 0020
  worker-artifacts:
    name: 'Worker artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
      - name: Download Go modules
        uses: ./.github/actions/go-mod-download
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - name: Check the build tooling
        run: python3 -m unittest discover -s deploy/infraweave-image -p 'test_*.py'
      - name: Build the certified FIPS binaries
        run: python3 deploy/infraweave-image/build.py binaries --version 0.0.0-check --out dist
      - name: Build and run each platform's image
        run: |
          for platform in linux/amd64 linux/arm64; do
            tag="check-${platform#linux/}"
            python3 deploy/infraweave-image/build.py build --repository infraweave.test/worker --tag "$tag" \
              --version 0.0.0-check --context dist --platform "$platform"
            python3 deploy/infraweave-image/build.py smoke "infraweave.test/worker:$tag" \
              --platform "$platform" --version 0.0.0-check | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Package the chart pinned to a digest and lint it
        run: |
          image="ghcr.io/weaveplatform/infraweave-worker@sha256:$(sha256sum dist/SHA256SUMS | cut -c1-64)"
          python3 deploy/infraweave-image/build.py chart --version 0.0.0-check --image "$image" --out charts
          chart=charts/infraweave-workers-0.0.0-check.tgz
          helm lint --strict "$chart" --set clusterID=check --set 'watchNamespaces={workers}'
          helm template check "$chart" --namespace workers --set clusterID=check --set 'watchNamespaces={workers}' \
            | grep -q "image: \"$image\""

  # The server image server-image.yml publishes, built from this revision
  # without pushing: the certified FIPS binaries, and each platform's image
  # (arm64 under QEMU) started with only --config on a read-only root file
  # system against PostgreSQL, until /readyz answers on the admin port.
  # ref: decision 0020
  server-image:
    name: 'Server image'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
      - name: Download Go modules
        uses: ./.github/actions/go-mod-download
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Build the certified FIPS binaries
        run: python3 deploy/infraweave-image/build.py binaries --version 0.0.0-check --out dist
      - name: Build each platform's image and start it on PostgreSQL
        run: |
          for platform in linux/amd64 linux/arm64; do
            tag="check-${platform#linux/}"
            python3 deploy/infraweave-image/build.py build --kind server --repository infraweave.test/server \
              --tag "$tag" --version 0.0.0-check --context dist --platform "$platform"
            python3 deploy/infraweave-image/build.py smoke "infraweave.test/server:$tag" --kind server \
              --platform "$platform" --version 0.0.0-check | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # images is the one job that may be skipped: it is when the change leaves
  # the image definitions alone.
  gate:
    name: 'Quality gate'
    if: always()
    needs: [unit, accept, native, lab-batch, fips-only, postgres-next, parity, reference, generated, lint, vuln, build, coverage, changes, images, worker-artifacts, server-image]
    runs-on: ubuntu-latest
    steps:
      - name: Every gate job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e '.changes.outputs.images as $images | to_entries | all(.value.result == "success"
            or (.key == "images" and $images == "false" and .value.result == "skipped"))' \
            <<<"$NEEDS" >/dev/null || { echo "a gate job did not succeed"; exit 1; }
