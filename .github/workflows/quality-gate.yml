name: go | Quality gate

# Every pull request passes vet, blocking lint, unit tests on Linux, macOS and
# Windows, govulncheck, a cross-compile of every cmd/* binary, and the merged
# coverage gate (>=95% total, >=90% per package), the acceptance partitions
# against real dependencies in Docker, the unit tests and every partition
# again in FIPS 140-only mode, the parity check over their results, and the
# runner images when their definitions change. The `gate` job is the single
# required status check: make it required in branch protection. Every
# required job is in its `needs` and, when it produces coverage, in the
# coverage job's.
# ref: decision 0016

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'
  # Every test binary removes its own containers, and a runner's containers
  # end with the runner. Ryuk adds nothing here, and its one reaper per
  # go test invocation, shared by package binaries running in parallel,
  # fails a package that starts while another's reaper is exiting: "the
  # container name /reaper_<session> is already in use".
  TESTCONTAINERS_RYUK_DISABLED: 'true'

jobs:
  unit:
    name: 'Unit tests (${{ matrix.os }})'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Vet
        run: go vet ./...

      - name: Unit tests (race, shuffle, coverage)
        shell: bash
        run: make test

      - name: Upload unit coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-unit-${{ matrix.os }}
          path: cover/unit
          include-hidden-files: true
          retention-days: 7

  # The acceptance partitions. A scenario runs in the first of runs,
  # integrations and core that lists one of its tags; TestUnitFeaturePartitions
  # fails a tag no partition lists. A partition near its timeout splits by
  # tag into two jobs; scenarios are never dropped to fit.
  # ref: decision 0016
  accept:
    name: 'accept-${{ matrix.partition }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: core
            timeout: 20
          - partition: runs
            timeout: 30
          - partition: integrations
            timeout: 20
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # The runner has Docker, so a scenario skipped for want of a daemon
      # fails the job rather than passing unseen.
      - name: Acceptance partition ${{ matrix.partition }}
        env:
          INFRAWEAVE_ACCEPT_REQUIRE_DOCKER: '1'
        run: make accept PARTITION=${{ matrix.partition }}

      # go test shows a passing test's output only with -v, so the count
      # comes from the partition's report, to the log and the job summary.
      - name: Report the partition's scenarios
        if: success()
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          n=$(jq '[.[].elements[]?] | length' cover/accept/cucumber.json)
          if [ "$n" -eq 0 ]; then
            line="accept-${PARTITION} has no scenarios yet."
          else
            line="accept-${PARTITION} ran ${n} scenarios."
          fi
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failed-scenario evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accept-evidence-${{ matrix.partition }}
          path: test/acceptance/out
          retention-days: 7

      # cover/accept also holds the partition's cucumber.json, which the
      # parity job reads.
      - name: Upload acceptance coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-accept-${{ matrix.partition }}
          path: cover/accept
          include-hidden-files: true
          retention-days: 7

  # The unit tests and every acceptance partition again, with every binary
  # built with the certified FIPS 140-3 module and every process in
  # fips140=only mode (make's FIPS=1), so a call to MD5, SHA-1 or another
  # refused algorithm, in product code, a test or a library, fails the
  # merge. It proves the same tests under another mode, so its coverage is
  # not uploaded and adds nothing.
  # ref: decision 0016
  fips-only:
    name: fips-only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Unit tests in fips140=only mode
        run: make test FIPS=1

      # With no PARTITION, make accept runs every TestAcc and every
      # partition's scenarios.
      - name: Every acceptance partition in fips140=only mode
        env:
          INFRAWEAVE_ACCEPT_REQUIRE_DOCKER: '1'
        run: make accept FIPS=1

      - name: Report the mode
        run: |
          GOFIPS140=certified go build -o /tmp/infraweave ./cmd/infraweave
          line="fips-only ran every suite under $(GODEBUG=fips140=only /tmp/infraweave version | tail -n 1)."
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

  # The sqltest suites and accept-core on the next PostgreSQL major, its
  # beta or release candidate until it is generally available. It reports
  # and never blocks: gate does not need it and its coverage is not merged,
  # so a floor raise is never a surprise and an upstream regression never
  # stops a merge.
  # ref: decisions 0005 and 0016
  postgres-next:
    name: postgres-next
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # make accept runs every TestAcc of the module, so the core partition
      # also runs the sqltest suites under internal/.
      - name: accept-core and the sqltest suites on the next major
        id: accept
        env:
          INFRAWEAVE_POSTGRES: next
          INFRAWEAVE_ACCEPT_REQUIRE_DOCKER: '1'
        run: make accept PARTITION=core

      - name: Report the PostgreSQL version
        if: always()
        env:
          OUTCOME: ${{ steps.accept.outcome }}
        run: |
          img=$(sed -nE 's/^[[:space:]]*ImagePostgresNext = "([^"]+)"/\1/p' test/deps/images.go)
          version=$(docker run --rm --entrypoint postgres "$img" -V)
          line="postgres-next ran on ${version} (${img%@*}): ${OUTCOME}."
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

  # A recorded capability state is a claim that the acceptance results must
  # back, so parity runs on the merged results of every partition.
  parity:
    name: 'parity'
    needs: [accept]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download every partition's results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cover-accept-*
          path: partitions

      - name: Merge the cucumber reports
        run: |
          set -euo pipefail
          mkdir -p cover/accept
          jq -s 'add' partitions/*/cucumber.json > cover/accept/cucumber.json
          jq -r '"\(length) features, \([.[].elements[]?] | length) scenarios"' cover/accept/cucumber.json

      - name: Parity outcomes and the state check
        run: make verify-parity

  reference:
    name: 'Spacelift reference up to date'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # Offline: regenerates both products' references from the committed
      # snapshots and diffs, so an edit to either rest-mapping.yaml, the Flows
      # schemas.yaml or the generator without `make reference` (or
      # `make reference-inventory` for the data-model inventory and the two
      # registers) fails here rather than shipping a stale spec or inventory.
      - name: Verify the generated reference
        run: make verify-reference

  generated:
    name: 'Generated code up to date'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # Rebundles the fragments and reruns oapi-codegen and stubgen, so a
      # fragment edited without `make generate` fails here rather than
      # leaving the server out of step with its spec.
      - name: Verify the generated bundle, server, client and stubs
        run: make verify-generate

  lint:
    name: 'Lint (blocking)'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # The linter version lives in a plain file so the deps refresh job can
      # move it without the workflows permission a workflow edit would need.
      - name: Linter version
        id: lintver
        run: echo "version=$(tr -d '[:space:]' < .github/golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.lintver.outputs.version }}
          args: --config=.golangci.yml --new=false --fix=false

      # The fixtures prove each depguard rule and the time.Sleep ban fire;
      # the action above put golangci-lint on PATH.
      - name: Lint fixtures
        run: make lint-fixtures

      # The wrapper would print each command's output twice.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # Every lab root the scheduled cloud and VCS jobs apply, against its
      # committed lock file.
      - name: Validate the lab roots
        run: make labs-cloud labs-vcs

  vuln:
    name: 'govulncheck'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: govulncheck
        run: make vuln

  build:
    name: 'Cross-compile'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Build every cmd/* binary for every release platform (CGO disabled)
        run: make build

  coverage:
    name: 'Coverage gate (≥95% total, ≥90% per package)'
    needs: [unit, accept]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download every coverage directory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cover-*
          path: cover

      - name: Merge and enforce the gate
        run: make cover

  # Which of the path-dependent jobs the change needs: images when it
  # touches deploy/images/ or this workflow. A run with no base commit to
  # compare against, a dispatch or a branch's first push, needs them all.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.diff.outputs.images }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Diff against the base
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          images=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null &&
            git diff --quiet "$BASE" HEAD -- deploy/images .github/workflows/quality-gate.yml; then
            images=false
          fi
          echo "images=$images" | tee -a "$GITHUB_OUTPUT"

  # infraweave's runner images, each built for both platforms a worker runs
  # on, arm64 under QEMU, and held to the runner image contract by
  # deploy/images/contract.sh in a container of each. gate requires it when
  # it runs.
  # ref: decision 0008 § "Runner images"
  images:
    name: 'Runner image (${{ matrix.image }}, ${{ matrix.platform }})'
    needs: [changes]
    if: needs.changes.outputs.images == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: [runner-terraform, runner-opentofu]
        platform: [linux/amd64, linux/arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Build
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: docker build --platform "$PLATFORM" -t "$IMAGE:contract" "deploy/images/$IMAGE"

      - name: Check the contract
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          line=$(docker run --rm --platform "$PLATFORM" -i "$IMAGE:contract" sh -s < deploy/images/contract.sh)
          echo "$line"
          echo "$IMAGE ($PLATFORM): $line" >> "$GITHUB_STEP_SUMMARY"

  # images is the one job that may be skipped: it is when the change leaves
  # the image definitions alone.
  gate:
    name: 'Quality gate'
    if: always()
    needs: [unit, accept, fips-only, parity, reference, generated, lint, vuln, build, coverage, changes, images]
    runs-on: ubuntu-latest
    steps:
      - name: Every gate job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e '.changes.outputs.images as $images | to_entries | all(.value.result == "success"
            or (.key == "images" and $images == "false" and .value.result == "skipped"))' \
            <<<"$NEEDS" >/dev/null || { echo "a gate job did not succeed"; exit 1; }
