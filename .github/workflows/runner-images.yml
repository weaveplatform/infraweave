name: images | Publish runners

on:
  push:
    branches: [main]
    paths:
      - 'deploy/images/**'
      - '!deploy/images/images.lock.json'
      - '!deploy/images/IMPLEMENTATION.md'
      - '!deploy/images/README.md'
      - '.github/workflows/runner-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-images-publish
  cancel-in-progress: false

jobs:
  catalog:
    if: >-
      github.repository == 'weaveplatform/infraweave' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
      reuse: ${{ steps.catalog.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: catalog
        run: |
          echo "matrix=$(python3 deploy/images/imagectl.py matrix)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import importlib.util, json, os, pathlib
          spec = importlib.util.spec_from_file_location('imagectl', 'deploy/images/imagectl.py')
          ctl = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(ctl)
          path = pathlib.Path('deploy/images/images.lock.json')
          reuse = path.exists() and all(e['recipe'] == ctl.recipe() for e in json.loads(path.read_text())['images'].values())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('reuse=' + str(reuse).lower() + '\n')
          PY

  build:
    needs: catalog
    if: needs.catalog.outputs.reuse != 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate publisher
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build immutable preview with provenance and SPDX SBOM
        env:
          KIND: ${{ matrix.kind }}
          VERSION: ${{ matrix.version }}
          IMAGE_ID: ${{ matrix.id }}
        run: |
          python3 deploy/images/imagectl.py build "$KIND" \
            --platform linux/amd64,linux/arm64 --push \
            --tag "ghcr.io/weaveplatform/infraweave-runner-$KIND:preview-$IMAGE_ID-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --version "$VERSION" --metadata "$IMAGE_ID.json"
      - name: Execute both platform contracts (ARM64 emulated)
        env:
          KIND: ${{ matrix.kind }}
          VERSION: ${{ matrix.version }}
          IMAGE_ID: ${{ matrix.id }}
        run: |
          digest=$(jq -r '.["containerimage.digest"]' "$IMAGE_ID.json")
          ref="ghcr.io/weaveplatform/infraweave-runner-$KIND@$digest"
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$ref"
            python3 deploy/images/imagectl.py smoke "$KIND" "$ref" --platform "$platform" --version "$VERSION"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-metadata-${{ matrix.id }}
          path: ${{ matrix.id }}.json
          retention-days: 30

  verify-publish:
    needs: [catalog, build]
    if: >-
      always() && needs.catalog.result == 'success' &&
      (needs.build.result == 'success' || needs.catalog.outputs.reuse == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Authenticate publisher
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.catalog.outputs.reuse != 'true'
        with:
          pattern: runner-metadata-*
          path: metadata
          merge-multiple: true
      - name: Record the exact verified indexes
        env:
          REUSE: ${{ needs.catalog.outputs.reuse }}
        run: |
          if [ "$REUSE" = true ]; then
            cp deploy/images/images.lock.json candidate-lock.json
          else
            python3 deploy/images/imagectl.py record metadata --output candidate-lock.json
          fi
      - name: Verify public visibility, repository association and anonymous pulls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # First publication needs the documented one-time package-admin
          # visibility change. Retry leaves time to perform that setup.
          for kind in terraform opentofu pulumi ansible test-support; do
            package="infraweave-runner-$kind"
            public=false
            for attempt in $(seq 1 30); do
              if gh api "orgs/weaveplatform/packages/container/$package" \
                --jq '.visibility == "public" and .repository.full_name == "weaveplatform/infraweave"' | grep -qx true; then
                public=true
                break
              fi
              echo "Waiting for package-admin public visibility: $package"
              sleep 20
            done
            [ "$public" = true ]
          done
          python3 - <<'PY'
          import importlib.util, json
          spec = importlib.util.spec_from_file_location('imagectl', 'deploy/images/imagectl.py')
          ctl = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(ctl)
          for entry in list(json.load(open('candidate-lock.json'))['images'].values()) + json.load(open('candidate-lock.json')).get('releases', []):
              ctl.attestations(entry['reference'], entry)
              for platform in ctl.PLATFORMS:
                  ctl.anonymous(entry['reference'], platform)
          PY
      - name: Sign and verify exact indexes with this workflow's OIDC identity
        run: |
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/runner-images.yml@$GITHUB_REF"
          jq -r '[.images[].reference, .releases[]?.reference] | unique[]' candidate-lock.json | while IFS= read -r ref; do
            cosign sign --yes "$ref"
            cosign verify --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref"
          done
      - name: Verify real GHCR promotion, duplicate and failure contracts
        run: python3 tools/runnerimages/accept_promotion.py candidate-lock.json
      - name: Promote main's verified recipes without rebuilding
        if: github.ref == 'refs/heads/main'
        run: python3 deploy/images/imagectl.py promote candidate-lock.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-images-lock
          path: candidate-lock.json
          retention-days: 90
      - name: Publication summary
        run: |
          echo 'Verified multi-platform runner indexes (anonymous pulls, SPDX, provenance, Sigstore):' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.images | to_entries[] | "- \(.key): `\(.value.reference)` (\(.value.tag))"' candidate-lock.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: github.ref == 'refs/heads/main'
        with:
          app-id: ${{ vars.RP_APP_ID }}
          private-key: ${{ secrets.RP_APP_PRIVATE_KEY }}
      - name: Open the CI-checked consumer pin PR
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Supply the App token through a temporary askpass, never through
          # git's remote URL or command arguments. App pushes trigger PR CI.
          askpass=$(mktemp)
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token ;; *) printf '%s\n' "$GH_TOKEN" ;; esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          cp candidate-lock.json deploy/images/images.lock.json
          python3 deploy/images/imagectl.py generate
          cat > /tmp/image-pins-body.md <<'EOF'
          Update product defaults and acceptance harnesses to the exact runner indexes that passed real tool execution on AMD64 and ARM64, anonymous GHCR pulls, SPDX/provenance checks and Sigstore signature verification.

          Build inputs remain unchanged. Required PR CI verifies application behavior against these images before this pin update can merge. Previous released digests remain available for rollback.
          EOF
          bash tools/runnerimages/pr.sh deps/runner-image-pins \
            'chore(images): update verified runner digest pins' /tmp/image-pins-body.md \
            deploy/images/images.lock.json internal/platform/runnerimages/images.gen.go
