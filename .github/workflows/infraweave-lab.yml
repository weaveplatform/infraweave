name: go | infraweave labs

# Each night on main, every VCS provider against its real service. Fresh
# Terraform platform batches supply PostgreSQL, object storage and TLS Gitea. The
# Terraform root in test/terraform/vcs/<root> makes two private repositories
# for the run and pushes seed.sh's history to each, then the provider's
# TestAcc<Provider>Cloud runs the source contract and checks a run
# credential's reach, then @vcs-lab source, signed-webhook and native-feedback
# scenarios drive real runs through infraweave. Destroy always runs, and a
# sweep first deletes any lab repository a day old that an earlier run
# left. Bitbucket Data Center is the one provider with no hosted service:
# the job starts its image with the lab's licence.
#
# The lab's names and credentials are the vcs-lab environment's
# secrets, which the logs mask; a value derived from one is masked
# before use. A provider without its secrets is skipped: its job passes
# having run nothing, and the run's summary names the secrets it lacks.
# The job is informational: the quality gate does not need it, and a
# failure opens an issue per provider, or comments on the open one.
# ref: decision 0016
on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared with the preceding workflow name during migration.
  group: vcs-lab
  cancel-in-progress: false

env:
  GOWORK: 'off'

jobs:
  provider:
    name: 'infraweave-lab VCS ${{ matrix.provider }}'
    # The environment's branch rule admits only main.
    if: ${{ github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: github
            root: github
            test: TestAccGitHubLab
          - provider: gitlab
            root: gitlab
            test: TestAccGitLabLab
          - provider: bitbucket-cloud
            root: bitbucketcloud
            test: TestAccBitbucketCloudLab
          - provider: azure-devops
            root: azuredevops
            test: TestAccAzureDevOpsLab
          - provider: bitbucket-dc
            root: bitbucketdc
            test: TestAccBitbucketDCLab
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: vcs-lab
    permissions:
      contents: read
      issues: write
    env:
      PROVIDER: ${{ matrix.provider }}
      ROOT: test/terraform/vcs/${{ matrix.root }}
      LAB_GITHUB_ORGANIZATION: ${{ secrets.VCS_GITHUB_ORGANIZATION }}
      LAB_GITHUB_ADMIN_TOKEN: ${{ secrets.VCS_GITHUB_ADMIN_TOKEN }}
      LAB_GITHUB_APP_ID: ${{ secrets.VCS_GITHUB_APP_ID }}
      LAB_GITHUB_APP_PRIVATE_KEY: ${{ secrets.VCS_GITHUB_APP_PRIVATE_KEY }}
      INFRAWEAVE_LAB_GITHUB_READY: ${{ vars.VCS_GITHUB_HOOK_READY }}
      INFRAWEAVE_LAB_GITHUB_PARKED_URL: ${{ vars.VCS_GITHUB_HOOK_PARKED_URL }}
      LAB_BITBUCKET_CLOUD_WORKSPACE: ${{ secrets.VCS_BITBUCKET_CLOUD_WORKSPACE }}
      LAB_BITBUCKET_CLOUD_PROJECT_KEY: ${{ secrets.VCS_BITBUCKET_CLOUD_PROJECT_KEY }}
      LAB_BITBUCKET_CLOUD_EMAIL: ${{ secrets.VCS_BITBUCKET_CLOUD_EMAIL }}
      LAB_BITBUCKET_CLOUD_API_TOKEN: ${{ secrets.VCS_BITBUCKET_CLOUD_API_TOKEN }}
      LAB_AZURE_DEVOPS_ORGANIZATION_URL: ${{ secrets.VCS_AZURE_DEVOPS_ORGANIZATION_URL }}
      LAB_AZURE_DEVOPS_PROJECT: ${{ secrets.VCS_AZURE_DEVOPS_PROJECT }}
      LAB_AZURE_DEVOPS_PAT: ${{ secrets.VCS_AZURE_DEVOPS_PAT }}
      LAB_BITBUCKET_DC_LICENSE: ${{ secrets.VCS_BITBUCKET_DC_LICENSE }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Read the pinned Terraform release
        id: pins
        run: |
          version=$(sed -n '/^var Terraform = /,/^}/ s/.*Version: *"\([^"]*\)".*/\1/p' test/deps/tools.go)
          [ -n "$version" ] || exit 1
          echo "terraform=$version" >> "$GITHUB_OUTPUT"

      # The wrapper would print each command's output again, outputs
      # included, after the masks the job sets.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: ${{ steps.pins.outputs.terraform }}

      # Lists the provider's missing secrets rather than failing at its
      # first call with an error that names none of them.
      - name: Read the provider's configuration
        id: config
        run: |
          case "$PROVIDER" in
            github) need="LAB_GITHUB_ORGANIZATION LAB_GITHUB_ADMIN_TOKEN LAB_GITHUB_APP_ID LAB_GITHUB_APP_PRIVATE_KEY" ;;
            # The job makes the GitLab container's every credential.
            gitlab) need="" ;;
            bitbucket-cloud) need="LAB_BITBUCKET_CLOUD_WORKSPACE LAB_BITBUCKET_CLOUD_PROJECT_KEY LAB_BITBUCKET_CLOUD_EMAIL LAB_BITBUCKET_CLOUD_API_TOKEN" ;;
            azure-devops) need="LAB_AZURE_DEVOPS_ORGANIZATION_URL LAB_AZURE_DEVOPS_PROJECT LAB_AZURE_DEVOPS_PAT" ;;
            bitbucket-dc) need="LAB_BITBUCKET_DC_LICENSE" ;;
          esac
          missing=""
          for v in $need; do
            [ -n "${!v}" ] || missing="$missing VCS_${v#LAB_}"
          done
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # A lab the maintainer has not set up is skipped rather than failed,
      # so a red run is a provider that broke. Every later step runs only
      # for a configured provider.
      - name: Skip, not configured
        if: ${{ steps.config.outputs.configured != 'true' }}
        env:
          MISSING: ${{ steps.config.outputs.missing }}
        run: |
          line="vcs-lab ${PROVIDER} is skipped: the vcs-lab environment's secrets ${MISSING} are not set. test/terraform/vcs/README.md describes the lab and lists them."
          echo "::notice title=vcs-lab ${PROVIDER} skipped::${line}"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      # Each provider's Terraform credentials, its push credentials for
      # seed.sh, and the variables its Terraform root and sweep.sh read.
      - name: Set the provider's environment
        if: ${{ steps.config.outputs.configured == 'true' }}
        run: |
          set -euo pipefail
          {
            echo "TF_VAR_suffix=$(date +%s)-${GITHUB_RUN_ID}"
            echo "TF_IN_AUTOMATION=1"
            case "$PROVIDER" in
              github)
                echo "TF_VAR_token=$LAB_GITHUB_ADMIN_TOKEN"
                echo "TF_VAR_organization=$LAB_GITHUB_ORGANIZATION"
                echo "SEED_USER=x-access-token"
                echo "SEED_TOKEN=$LAB_GITHUB_ADMIN_TOKEN"
                ;;
              bitbucket-cloud)
                echo "BITBUCKET_USERNAME=$LAB_BITBUCKET_CLOUD_EMAIL"
                echo "BITBUCKET_PASSWORD=$LAB_BITBUCKET_CLOUD_API_TOKEN"
                echo "TF_VAR_workspace=$LAB_BITBUCKET_CLOUD_WORKSPACE"
                echo "TF_VAR_project_key=$LAB_BITBUCKET_CLOUD_PROJECT_KEY"
                echo "SEED_USER=x-bitbucket-api-token-auth"
                echo "SEED_TOKEN=$LAB_BITBUCKET_CLOUD_API_TOKEN"
                ;;
              azure-devops)
                echo "AZDO_ORG_SERVICE_URL=$LAB_AZURE_DEVOPS_ORGANIZATION_URL"
                echo "AZDO_PERSONAL_ACCESS_TOKEN=$LAB_AZURE_DEVOPS_PAT"
                echo "TF_VAR_project=$LAB_AZURE_DEVOPS_PROJECT"
                echo "SEED_USER=pat"
                echo "SEED_TOKEN=$LAB_AZURE_DEVOPS_PAT"
                ;;
            esac
          } >> "$GITHUB_ENV"

      # start-gitlab.sh makes the container's certificate and the run's
      # administrator token, and writes the variables that name them.
      - name: Start GitLab
        if: ${{ steps.config.outputs.configured == 'true' && matrix.provider == 'gitlab' }}
        run: |
          set -euo pipefail
          image=$(sed -nE 's/^[[:space:]]*ImageGitLabCE = "([^"]+)"/\1/p' test/deps/images.go)
          lab="$RUNNER_TEMP/gitlab"
          test/terraform/vcs/start-gitlab.sh "$image" "$lab"
          echo "::add-mask::$(sed -n 's/^GITLAB_TOKEN=//p' "$lab/env")"
          cat "$lab/env" >> "$GITHUB_ENV"

      # The container serves HTTPS under a certificate the job makes,
      # which Terraform, git and the tests trust through a bundle of it
      # and the system's roots; the system administrator's password is the
      # run's own. Bitbucket's first start, with no search server, takes a
      # few minutes before /status answers RUNNING.
      - name: Start Bitbucket Data Center
        if: ${{ steps.config.outputs.configured == 'true' && matrix.provider == 'bitbucket-dc' }}
        run: |
          set -euo pipefail
          image=$(sed -nE 's/^[[:space:]]*ImageBitbucketDC = "([^"]+)"/\1/p' test/deps/images.go)
          lab="$RUNNER_TEMP/bitbucket"
          mkdir -p "$lab"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          keystore=$(openssl rand -hex 16)
          echo "::add-mask::$keystore"
          openssl req -x509 -newkey rsa:3072 -nodes -days 1 -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$lab/key.pem" -out "$lab/cert.pem" 2>/dev/null
          openssl pkcs12 -export -name bitbucket -inkey "$lab/key.pem" -in "$lab/cert.pem" \
            -out "$lab/lab.p12" -passout "pass:$keystore"
          chmod 0644 "$lab/lab.p12"
          cat /etc/ssl/certs/ca-certificates.crt "$lab/cert.pem" > "$lab/bundle.pem"
          printf '%s' "$LAB_BITBUCKET_DC_LICENSE" > "$lab/licence"
          docker run -d --name bitbucket -p 7990:7990 \
            -v "$lab/lab.p12:/opt/lab.p12:ro" \
            -e SERVER_SSL_ENABLED=true -e SERVER_SSL_KEY_STORE=/opt/lab.p12 \
            -e SERVER_SSL_KEY_STORE_TYPE=PKCS12 -e SERVER_SSL_KEY_ALIAS=bitbucket \
            -e SERVER_SSL_KEY_STORE_PASSWORD="$keystore" -e SERVER_SSL_KEY_PASSWORD="$keystore" \
            -e SEARCH_ENABLED=false \
            -e SETUP_DISPLAYNAME='infraweave lab' -e SETUP_BASEURL=https://localhost:7990 \
            -e SETUP_LICENSE="$(cat "$lab/licence")" \
            -e SETUP_SYSADMIN_USERNAME=admin -e SETUP_SYSADMIN_PASSWORD="$password" \
            -e SETUP_SYSADMIN_DISPLAYNAME='infraweave lab' \
            -e SETUP_SYSADMIN_EMAILADDRESS=lab@infraweave.invalid \
            "$image" > /dev/null
          rm "$lab/licence"
          for _ in $(seq 120); do
            state=$(curl -fsS --cacert "$lab/cert.pem" https://localhost:7990/status 2>/dev/null | jq -r .state || true)
            [ "$state" = RUNNING ] && break
            sleep 5
          done
          if [ "$state" != RUNNING ]; then
            echo "Bitbucket Data Center did not start: its state is ${state:-no answer}"
            docker logs --tail 50 bitbucket
            exit 1
          fi
          {
            echo "TF_VAR_admin_password=$password"
            echo "TF_VAR_ca_file=$lab/cert.pem"
            echo "SEED_USER=admin"
            echo "SEED_TOKEN=$password"
            echo "GIT_SSL_CAINFO=$lab/bundle.pem"
            echo "INFRAWEAVE_TEST_VCS_CA_FILE=$lab/cert.pem"
          } >> "$GITHUB_ENV"

      - name: Build the verification-only lab helper
        id: helper
        if: ${{ steps.config.outputs.configured == 'true' }}
        run: go build -o "$RUNNER_TEMP/infraweave-lab" ./test/acceptance/cmd/infraweave-lab

      - name: Validate the dedicated App setup attestation
        if: ${{ steps.config.outputs.configured == 'true' && matrix.provider == 'github' }}
        run: '"$RUNNER_TEMP/infraweave-lab" app-readiness'

      - name: Open the run's webhook delivery path
        id: delivery
        if: ${{ steps.config.outputs.configured == 'true' }}
        run: |
          set -euo pipefail
          umask 077
          lab=$(mktemp -d "$RUNNER_TEMP/vcs-lab-delivery.XXXXXXXX")
          mkdir -p "$RUNNER_TEMP/vcs-lab-hooks"
          {
            echo "INFRAWEAVE_LAB_TUNNEL_SESSION=$lab"
            echo "INFRAWEAVE_LAB_HOOK_JOURNALS=$RUNNER_TEMP/vcs-lab-hooks"
            echo "INFRAWEAVE_LAB_TERRAFORM_ROOT=$GITHUB_WORKSPACE/$ROOT"
          } >> "$GITHUB_ENV"
          case "$PROVIDER" in
            gitlab|bitbucket-dc)
              container=gitlab
              [ "$PROVIDER" != bitbucket-dc ] || container=bitbucket
              gateway=$(docker inspect "$container" --format '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}')
              [ -n "$gateway" ] || exit 1
              echo "INFRAWEAVE_LAB_PUBLIC_URL=http://$gateway:8765" >> "$GITHUB_ENV"
              echo 'INFRAWEAVE_LAB_WEBHOOK_LISTEN=0.0.0.0:8765' >> "$GITHUB_ENV"
              echo 'available=true' >> "$GITHUB_OUTPUT"
              ;;
            *)
              "$RUNNER_TEMP/infraweave-lab" install-tunnel --destination "$lab/cloudflared"
              "$RUNNER_TEMP/infraweave-lab" tunnel --binary "$lab/cloudflared" \
                --origin http://127.0.0.1:8765 --session-directory "$lab" > "$lab/process.log" 2>&1 &
              tunnel_job=$!
              ready=false
              for _ in $(seq 120); do
                if public=$("$RUNNER_TEMP/infraweave-lab" tunnel-url --session-directory "$lab" 2>/dev/null); then ready=true; break; fi
                [ ! -f "$lab/result.json" ] || break
                sleep 0.5
              done
              if [ "$ready" != true ]; then
                "$RUNNER_TEMP/infraweave-lab" stop-tunnel --session-directory "$lab"
                wait "$tunnel_job" 2>/dev/null || true
                echo 'available=false' >> "$GITHUB_OUTPUT"
                line="vcs-lab $PROVIDER is skipped: its account-free quick tunnel did not open."
                echo "::notice::$line"
                echo "$line" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "::add-mask::$public"
              echo "INFRAWEAVE_LAB_PUBLIC_URL=$public" >> "$GITHUB_ENV"
              echo 'INFRAWEAVE_LAB_WEBHOOK_LISTEN=127.0.0.1:8765' >> "$GITHUB_ENV"
              echo 'available=true' >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Sweep lab repositories a day old
        if: >-
          ${{ steps.config.outputs.configured == 'true' && steps.delivery.outputs.available == 'true' &&
          matrix.provider != 'gitlab' && matrix.provider != 'bitbucket-dc' }}
        run: test/terraform/vcs/sweep.sh "$PROVIDER"

      - name: Apply the lab
        id: apply
        if: ${{ steps.config.outputs.configured == 'true' && steps.delivery.outputs.available == 'true' }}
        run: |
          set -euo pipefail
          terraform -chdir="$ROOT" init -input=false -no-color > /dev/null
          terraform -chdir="$ROOT" apply -input=false -auto-approve -no-color

      # Every output the tests read, the integration's token among them,
      # is masked before it reaches the environment; the GitHub App's key
      # spans lines, so it goes in under a delimiter.
      - name: Name the lab to the tests
        if: ${{ steps.config.outputs.configured == 'true' && steps.delivery.outputs.available == 'true' }}
        run: |
          set -euo pipefail
          out() { terraform -chdir="$ROOT" output -raw "$1"; }
          put() {
            echo "::add-mask::$2"
            echo "$1=$2" >> "$GITHUB_ENV"
          }
          put INFRAWEAVE_TEST_VCS_NAMESPACE "$(out namespace)"
          put INFRAWEAVE_TEST_VCS_REPOSITORY "$(out repository)"
          put INFRAWEAVE_TEST_VCS_OTHER "$(out other)"
          case "$PROVIDER" in
            github)
              put INFRAWEAVE_TEST_VCS_USER "$LAB_GITHUB_APP_ID"
              delimiter="KEY_$(openssl rand -hex 16)"
              printf 'INFRAWEAVE_TEST_VCS_TOKEN<<%s\n%s\n%s\n' "$delimiter" \
                "$LAB_GITHUB_APP_PRIVATE_KEY" "$delimiter" >> "$GITHUB_ENV"
              ;;
            gitlab)
              put INFRAWEAVE_TEST_VCS_HOST "$(out host)"
              put INFRAWEAVE_TEST_VCS_TOKEN "$(out token)"
              ;;
            bitbucket-cloud)
              put INFRAWEAVE_TEST_VCS_USER "$LAB_BITBUCKET_CLOUD_EMAIL"
              put INFRAWEAVE_TEST_VCS_TOKEN "$LAB_BITBUCKET_CLOUD_API_TOKEN"
              ;;
            azure-devops)
              put INFRAWEAVE_TEST_VCS_HOST "$LAB_AZURE_DEVOPS_ORGANIZATION_URL"
              put INFRAWEAVE_TEST_VCS_TOKEN "$LAB_AZURE_DEVOPS_PAT"
              ;;
            bitbucket-dc)
              put INFRAWEAVE_TEST_VCS_HOST "$(out host)"
              put INFRAWEAVE_TEST_VCS_USER "$(out user)"
              put INFRAWEAVE_TEST_VCS_TOKEN "$(out token)"
              ;;
          esac

      # Each test appends to cloud.log, whose failing cases the report
      # quotes.
      - name: The source contract and a run's credential
        if: ${{ steps.config.outputs.configured == 'true' && steps.delivery.outputs.available == 'true' }}
        env:
          TEST: ${{ matrix.test }}
          PACKAGE: ./internal/vcs/internal/adapters/${{ matrix.root }}
        run: |
          set -o pipefail
          go test -count=1 -v -run "^${TEST}\$" "$PACKAGE" 2>&1 | tee -a cloud.log

      - name: A stack on the lab through infraweave
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        env:
          INFRAWEAVE_ACCEPT_REQUIRE_DOCKER: '1'
          INFRAWEAVE_ACCEPT_TAGS: '@lab:${{ matrix.provider }}'
          INFRAWEAVE_ACCEPT_PROGRESS: '1'
          INFRAWEAVE_ACCEPT_OUT: ${{ github.workspace }}/out
        run: |
          set -o pipefail
          results="lab-results/$PROVIDER"
          mkdir -p "$results"
          jq -n --arg revision "$GITHUB_SHA" --arg provider "$PROVIDER" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg opa "$(go list -m -f '{{.Version}}' github.com/open-policy-agent/opa)" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{revision:$revision,provider:$provider,attempt:$attempt,opa:$opa,run:$run}' > "$results/run.json"
          run_feature() {
            local suite_name="$1" feature_path="$2" outcome=0
            local deployment="$RUNNER_TEMP/infraweave-lab-platform/$PROVIDER/$suite_name"
            python3 test/terraform/lab/labctl.py run --batch vcs --directory "$deployment" \
              --helper "$RUNNER_TEMP/infraweave-lab" --features "$feature_path" \
              --tags "$INFRAWEAVE_ACCEPT_TAGS" 2>&1 | tee -a cloud.log || outcome=$?
            mkdir -p "$results/$suite_name"
            for report in cucumber.json progress.jsonl acceptance.log terraform.log; do
              if [ -f "$deployment/evidence/$report" ]; then
                cp "$deployment/evidence/$report" "$results/$suite_name/$report"
              fi
            done
            for report in result.json readiness.json cleanup.json; do
              if [ -f "$deployment/$report" ]; then
                cp "$deployment/$report" "$results/$suite_name/platform-$report"
              fi
            done
            return "$outcome"
          }
          # Keep immutable source history checks ahead of the real pushes.
          run_feature sources features/vcs/sources.feature
          run_feature webhooks features/vcs/webhooks.feature
          run_feature feedback features/vcs/feedback.feature

      - name: Destroy remaining Terraform platform batches
        id: destroy_platform
        if: ${{ always() && steps.helper.outcome == 'success' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for journal in "$RUNNER_TEMP/infraweave-lab-platform/$PROVIDER"/*/deployment.json; do
            python3 test/terraform/lab/labctl.py down --directory "$(dirname "$journal")"
          done

      - name: Restore the dedicated App's parked webhook
        id: restore_app
        if: ${{ always() && matrix.provider == 'github' && steps.helper.outcome == 'success' }}
        run: '"$RUNNER_TEMP/infraweave-lab" restore-app --journal-directory "$RUNNER_TEMP/vcs-lab-hooks"'

      - name: Detach run-owned repository hooks
        id: detach_hooks
        if: ${{ always() && matrix.provider != 'github' && steps.apply.outcome == 'success' }}
        run: terraform -chdir="$ROOT" apply -input=false -auto-approve -no-color -var='hook_url=' -var='hook_secret='

      # Only a run that reached apply has anything to destroy, or the root
      # initialized.
      - name: Destroy the lab
        id: destroy
        if: ${{ always() && steps.apply.outcome != 'skipped' }}
        run: terraform -chdir="$ROOT" destroy -input=false -auto-approve -no-color

      - name: Verify the lab's managed resources are absent
        id: absence
        if: ${{ always() && steps.destroy.outcome == 'success' }}
        run: |
          remaining=$(terraform -chdir="$ROOT" state list)
          if [ -n "$remaining" ]; then
            echo 'The lab still has Terraform-managed resources after destroy.'
            exit 1
          fi
          echo 'The lab has no remaining Terraform-managed resources.'

      - name: Close the run's tunnel and verify its terminal outcome
        id: stop_tunnel
        if: ${{ always() && steps.helper.outcome == 'success' && matrix.provider != 'gitlab' && matrix.provider != 'bitbucket-dc' }}
        run: |
          if [ -n "${INFRAWEAVE_LAB_TUNNEL_SESSION:-}" ]; then
            "$RUNNER_TEMP/infraweave-lab" stop-tunnel --session-directory "$INFRAWEAVE_LAB_TUNNEL_SESSION"
          fi

      - name: Stop the run's local VCS container
        id: stop_provider
        if: ${{ always() && steps.config.outputs.configured == 'true' && (matrix.provider == 'gitlab' || matrix.provider == 'bitbucket-dc') }}
        run: |
          container=gitlab
          [ "$PROVIDER" != bitbucket-dc ] || container=bitbucket
          docker rm -f "$container"

      - name: Collect executed scenarios and cleanup outcomes
        if: ${{ always() && steps.apply.outcome != 'skipped' }}
        env:
          RESTORE_APP: ${{ steps.restore_app.outcome }}
          DETACH_HOOKS: ${{ steps.detach_hooks.outcome }}
          DESTROY: ${{ steps.destroy.outcome }}
          ABSENCE: ${{ steps.absence.outcome }}
          STOP_TUNNEL: ${{ steps.stop_tunnel.outcome }}
          STOP_PROVIDER: ${{ steps.stop_provider.outcome }}
          DESTROY_PLATFORM: ${{ steps.destroy_platform.outcome }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          results="lab-results/$PROVIDER"
          mkdir -p "$results"
          reports=("$results"/*/cucumber.json)
          if [ "${#reports[@]}" -gt 0 ]; then
            jq -s 'add' "${reports[@]}" > "$results/cucumber.json"
            jq -r '"Executed \([.[].elements[]?] | length) scenarios"' "$results/cucumber.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          jq -n --arg revision "$GITHUB_SHA" --arg provider "$PROVIDER" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg restoreApp "$RESTORE_APP" --arg detachHooks "$DETACH_HOOKS" \
            --arg destroy "$DESTROY" --arg absence "$ABSENCE" --arg stopTunnel "$STOP_TUNNEL" \
            --arg stopProvider "$STOP_PROVIDER" --arg destroyPlatform "$DESTROY_PLATFORM" \
            '{revision:$revision,provider:$provider,attempt:$attempt,run:$run,restoreApp:$restoreApp,detachHooks:$detachHooks,destroy:$destroy,absence:$absence,stopTunnel:$stopTunnel,stopProvider:$stopProvider,destroyPlatform:$destroyPlatform}' \
            > "$results/cleanup.json"

      - name: Upload lab results
        if: ${{ always() && steps.apply.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vcs-lab-results-${{ matrix.provider }}
          path: lab-results/${{ matrix.provider }}
          retention-days: 14

      # One open issue per provider tracks its failing runs: the first
      # failure opens it, and each later one comments on it until a person
      # closes it. A provider that is not configured passes without an
      # issue, since nothing ran.
      - name: Open or update the provider's issue
        if: ${{ failure() && steps.config.outputs.configured == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="vcs-lab failed on ${PROVIDER}"
          failed=$(grep -E -e '--- FAIL|^[[:space:]]*Scenario:.*# ' cloud.log 2>/dev/null | sed 's/^ *//' | sort -u || true)
          # shellcheck disable=SC2016 # Markdown fences remain literal; values use printf arguments.
          body=$(printf 'The VCS provider checks failed against %s on %s: %s\n\nFailing cases:\n```\n%s\n```\n' \
            "$PROVIDER" "$SHA" "$RUN_URL" "${failed:-none recorded; the run failed outside the tests}")
          number=$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
            -q ".[] | select(.title == \"${title}\") | .number" | head -n 1)
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body "$body"
          else
            gh issue comment "$number" --body "$body"
          fi
