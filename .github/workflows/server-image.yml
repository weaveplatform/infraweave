name: images | Publish the server image

# Publishes the infraweave server image of one revision of main:
# ghcr.io/weaveplatform/infraweave, whose entrypoint is infraweave all, with
# the same certified FIPS binaries and build tooling as the worker image.
# release-please.yml calls it with a release's version; a dispatch on main
# publishes a preview of main's head. The image is pinned by digest, signed
# with this workflow's identity on main, and recorded in server-image.json,
# the contract a deployment's image input reads, such as
# test/terraform/platform/<cloud>'s image variable.
# ref: decision 0020

on:
  workflow_call:
    inputs:
      version:
        description: The release version, without its v
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-image-publish
  cancel-in-progress: false

env:
  GOWORK: 'off'
  IMAGE: ghcr.io/weaveplatform/infraweave

jobs:
  publish:
    if: github.repository == 'weaveplatform/infraweave' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Name the version
        id: version
        env:
          RELEASE: ${{ inputs.version }}
        run: |
          revision=$(git rev-parse HEAD)
          version="${RELEASE:-0.0.0-main.${revision:0:12}}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Authenticate publisher
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build the certified FIPS binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 deploy/infraweave-image/build.py binaries --version "$VERSION" --out dist
      - name: Build and push the image with provenance and SPDX SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 deploy/infraweave-image/build.py build --kind server --repository "$IMAGE" --tag "$VERSION" \
            --version "$VERSION" --context dist --push --metadata image.json
          echo "reference=$IMAGE@$(jq -r '.["containerimage.digest"]' image.json)" >> "$GITHUB_ENV"
      - name: Start both platforms' builds on PostgreSQL (ARM64 emulated)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$reference"
            python3 deploy/infraweave-image/build.py smoke "$reference" --kind server --platform "$platform" \
              --version "$VERSION"
          done
      - name: Verify public visibility, repository association and anonymous pulls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # First publication needs the documented one-time package-admin
          # visibility change. Retry leaves time to perform that setup.
          public=false
          for attempt in $(seq 1 30); do
            if gh api orgs/weaveplatform/packages/container/infraweave \
              --jq '.visibility == "public" and .repository.full_name == "weaveplatform/infraweave"' | grep -qx true; then
              public=true
              break
            fi
            echo "Waiting for package-admin public visibility: infraweave"
            sleep 20
          done
          [ "$public" = true ]
          python3 deploy/infraweave-image/build.py verify "$reference" --kind server --context dist
      - name: Sign and verify the image with this workflow's OIDC identity
        run: |
          cosign sign --yes "$reference"
          cosign verify --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/server-image.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$reference"
      - name: Record the server image contract
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 deploy/infraweave-image/build.py server-manifest --version "$VERSION" --image "$reference" \
            --context dist --out server-image.json
          cat server-image.json
      - name: Attach the contract to the release
        if: inputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "v$VERSION" server-image.json --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-image
          path: server-image.json
          retention-days: 90
      - name: Publication summary
        run: |
          {
            echo 'Verified server image (anonymous pulls, SPDX, provenance, Sigstore):'
            jq -r '"- image: `\(.image)`"' server-image.json
          } >> "$GITHUB_STEP_SUMMARY"
