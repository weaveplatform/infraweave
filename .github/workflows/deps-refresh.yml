name: deps | Refresh

# Moves everything Dependabot cannot to its latest release, and does it on the
# day a repository is born rather than at Dependabot's first scheduled run:
#
#   - the go directive, to the latest stable Go release;
#   - every module and every go.mod tool (govulncheck, go-test-coverage),
#     with go get -u;
#   - the golangci-lint version in .github/golangci-lint-version;
#   - the oapi-codegen version in the Makefile, which runs it outside go.mod;
#   - modules pinned to a branch or query in .github/deps-refresh.pins;
#   - the container images the acceptance suite and the vcs-lab job pin
#     by digest in test/acceptance/images.go.
#
# The result goes up as one PR from the org App, so the quality gate runs on
# it like any other change, and auto-merge.yml merges it when the gate
# passes. Nothing here edits workflow files: Dependabot owns action pins, and
# an App push that touched .github/workflows would need the workflows
# permission the App deliberately lacks.
on:
  # Repository birth: creating a repository from the template pushes the
  # initial commit, which creates main.
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deps-refresh
  cancel-in-progress: false

env:
  GOWORK: 'off'
  BRANCH: deps/refresh

jobs:
  refresh:
    name: '♻️ Refresh dependencies'
    # On push, only the push that created main (the repository's first commit).
    if: ${{ github.event_name != 'push' || github.event.created }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # The App token is what makes the PR trigger the quality gate; a PR
      # opened with GITHUB_TOKEN would sit with no checks and never merge.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.RP_APP_ID }}
          private-key: ${{ secrets.RP_APP_PRIVATE_KEY }}

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up the latest Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Update the go directive, modules, tools and the linter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The full patch version: setup-go installs exactly what go.mod
          # names, and a bare 1.N would let CI and laptops run a patch
          # release with known standard-library vulnerabilities.
          latest=$(go env GOVERSION | sed -E 's/^go([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')
          go mod edit -go="$latest"
          go get -u ./... tool
          # Some modules' newest version is not "latest": gVisor, for one,
          # publishes its Go module on the go branch, and its default branch
          # does not build as a module. Each line of the optional pins file is
          # a module@query applied after the general update.
          if [ -f .github/deps-refresh.pins ]; then
            grep -v -e '^#' -e '^[[:space:]]*$' .github/deps-refresh.pins | while read -r pin; do
              go get "$pin"
            done
          fi
          go mod tidy
          gh api repos/golangci/golangci-lint/releases/latest -q .tag_name > .github/golangci-lint-version
          oapi=$(gh api repos/oapi-codegen/oapi-codegen/releases/latest -q .tag_name)
          sed -i -E "s#(oapi-codegen/v2/cmd/oapi-codegen@)v[0-9.]+#\1${oapi}#" Makefile
          git status --short

      - name: Move the acceptance images to their newest releases
        run: |
          set -euo pipefail
          # pin <image> <Docker Hub repository> <release tag pattern> [tag
          # prefix] rewrites the pins of the image whose tag starts with the
          # prefix to the newest tag matching the pattern, at the digest of
          # its multi-platform index so the pin pulls on any host.
          # PostgreSQL keeps one pin per major: 18, the version floor that
          # every process mode requires, 17, the major below it that the floor
          # test refuses, and 19, the next major the postgres-next job runs.
          # The prefix, without its backslashes, also filters the tag listing
          # by name, since a major's tags can be older than the 100 most
          # recently updated.
          # ref: decision 0005
          tags() {
            curl -fsS "https://hub.docker.com/v2/repositories/$1/tags?page_size=100&ordering=last_updated&name=${2//\\/}" \
              | jq -r '.results[].name'
          }
          # repin <image> <tag> [tag prefix] moves the pin to tag.
          repin() {
            digest=$(docker buildx imagetools inspect "$1:$2" --format '{{json .Manifest}}' | jq -r .digest)
            sed -i -E "s#\"$1:${3:-}[^@\"]*@sha256:[0-9a-f]{64}\"#\"$1:$2@$digest\"#" test/acceptance/images.go
          }
          pin() {
            repin "$1" "$(tags "$2" "${4:-}" | grep -E "$3" | sort -V | tail -1)" "${4:-}"
          }
          pin postgres library/postgres '^18\.[0-9]+$' '18\.'
          pin postgres library/postgres '^17\.[0-9]+$' '17\.'
          # The next major has no general release until it ships, so its pin
          # takes the newest release, else release candidate, else beta.
          next=$(tags library/postgres 19)
          for re in '^19\.[0-9]+$' '^19rc[0-9]+$' '^19beta[0-9]+$'; do
            if grep -qE "$re" <<<"$next"; then
              pin postgres library/postgres "$re" 19
              break
            fi
          done
          pin rustfs/rustfs rustfs/rustfs '^[0-9]+\.[0-9]+\.[0-9]+$'
          pin fsouza/fake-gcs-server fsouza/fake-gcs-server '^[0-9]+\.[0-9]+\.[0-9]+$'
          pin hashicorp/vault hashicorp/vault '^[0-9]+\.[0-9]+\.[0-9]+$'
          pin motoserver/moto motoserver/moto '^[0-9]+\.[0-9]+\.[0-9]+$'
          pin gitea/gitea gitea/gitea '^[0-9]+\.[0-9]+\.[0-9]+$'
          pin atlassian/bitbucket atlassian/bitbucket '^[0-9]+\.[0-9]+\.[0-9]+$'
          # Azurite publishes to the Microsoft Artifact Registry, not
          # Docker Hub.
          repin mcr.microsoft.com/azure-storage/azurite "$(curl -fsS https://mcr.microsoft.com/v2/azure-storage/azurite/tags/list \
            | jq -r '.tags[]' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          git diff --stat test/acceptance/images.go

      - name: Open or update the refresh PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "already at latest"
            exit 0
          fi
          git config user.name "weaveplatform-release-please[bot]"
          git config user.email "weaveplatform-release-please[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -qm "chore(deps): refresh Go, modules, tools, golangci-lint and images to latest"
          git push --force -u origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create --head "$BRANCH" \
              --title "chore(deps): refresh Go, modules, tools, golangci-lint and images to latest" \
              --body "Raised by deps-refresh.yml. Merges automatically once the quality gate passes."
          fi
