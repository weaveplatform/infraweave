apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "workers.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "workers.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-controller
# Only the controller's Pods mount this account's token; run Pods mount
# none.
automountServiceAccountToken: false
