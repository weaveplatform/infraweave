# exchange 1: pool-overview (UI-triggered GraphQL query)
# variables: {"input":{"predicates":[],"orderBy":[{"field":"name","direction":"DESC"}],"fullTextSearch":"","first":50,"after":null}}
query SearchWorkerPools($input: SearchInput!) {
  publicWorkerPool {
    parallelism
    busyWorkers
    schedulableRunsCount
    __typename
  }
  searchWorkerPools(input: $input) {
    edges {
      cursor
      node {
        id
        name
        description
        spaceDetails {
          id
          name
          accessLevel
          __typename
        }
        allowedActions
        labels
        driftDetectionRunLimit
        busyWorkers
        schedulableRunsCount
        usersCount
        workersCount
        managedByK8sController
        __typename
      }
      __typename
    }
    pageInfo {
      hasNextPage
      endCursor
      __typename
    }
    __typename
  }
}

# exchange 2: pool-overview (UI-triggered GraphQL query)
# variables: {"input":{"fullTextSearch":null,"predicates":null,"fields":null}}
query SearchWorkerPoolsSuggestions($input: SearchSuggestionsInput!) {
  searchWorkerPoolsSuggestions(input: $input) {
    ...SearchSuggestionsFragment
    __typename
  }
}

fragment SearchSuggestionsFragment on SearchSuggestionsOutput {
  filteredCount
  ...SearchSuggestionsFieldsFragment
  __typename
}

fragment SearchSuggestionsFieldsFragment on SearchSuggestionsOutput {
  fields {
    name
    orderable
    filterable
    type
    possibleValuesBoolean {
      values
      counts
      __typename
    }
    possibleValuesEnum {
      values
      counts
      __typename
    }
    possibleValuesString {
      values
      counts
      __typename
    }
    possibleValuesHierarchy {
      values {
        id
        parentId
        displayValue
        __typename
      }
      counts
      directCounts
      __typename
    }
    __typename
  }
  __typename
}

