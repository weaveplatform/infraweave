# The REST call that stands for the exchange. A real capture's assertions
# follow from response.json; the example's assert the stub that serves
# GET /stacks/{stackId} until the stacks family implements it.
calls:
  - method: GET
    path: /api/v1/stacks/example-stack
    expect:
      status: 501
      problem: not-implemented
      body:
        /status: 501
        /title: not implemented
