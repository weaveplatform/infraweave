# The REST call that stands for the exchange. Its assertions follow from
# response.json: Spacelift answers a null stack for an ID the account
# lacks, which infraweave answers 404 not-found.
calls:
  - method: GET
    path: /api/v1/stacks/example-stack
    expect:
      status: 404
      problem: not-found
      body:
        /status: 404
        /title: not found
