apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-app
spec:
  replicas: 0
  selector:
    matchLabels:
      app: example-app
  template:
    metadata:
      labels:
        app: example-app
    spec:
      containers:
        - name: app
          image: registry.example.com/app:1
          envFrom:
            - configMapRef:
                name: example-config
