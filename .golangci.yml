version: "2"

run:
  timeout: 30m
  # CI mode: Fails if go.mod needs updates, ensuring dependencies are properly declared
  modules-download-mode: readonly
  allow-parallel-runners: true
  allow-serial-runners: false
  concurrency: 2  # Set to 2 to avoid overwhelming the CI server

issues:
  # Don’t cap lint errors per linter—report everything in new code.
  max-issues-per-linter: 0

  # Don’t limit duplicates by text—if the same error crops up on multiple lines, show them all.
  max-same-issues: 0

  # Don’t dedupe by line; every instance matters.
  uniq-by-line: false

  # Automatically apply any fixable issues (like gofmt/goimports).
  fix: true


linters:
  default: none
  enable:
    # Core correctness & compile checks
    - govet          # catches suspicious Go constructs
    - staticcheck    # static analyses (nil‐checks, API misuse, etc.)
    - errcheck       # ensures you never ignore an error return
    - unused         # finds dead code we no longer need
    - ineffassign    # flags assignments that have no effect
  
    # error-handling best practices
    - errorlint      # flag missing %w wraps
    - err113         # enforce correct error-handling patterns

    # Terraform‐specific safety & resource handling
    - bodyclose      # makes sure every HTTP response body is closed
    - gosec          # scans for security issues (e.g. hardcoded credentials)
    
    # Specifically important for API clients (Microsoft 365 API)
    - contextcheck   # check whether function uses a non-inherited context
    - noctx          # finds sending http request without context.Context
    - nilnil         # checks that there is no simultaneous return of nil error and invalid value
    
    # Quality & style
    - gocritic       # catches a variety of performance/style bugs
    - prealloc       # recommends when you can preallocate slices/maps
    - misspell       # finds typos in comments, docs, & variable names
    - gocyclo        # warn on high cyclomatic complexity
    - wrapcheck      # checks that errors from external packages are wrapped
    
    # API/Terraform specific
    - musttag        # enforce field tags in (un)marshaled structs
    - tagliatelle    # checks struct tags (important for JSON/XML APIs)
    - forbidigo      # forbids time.Sleep in tests (decision 0016)
    - depguard       # the modular-monolith import rules (decision 0004)

  # 3) Per-linter configuration
  settings:
    # decision 0004's shared dependency rules (repo-layout.md, "depguard
    # rules"). depguard matches entries as string prefixes, so an allow entry
    # ends in $ (that package) or / (the packages below it); deny entries stay
    # bare. internal/app's TestUnitDepguardFixtures holds the file to that and
    # to the domains under internal/; make lint-fixtures proves each rule fires.
    depguard:
      rules:
        api-packages:
          list-mode: strict
          files:
            - "**/internal/*/api/**"
          allow:
            - $gostd
            - github.com/weaveplatform/infraweave/internal/kernel$
            - github.com/weaveplatform/infraweave/internal/kernel/
            - github.com/weaveplatform/infraweave/internal/platform/outbox$
        constructors:
          files:
            - $all
            - "!**/internal/app/**"
            - "!**/cmd/**"
          deny:
            - pkg: github.com/weaveplatform/infraweave/internal/features/assembly
              desc: only internal/app constructs a domain
            - pkg: github.com/weaveplatform/infraweave/internal/access/assembly
              desc: only internal/app constructs a domain
            - pkg: github.com/weaveplatform/infraweave/internal/workers/assembly
              desc: only internal/app constructs a domain
            - pkg: github.com/weaveplatform/infraweave/internal/vendors/assembly
              desc: only internal/app constructs a domain
            - pkg: github.com/weaveplatform/infraweave/internal/stacks/assembly
              desc: only internal/app constructs a domain
            - pkg: github.com/weaveplatform/infraweave/internal/configuration/assembly
              desc: only internal/app constructs a domain
            - pkg: github.com/weaveplatform/infraweave/internal/policies/assembly
              desc: only internal/app constructs a domain
            - pkg: github.com/weaveplatform/infraweave/internal/runs/assembly
              desc: only internal/app constructs a domain
            - pkg: github.com/weaveplatform/infraweave/internal/state/assembly
              desc: only internal/app constructs a domain
            - pkg: github.com/weaveplatform/infraweave/internal/cloud/assembly
              desc: only internal/app constructs a domain
            - pkg: github.com/weaveplatform/infraweave/internal/registry/assembly
              desc: only internal/app constructs a domain
            - pkg: github.com/weaveplatform/infraweave/internal/vcs/assembly
              desc: only internal/app constructs a domain
            - pkg: github.com/weaveplatform/infraweave/internal/schedules/assembly
              desc: only internal/app constructs a domain
            - pkg: github.com/weaveplatform/infraweave/internal/events/assembly
              desc: only internal/app constructs a domain
            - pkg: github.com/weaveplatform/infraweave/internal/templates/assembly
              desc: only internal/app constructs a domain
            - pkg: github.com/weaveplatform/infraweave/internal/resources/assembly
              desc: only internal/app constructs a domain
            - pkg: github.com/weaveplatform/infraweave/internal/intelligence/assembly
              desc: only internal/app constructs a domain
            - pkg: github.com/weaveplatform/infraweave/internal/flows/assembly
              desc: only internal/app constructs a domain
            - pkg: github.com/weaveplatform/infraweave/internal/expressions/assembly
              desc: only internal/app constructs a domain
        core-not-adapters:
          files:
            - "**/internal/*/internal/core/**"
          deny:
            - pkg: github.com/weaveplatform/infraweave/internal/runs/internal/adapters
              desc: a hexagon's core reaches adapters through its ports
            - pkg: github.com/weaveplatform/infraweave/internal/vcs/internal/adapters
              desc: a hexagon's core reaches adapters through its ports
            - pkg: github.com/weaveplatform/infraweave/internal/workers/internal/adapters
              desc: a hexagon's core reaches adapters through its ports
            - pkg: github.com/weaveplatform/infraweave/internal/access/internal/adapters
              desc: a hexagon's core reaches adapters through its ports
            - pkg: github.com/weaveplatform/infraweave/internal/registry/internal/adapters
              desc: a hexagon's core reaches adapters through its ports
            - pkg: github.com/weaveplatform/infraweave/internal/events/internal/adapters
              desc: a hexagon's core reaches adapters through its ports
            - pkg: github.com/weaveplatform/infraweave/internal/intelligence/internal/adapters
              desc: a hexagon's core reaches adapters through its ports
            - pkg: github.com/weaveplatform/infraweave/internal/flows/internal/adapters
              desc: a hexagon's core reaches adapters through its ports
        shared-below-domains:
          files:
            - "**/internal/platform/**"
            - "**/internal/kernel/**"
            - "**/internal/iac/**"
          deny:
            - pkg: github.com/weaveplatform/infraweave/internal/features
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/access
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/workers
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/vendors
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/stacks
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/configuration
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/policies
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/runs
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/state
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/cloud
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/registry
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/vcs
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/schedules
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/events
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/templates
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/resources
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/intelligence
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/flows
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/expressions
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/agent
              desc: shared packages sit below the domains
            - pkg: github.com/weaveplatform/infraweave/internal/app
              desc: shared packages sit below the domains
        agent-isolation:
          list-mode: lax
          files:
            - "**/internal/agent/**"
            - "**/cmd/infraweave/agent.go"
            - "**/cmd/infraweave-agent/**"
          deny:
            - pkg: github.com/weaveplatform/infraweave/internal
              desc: the agent imports only its allow list
            - pkg: github.com/weaveplatform/infraweave/pkg
              desc: the agent imports only its allow list
            - pkg: github.com/jackc/pgx
              desc: the agent imports only its allow list
          allow:
            - github.com/weaveplatform/infraweave/pkg/flows/app/v1$
            - github.com/weaveplatform/infraweave/internal/agent/
            - github.com/weaveplatform/infraweave/internal/kernel$
            - github.com/weaveplatform/infraweave/internal/kernel/
            - github.com/weaveplatform/infraweave/internal/iac$
            - github.com/weaveplatform/infraweave/internal/iac/
            - github.com/weaveplatform/infraweave/internal/platform/buildinfo$
            - github.com/weaveplatform/infraweave/internal/platform/observe$
            - github.com/weaveplatform/infraweave/internal/platform/rego$
            - github.com/weaveplatform/infraweave/internal/platform/httpkit/client$
            - github.com/weaveplatform/infraweave/internal/platform/httpkit/serve$
            - github.com/weaveplatform/infraweave/internal/platform/seal$
            - github.com/weaveplatform/infraweave/internal/platform/expr$
        # decision 0004's declared graph (repo-layout.md, "Declared graph"):
        # one rule per domain, which allows the shared packages, the
        # domain's own tree and the api/ of each domain its row names, and
        # denies the rest of internal/.
        graph-features:
          list-mode: lax
          files:
            - "**/internal/features/**"
          deny:
            - pkg: github.com/weaveplatform/infraweave/internal
              desc: features imports no domain; it sits at the bottom of the declared graph
          allow:
            - github.com/weaveplatform/infraweave/internal/features$
            - github.com/weaveplatform/infraweave/internal/features/
            - github.com/weaveplatform/infraweave/internal/kernel$
            - github.com/weaveplatform/infraweave/internal/kernel/
            - github.com/weaveplatform/infraweave/internal/platform/
        graph-access:
          list-mode: lax
          files:
            - "**/internal/access/**"
          deny:
            - pkg: github.com/weaveplatform/infraweave/internal
              desc: access imports only the api/ packages its row of the declared graph names
          allow:
            - github.com/weaveplatform/infraweave/internal/access/
            - github.com/weaveplatform/infraweave/internal/features/api$
            - github.com/weaveplatform/infraweave/internal/kernel$
            - github.com/weaveplatform/infraweave/internal/kernel/
            - github.com/weaveplatform/infraweave/internal/platform/
            - github.com/weaveplatform/infraweave/internal/iac$
            - github.com/weaveplatform/infraweave/internal/iac/
        graph-vendors:
          list-mode: lax
          files:
            - "**/internal/vendors/**"
          deny:
            - pkg: github.com/weaveplatform/infraweave/internal
              desc: vendors imports only the api/ packages its row of the declared graph names
          allow:
            - github.com/weaveplatform/infraweave/internal/vendors/
            - github.com/weaveplatform/infraweave/internal/features/api$
            - github.com/weaveplatform/infraweave/internal/access/api$
            - github.com/weaveplatform/infraweave/internal/kernel$
            - github.com/weaveplatform/infraweave/internal/kernel/
            - github.com/weaveplatform/infraweave/internal/platform/
            - github.com/weaveplatform/infraweave/internal/iac$
            - github.com/weaveplatform/infraweave/internal/iac/
        graph-stacks:
          list-mode: lax
          files:
            - "**/internal/stacks/**"
          deny:
            - pkg: github.com/weaveplatform/infraweave/internal
              desc: stacks imports only the api/ packages its row of the declared graph names
          allow:
            - github.com/weaveplatform/infraweave/internal/stacks/
            - github.com/weaveplatform/infraweave/internal/features/api$
            - github.com/weaveplatform/infraweave/internal/access/api$
            - github.com/weaveplatform/infraweave/internal/vendors/api$
            - github.com/weaveplatform/infraweave/internal/kernel$
            - github.com/weaveplatform/infraweave/internal/kernel/
            - github.com/weaveplatform/infraweave/internal/platform/
            - github.com/weaveplatform/infraweave/internal/iac$
            - github.com/weaveplatform/infraweave/internal/iac/
        devtools:
          files:
            - $all
            - "!**/tools/**"
            - "!**/internal/devtools/**"
            # the parity and reference tests check the committed documents
            # against specref
            - "!**/api/*_test.go"
            - "!**/test/acceptance/**"
          deny:
            - pkg: github.com/weaveplatform/infraweave/internal/devtools
              desc: only tools/ and internal/devtools build on the developer tooling
        public-packages:
          files:
            - "**/pkg/**"
          deny:
            - pkg: github.com/weaveplatform/infraweave/internal
              desc: pkg/ is public and cannot expose internal/
        ctl:
          list-mode: lax
          files:
            - "**/internal/ctl/**"
            - "**/cmd/infraweavectl/**"
          deny:
            - pkg: github.com/weaveplatform/infraweave/internal
              desc: infraweavectl is a client and reaches the server only through pkg/sdk
            - pkg: github.com/weaveplatform/infraweave/pkg/client
              desc: infraweavectl calls the API through pkg/sdk, not the generated clients
          allow:
            - github.com/weaveplatform/infraweave/internal/ctl$
            - github.com/weaveplatform/infraweave/internal/platform/buildinfo$
            - github.com/weaveplatform/infraweave/internal/platform/private$
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.Sleep$
          msg: tests wait on a channel or an injected clock (decision 0016)
    nakedret:
      max-func-lines: 40

  # 4) Issue-filtering (not disabling analysis, just silencing reports)
  exclusions:
    # skip generated files strictly matching Go’s “Code generated … DO NOT EDIT.”
    generated: strict

    # warn if any of these exclusions never match
    warn-unused: true

    # apply standard “false positive” presets
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy

    # fine-grained rules to drop issues by path, linter, text, or source
    rules:
      # in test files, silence these noisy checks; tests make throwaway
      # errors and return stub errors as they come
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - err113
          - wrapcheck

      # entry points hand the error they get to cobra or log.Fatal, which
      # print it; wrapping it again says nothing more
      - path: ^(cmd|tools)/
        linters:
          - wrapcheck

      # only run “forbidigo” on tests (silence everywhere else)
      - path-except: _test\.go
        linters:
          - forbidigo

      # silence known gosec warning in this vendored code
      - path: internal/hmac/
        text: "weak cryptographic primitive"
        linters:
          - gosec

      # drop staticcheck’s SA9003 messages
      - linters:
          - staticcheck
        text: "SA9003:"

      # exclude “lll” warnings on go:generate lines
      - linters:
          - lll
        source: "^//go:generate "

    # exclude entire files from reporting (still analyzed); anchored, since
    # an unanchored "tools/" would also match internal/devtools/
    paths:
      - ".*\\.gen\\.go$"          # Generated Go files
      - "^examples/"             # Example code for documentation
      - "^scripts/"              # Scripts for development
      - "^docs/.*\\.go$"           # Documentation generators

formatters:
  # Only run the formatters you actually want to auto‐fix in CI
  enable:
    - gofumpt     # strict Go formatting (superset of gofmt)
    - goimports   # fixes imports (add/remove/sort)
    - gci         # groups & sorts import blocks
    - golines     # wraps long lines to a max length (e.g. 120 chars)

  # Per‐formatter settings (optional—only if you need to tweak defaults)
  settings:
    gci:
      # customize your import sections order: standard, external, project
      sections:
        - Standard
        - Default
        - Prefix(github.com/weaveplatform)

  # Exclude generated or special‐case files from formatting checks
  exclusions:
    warn-unused: true   # error if any of the below rules never match
    generated: strict   # only skip files with exact “// Code generated … DO NOT EDIT.”
    paths:
      - ".*\\.gen\\.go$"       # ignore any *.gen.go files
      - "internal/tools/.*"    # ignore codegen tools dir

output:
  formats:
    # 1) Text format for the Action log
    text:
      # Send lint results to stderr so the Action log shows them even when piped
      path: stderr
      # Include the linter name after each issue
      print-linter-name: true
      # Show the source lines for each issue
      print-issued-lines: true
      # Keep ANSI colors enabled for readability in the Actions console
      colors: true

    # 2) SARIF format for GitHub Code Scanning integration
    sarif:
      path: golangci-lint-report.sarif

  # Use relative paths (from the module root) in output
  path-mode: ""

  sort-order:
    - severity
    - file

  # Show summary statistics at the end of the report
  show-stats: true
