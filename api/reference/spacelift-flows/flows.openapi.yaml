      type: object
    AppInstallationStyleOverride:
      properties:
        color:
          type: string
        iconUrl:
          type: string
      required:
        - color
        - iconUrl
      type: object
    AppVersions:
      description: An app's versions file, which a registry manifest's appMetadataUrl names.
      properties:
        versions:
          items:
            additionalProperties: false
            properties:
              artifactChecksum:
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              artifactUrl:
                type: string
              version:
                type: string
            required:
              - version
              - artifactUrl
              - artifactChecksum
            type: object
          type: array
      required:
        - versions
      type: object
    ExportOptions:
      properties:
        omitAppSchemas:
          type: boolean
        omitIds:
          type: boolean
        omitLayout:
          type: boolean
      type: object
    FlowAgentPool:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - name
      type: object
    FlowAppInstallation:
      additionalProperties: false
      properties:
        appName:
          type: string
        appVersion:
          type: string
        display:
          $ref: '#/components/schemas/FlowDisplay'
        id:
          type: string
      required:
        - appName
      type: object
    FlowBlock:
      additionalProperties: false
      properties:
        alternativeLookupStrategy:
          $ref: '#/components/schemas/FlowLookupStrategy'
        config:
          description: The block's configuration, by block type; app and Spacelift blocks map field names to expressions.
          type: object
        description:
          type: string
        dynamicOutputKeys:
          items:
            type: string
          type: array
        errorHandler:
          type: string
        group:
          type: string
        inputs:
          description: Input sockets to their links and configuration, by block type.
          type: object
        name:
          type: string
        outputs:
          description: Output sockets to their customization, by block type.
          type: object
        position:
          $ref: '#/components/schemas/FlowPosition'
        type:
          $ref: '#/components/schemas/FlowBlockType'
      required:
        - name
        - type
      type: object
    FlowBlockType:
      additionalProperties: false
      description: One of a core block, a Spacelift block (coreBlock spacelift with its kind) or an app block.
      properties:
        appBlock:
          additionalProperties: false
          properties:
            appInstallation:
              type: string
            block:
              type: string
            schema:
              description: The app block's schema at export, as JSON text.
              type: string
          required:
            - block
            - appInstallation
          type: object
        coreBlock:
          type: string
        kind:
          type: string
      type: object
    FlowDataTable:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        schema:
          additionalProperties: false
          properties:
            columns:
              items:
                additionalProperties: false
                properties:
                  dataTableRef:
                    type: string
                  name:
                    type: string
                  type:
                    enum:
                      - string
                      - integer
                      - float
                      - boolean
                      - datetime
                      - json
                      - row_ref
                    type: string
                required:
                  - name
                  - type
                type: object
              type: array
          type: object
      required:
        - name
      type: object
    FlowDefinition:
      additionalProperties: false
      description: A flow's YAML definition, as the canvas copies it, flowctl exports it and the provider applies it.
      properties:
        agentPools:
          additionalProperties:
            $ref: '#/components/schemas/FlowAgentPool'
          type: object
        appInstallations:
          additionalProperties:
            $ref: '#/components/schemas/FlowAppInstallation'
          type: object
        blocks:
          items:
            $ref: '#/components/schemas/FlowBlock'
          type: array
        dataTables:
          additionalProperties:
            $ref: '#/components/schemas/FlowDataTable'
          type: object
        notes:
          items:
            $ref: '#/components/schemas/FlowNote'
          type: array
      type: object
    FlowDisplay:
