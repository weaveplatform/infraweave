          type: string
        icon:
          type: string
        key:
          type: string
      type: object
    FlowLookupStrategy:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
      type: object
    FlowNote:
      additionalProperties: false
      properties:
        alternativeLookupStrategy:
