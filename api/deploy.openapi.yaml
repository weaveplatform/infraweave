        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: The request failed; the body says why.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: The caller's rate-limit bucket for this operation's cost class is empty.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
