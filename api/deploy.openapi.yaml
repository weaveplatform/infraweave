      description: >-
        Present and true when this response is a replay of the first request made with the same Idempotency-Key.
      schema:
        type: boolean
    RateLimitLimit:
      description: The capacity of the rate-limit bucket this request drew from.
      schema:
        type: integer
    RateLimitRemaining:
      description: Whole requests left in that bucket.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until that bucket is full again.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        The nextCursor of the previous page. Leave it out for the first page. Cursors are opaque and never expire.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Makes a retry of this request safe. A repeat with the same key and the same request replays the first response instead of acting again. Keys are scoped to the caller and kept for 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Values outside 1–100 are clamped.
      schema:
        type: integer
        format: int32
        default: 20
