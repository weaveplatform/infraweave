# A worker's registration, polls and exit.
components:
  schemas:
    RegisterRequest:
      description: A registration, signed with the pool's private key.
      type: object
      additionalProperties: false
      required: [registration]
      properties:
        registration:
          type: string
          maxLength: 32768
          description: >-
            A compact JWS, ES256, whose protected header's x5c carries the
            pool's certificate from its pool token. Its payload is a JSON
            object: pool, the pool's ID; iat, when it was signed, in Unix
            seconds, within five minutes of the server's clock; jti, a value
            the pool has not used in the last ten minutes; version, the
            launcher's version; capabilities, at most 16 strings of at most 64
            characters, including plan-sanitization-v1 and, for installation public workers, public-pool-v1 (otherwise 422 requires a
            launcher upgrade); os and arch, the host's, each at most 64
            characters; metadata, an object of at most 32 strings describing
            the worker, keys at most 64 characters and values at most 255;
            worker, the ID of a worker of the pool to resume, which keeps its
            run, or absent for a new worker; and, for a pool a controller
            hosts, owner, the bound hosting identity (clusterID, namespace and
            resourceUID), and slot, the logical slot from 0 to 2147483647. A
            pool with a hosting binding admits only its owner's registrations,
            and each slot holds at most one worker: registering a slot again
            resumes its worker.
    PoolOwnershipRequest:
      description: A hosting ownership proof, signed with the pool's private key.
      type: object
      additionalProperties: false
      required: [proof]
      properties:
        proof:
          type: string
          maxLength: 32768
          description: >-
            A compact JWS, ES256, whose protected header's x5c carries the
            pool's current certificate from its pool token. Its payload is a
            JSON object: pool, the pool's ID; owner, an object of clusterID
            and namespace, each a lowercase DNS label of at most 63
            characters, and resourceUID, the opaque Kubernetes UID of the
            owning resource, at most 128 characters; iat, when it was signed,
            in Unix seconds, within five minutes of the server's clock; and
            jti, a value the pool has not used in the last ten minutes.
    Registration:
      description: The registered worker and its session token.
      type: object
      required: [worker, sessionToken, sessionExpiresAt]
      properties:
        worker:
          type: string
          description: The worker's ID, which a later registration names to resume it.
        sessionToken:
          type: string
          description: >-
            The worker session token every other call of the worker API
            carries as its bearer token.
        sessionExpiresAt:
          type: integer
          format: int64
          description: When the session token expires, in Unix seconds.
    PollRequest:
      description: The worker's state, which each poll reports.
      type: object
      additionalProperties: false
      required: [busy]
      properties:
        busy:
          type: boolean
          description: Whether the launcher is executing a run.
        drained:
          type: boolean
          default: false
          description: >-
            The drain flag the launcher last learned. A poll whose worker's
            flag differs answers at once.
        retiring:
          type: boolean
          default: false
          description: >-
            Whether the launcher is retiring: it takes no further run and
            exits once it holds none, so the poll is assigned no run.
        run:
          type: string
          maxLength: 26
          description: >-
            The ID of the run the launcher is executing, when busy; when not
            busy, the run whose container ended since the launcher's last
            poll, which exit describes. A poll that is not busy and names a
            run answers at once.
        exit:
          $ref: '#/components/schemas/ContainerExit'
        version:
          type: string
          maxLength: 64
          description: The launcher's version.
        wait:
          type: integer
          format: int32
          minimum: 5
          maximum: 120
          default: 60
          description: >-
            How many seconds the server may hold the poll when it has nothing
            to answer. The server holds it no longer than its own maximum.
    ContainerExit:
      description: >-
        How the container of the run a poll names ended: its root process's
        exit code, and why it ended.
      type: object
      additionalProperties: false
      required: [code, reason]
      properties:
        code:
          type: integer
          format: int32
          description: The exit code of the container's root process.
        reason:
          type: string
          enum: [exited, killed, out-of-memory, missing, evicted, run-timeout, log-timeout]
          description: >-
            exited when the runner ended by itself; killed when the launcher
            killed it on a kill signal; out-of-memory when the host killed it
            for its memory; missing when the container is gone, such as after
            the host restarted; evicted when the cluster evicted or preempted
            the container's Pod; run-timeout when the launcher killed it for
            running longer than its run timeout; log-timeout when the launcher
            killed it for writing no output line for its log timeout.
    Signal:
      description: >-
        stop or kill asks the launcher to stop or kill its current run; cycle
        asks it to exit, at once when idle, after its run when busy.
      type: string
      enum: [stop, kill, cycle]
    Assignment:
      description: >-
        A run the poll claimed for the worker, which the launcher prepares
        and executes.
      type: object
      required: [run, state, stateVersion, preparingDeadline, runToken, runTokenExpiresAt]
      properties:
        run:
          type: string
          description: The run's ID.
        stateVersion:
          type: integer
          format: int64
          description: >-
            The run's state version after the claim, which the run's
            specification is sealed for until the run reports it started.
        state:
          type: string
          enum: [PREPARING, PREPARING_APPLY, PREPARING_REPLAN]
          description: >-
            The state the claim moved the run to: PREPARING for a run that
            plans or performs, PREPARING_APPLY for a confirmed run that
            applies or, a destroy run, destroys, PREPARING_REPLAN for a run
            that plans again.
        preparingDeadline:
          type: integer
          format: int64
          description: >-
            When the run's preparation must have ended with its started
            report, in Unix seconds: the claim's time plus the pool's
            preparing timeout, rounded down to the second. It is fixed for
            this assignment; a later change of the pool's timeout does not
            move it, and the server fails the run once it passes in a
            preparing state.
        runToken:
          type: string
          description: >-
            The run token the launcher and its runner carry as the bearer
            token of the run's calls, accepted while the run is on a worker.
        runTokenExpiresAt:
          type: integer
          format: int64
          description: When the run token expires, in Unix seconds.
    PollResult:
      description: >-
        What the server has to say to the worker. Every member is absent when
        it has nothing.
      type: object
      properties:
        assignment:
          $ref: '#/components/schemas/Assignment'
        signals:
          type: array
          items:
            $ref: '#/components/schemas/Signal'
          description: The signals the worker is to act on.
        drained:
          type: boolean
          description: >-
            Whether the worker is drained: it takes no new run and finishes
            its current one. Answered when the worker is drained, or when
            the poll's flag was true and the worker is no longer drained.
        sessionToken:
          type: string
          description: >-
            A renewed worker session token, answered when the one the poll
            carried has less than 15 minutes left.
        sessionExpiresAt:
          type: integer
          format: int64
          description: When the renewed session token expires, in Unix seconds.
    RunTokenKeys:
      description: >-
        What verifies a run token apart from the server that issued it: the
        issuer and the audience its claims name, and the public keys that
        may have signed it.
      type: object
      required: [issuer, audience, keys]
      properties:
        issuer:
          type: string
          description: The iss of every run token the server issues.
        audience:
          type: string
          description: The one aud of every run token, infraweave-runner.
        keys:
          type: array
          maxItems: 16
          description: >-
            The public half of each signing key that verifies a token: the
            key that signs now, its published successor, and the keys it
            replaced until the last token they signed expires.
          items:
            $ref: '#/components/schemas/RunTokenKey'
    RunTokenKey:
      description: >-
        A public ES256 signing key as an RFC 7517 JSON Web Key. It carries no
        private member.
      type: object
      required: [kty, crv, x, y, kid, alg, use]
      properties:
        kty:
          type: string
          enum: [EC]
          description: The key type.
        crv:
          type: string
          enum: [P-256]
          description: The key's curve.
        x:
          type: string
          description: The public point's x coordinate, base64url without padding.
        y:
          type: string
          description: The public point's y coordinate, base64url without padding.
        kid:
          type: string
          description: The key's ID, which a token's kid header names.
        alg:
          type: string
          enum: [ES256]
          description: The one algorithm the key signs with.
        use:
          type: string
          enum: [sig]
          description: The key's use.
paths:
  /register:
    post:
      summary: Register a worker
      description: >-
        Registers a worker of the pool the registration names, or resumes the
        worker it names. The certificate must chain to the installation's pool
        CA and carry the pool's current serial. A new worker beyond the
        organization's private-workers limit answers 403 limit-reached; a
        resumed one is not counted again. Missing the signed plan-sanitization-v1
        capability or using a version older than the server's previous minor
        answers 422 validation-failed, naming the required capability or version.
        A registration whose owner differs from the pool's hosting binding, or
        that omits the owner of a bound pool, answers 409 invalid-state.
      operationId: workerRegister
      security: []
      tags:
        - Workers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: The worker and its session token.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/InvalidState'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
  /pools/bind:
    post:
      summary: Bind a pool to its hosting controller
      description: >-
        Records the proof's owner as the only controller that hosts the pool.
        Binding again with the same owner succeeds. Another owner, a
        controller-managed pool of another resource, or workers registered
        before any binding answer 409 invalid-state; the owner of another
        pool's binding answers 409 too.
      operationId: workerPoolBind
      security: []
      tags:
        - Workers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PoolOwnershipRequest'
      responses:
        '204':
          description: The pool is bound to the owner.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/InvalidState'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
  /pools/release:
    post:
      summary: Release a pool's hosting binding
      description: >-
        Removes the proof owner's hosting binding once the pool has no
        registered worker and no run on a worker; the pool, its settings and
        its certificate remain. A pool with no binding succeeds. Another
        owner's binding, remaining workers or active runs answer 409
        invalid-state.
      operationId: workerPoolRelease
      security: []
      tags:
        - Workers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PoolOwnershipRequest'
      responses:
        '204':
          description: The pool has no hosting binding.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/InvalidState'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
  /poll:
    post:
      summary: Poll for runs and signals
      description: >-
        Reports the worker's state and waits for something to answer: a run
        of its pool, a signal, a change of its drain flag, or the end of its
        wait, whichever comes first. An idle, undrained worker that holds no
        run is assigned its pool's next waiting run: the oldest of the first
        priority tier, with drift detection runs of normal or low priority
        skipped while the pool's running ones reach its drift detection run
        limit. A retiring worker is assigned no run. A poll that reports the
        end of a run's container answers at once, once the server has taken
        the exit. A poll whose
        session token has less than 15 minutes left answers at once with a
        renewed one, and a worker's next poll answers its held one at once.
        The answer is always 200.
      operationId: workerPoll
      tags:
        - Workers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollRequest'
      responses:
        '200':
          description: What the server has to say, empty when nothing.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
  /run-token-keys:
    get:
      summary: Read the keys that verify run tokens
      description: >-
        Answers the issuer and audience of the run tokens the server issues,
        and the public keys that verify them, so a launcher admits an
        assignment's run token before it uses it. Only a registered worker's
        session reads them: no discovery document names these keys, so no
        relying party outside the worker protocol trusts them. No private
        key material is answered.
      operationId: workerRunTokenKeys
      tags:
        - Workers
      responses:
        '200':
          description: The run tokens' issuer, audience and verifying keys.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunTokenKeys'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
  /deregister:
    post:
      summary: Deregister a worker
      description: >-
        Removes the worker, which a launcher calls as it exits. Its session
        token authenticates nothing afterwards.
      operationId: workerDeregister
      tags:
        - Workers
      responses:
        '204':
          description: The worker is gone.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
