# A claimed run's calls, which its run token authenticates.
components:
  parameters:
    Run:
      name: run
      in: path
      required: true
      schema:
        type: string
        maxLength: 26
      description: The run's ID.
  schemas:
    RunSpec:
      description: >-
        What a claimed run needs. Every value that is not a secret is here in
        clear; the write-only values, the in-run API token and the run's
        artifact key are in sealed, which only the pool's private key opens.
      type: object
      required: [run, stack, commit, hooks, environment, files, sealed]
      properties:
        run:
          $ref: '#/components/schemas/RunSpecRun'
        stack:
          $ref: '#/components/schemas/RunSpecStack'
        commit:
          $ref: '#/components/schemas/RunSpecCommit'
        runtimeConfig:
          type: object
          additionalProperties: true
          description: >-
            The runtime configuration the run's trigger gave, which overrides
            the stack's hooks, environment and checkout for this run. Absent
            when the trigger gave none.
        runnerImage:
          type: string
          description: >-
            The image the run's container starts from: the runtime
            configuration's, else the stack's, else the account's default
            for private pools. Absent when none names one, for the launcher's
            own default.
        hooks:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: >-
            Each phase's commands, by phase such as beforeInit or afterPlan,
            in the order they run. Before a phase, the hooks of the contexts
            attached by hand run first, by priority, then those of the
            contexts attached automatically, then the stack's; after a phase
            they run in the reverse order.
        environment:
          type: array
          items:
            $ref: '#/components/schemas/RunSpecVariable'
          description: >-
            The run's environment variables, by name: the stack's, its
            contexts', and the INFRAWEAVE_ and TF_VAR_infraweave_ variables
            the server sets, which a variable of the same name overrides.
        files:
          type: array
          items:
            $ref: '#/components/schemas/RunSpecFile'
          description: The files mounted into the run's workspace, by path.
        sealed:
          type: string
          format: byte
          description: >-
            RunSpecSecrets as JSON, sealed to the pool's P-256 public key: the
            byte 0x01, an ephemeral P-256 public key (65 bytes, uncompressed),
            a 12-byte nonce, and the AES-256-GCM ciphertext and tag. The
            AES-256 key is HKDF-SHA256 of the ECDH shared secret, with an
            empty salt and the info infraweave/pool-envelope/v1 followed by
            the ephemeral and the pool public keys. The associated data is
            0x01, the run ID's length (uint16, big-endian), the run ID, and
            run.stateVersion (uint64, big-endian), so the launcher refuses a
            specification issued for another run or another of its states.
    RunSpecRun:
      description: The run.
      type: object
      required: [id, type, state, stateVersion, triggeredBy, priority, driftDetection, createdAt]
      properties:
        id:
          type: string
          description: The run's ID.
        type:
          type: string
          enum: [PROPOSED, TRACKED, TASK, TESTING, DESTROY, PARSE]
          description: The run's type.
        state:
          type: string
          description: The run's state when the specification was issued.
        stateVersion:
          type: integer
          format: int64
          description: >-
            The run's state version when the specification was issued, which
            sealed is bound to.
        triggeredBy:
          type: string
          description: The login or the trigger that created the run.
        priority:
          type: string
          enum: [low, normal, high]
          description: The run's priority.
        driftDetection:
          type: boolean
          description: Whether the run detects drift.
        createdAt:
          type: integer
          format: int64
          description: When the run was created, in Unix seconds.
    RunSpecStack:
      description: The run's stack.
      type: object
      required: [id, name, space, labels, repository, branch, vendor, vendorConfig]
      properties:
        id:
          type: string
          description: The stack's slug.
        name:
          type: string
          description: The stack's name.
        space:
          type: string
          description: The slug of the stack's space.
        labels:
          type: array
          items:
            type: string
          description: The stack's labels, sorted.
        repository:
          type: string
          description: The stack's repository.
        branch:
          type: string
          description: The branch the stack tracks.
        projectRoot:
          type: string
          description: >-
            The directory of the repository the run works in: the runtime
            configuration's, else the stack's. Absent for the root.
        vendor:
          type: string
          description: The stack's infrastructure tool, such as TERRAFORM.
        vendorConfig:
          type: object
          additionalProperties: true
          description: The tool's settings.
    RunSpecCommit:
      description: The commit the run works on.
      type: object
      required: [hash, message, authorName, timestamp]
      properties:
        hash:
          type: string
          description: The commit's hash.
        tag:
          type: string
          description: The tag the commit was named by, if any.
        url:
          type: string
          description: The commit's page on its provider, if known.
        message:
          type: string
          description: The first line of the commit's message.
        authorName:
          type: string
          description: The commit author's name.
        authorLogin:
          type: string
          description: The commit author's login, when the provider knows one.
        timestamp:
          type: integer
          format: int64
          description: When the commit was made, in Unix seconds.
    RunSpecVariable:
      description: >-
        An environment variable. A write-only variable's value is in sealed,
        as is that of a variable whose ${{ }} template reads one.
      type: object
      required: [name, writeOnly]
      properties:
        name:
          type: string
          description: The variable's name.
        value:
          type: string
          description: >-
            The value, its ${{ }} templates rendered and ${NAME} left to the
            shell. Absent when the variable is write-only.
        writeOnly:
          type: boolean
          description: Whether the value is a secret, which sealed carries.
    RunSpecFile:
      description: >-
        A file mounted into the run's workspace. A write-only file's content
        is in sealed.
      type: object
      required: [path, writeOnly, checksum]
      properties:
        path:
          type: string
          description: The file's path, relative to the workspace.
        writeOnly:
          type: boolean
          description: Whether the content is a secret, which sealed carries.
        fileMode:
          type: string
          description: The file's mode in octal, such as 600; absent for the default.
        checksum:
          type: string
          description: The SHA-256 of the content, in hex.
        content:
          type: string
          format: byte
          description: The file's content. Absent when the file is write-only.
    RunSpecSecrets:
      description: >-
        The plaintext of RunSpec's sealed: the secrets of the run, which no
        other call returns.
      type: object
      required: [environment, files, apiToken, apiTokenExpiresAt, artifactKey]
      properties:
        environment:
          type: object
          additionalProperties:
            type: string
          description: Each write-only variable's value, rendered, by name.
        files:
          type: object
          additionalProperties:
            type: string
            format: byte
          description: Each write-only file's content, by path.
        apiToken:
          type: string
          description: >-
            The in-run API token, which the run's container receives as
            INFRAWEAVE_API_TOKEN. It authenticates to the API while the run
            plans, applies or performs.
        apiTokenExpiresAt:
          type: integer
          format: int64
          description: When the in-run API token expires, in Unix seconds.
        artifactKey:
          type: string
          format: byte
          description: >-
            The run's 256-bit artifact key, the same on every fetch of the
            run's specification, which the runner seals the run's artifacts
            with.
    WorkerState:
      description: A state in which a worker holds the run.
      type: string
      enum:
        - PREPARING
        - PREPARING_APPLY
        - PREPARING_REPLAN
        - INITIALIZING
        - PLANNING
        - APPLYING
        - DESTROYING
        - PERFORMING
    RunReport:
      description: >-
        What happened to a phase of the run: it started, succeeded, failed or
        stopped.
      type: object
      additionalProperties: false
      required: [stateVersion, state, event]
      properties:
        stateVersion:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The state version the worker last learned: its assignment's, then
            each report's answer's.
        state:
          $ref: '#/components/schemas/WorkerState'
        event:
          type: string
          enum: [started, succeeded, failed, stopped]
          description: >-
            started names the phase the worker begins; the first, which
            names the state its preparation leads to, ends the handover.
            succeeded, failed and stopped name the state the run is in. A
            launcher whose preparation fails reports failed for the
            preparing state.
        details:
          type: string
          maxLength: 1024
          description: >-
            What the worker says about the event, such as why a phase
            failed, which the transition records as its note.
        delta:
          $ref: '#/components/schemas/PlanDelta'
    PlanDelta:
      description: >-
        What the run's plan changes, which a succeeded report of PLANNING
        carries and no other report does: the resources it adds, changes,
        deletes and imports, and whether any output changes.
      type: object
      additionalProperties: false
      required: [add, change, delete, import, outputs]
      properties:
        add:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Resources the plan adds.
        change:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Resources the plan changes in place.
        delete:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Resources the plan deletes.
        import:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Resources the plan imports.
        outputs:
          type: boolean
          description: Whether any of the root module's outputs changes.
    NextStep:
      description: >-
        What the worker does next. execute runs the phase of state; pause
        ends the container while the run waits in state for a decision;
        exit ends it, the run having ended in state.
      type: object
      required: [action, state, stateVersion]
      properties:
        action:
          type: string
          enum: [execute, pause, exit]
          description: What the worker does next.
        state:
          type: string
          description: The run's state now.
        stateVersion:
          type: integer
          format: int64
          description: The run's state version now, which the next report names.
    UploadKind:
      description: >-
        What an upload holds, which decides its store: a log chunk, a run
        artifact sealed with the run's artifact key, the workspace encrypted
        to the pool's key, or an observability artifact.
      type: string
      enum: [log-chunk, artifact, workspace, observability]
    Upload:
      description: An object the worker means to upload, as it declares it.
      type: object
      additionalProperties: false
      required: [kind, name, size, sha256]
      properties:
        kind:
          $ref: '#/components/schemas/UploadKind'
        name:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          description: >-
            The object's name within the run's state version, never reused
            there. A log chunk's is its sequence number in decimal, from 0.
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483648
          description: >-
            The object's size in bytes, as uploaded: at most 1 MiB for a log
            chunk, 512 MiB for an artifact, 2 GiB for the workspace and 64
            MiB for an observability artifact.
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The SHA-256 of the object's bytes as uploaded, in hex.
    UploadURLsRequest:
      description: The objects the worker means to upload in the run's current state.
      type: object
      additionalProperties: false
      required: [stateVersion, uploads]
      properties:
        stateVersion:
          type: integer
          format: int64
          minimum: 1
          description: The run's current state version.
        uploads:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/Upload'
          description: The objects, each with a name of its own.
    SignedUpload:
      description: Where to upload one declared object.
      type: object
      required: [kind, name, key, url, headers]
      properties:
        kind:
          $ref: '#/components/schemas/UploadKind'
        name:
          type: string
          description: The object's name, as declared.
        key:
          type: string
          description: >-
            The object's key: the run's account and ID, the state and state
            version, and the name, as
            account/run/STATE-stateVersion/name.
        url:
          type: string
          description: >-
            The pre-signed PUT URL, which accepts only the declared size and,
            where the store can bind it, the declared SHA-256, until it
            expires.
        headers:
          type: object
          additionalProperties:
            type: string
          description: The headers the PUT must carry, which the signature covers.
    UploadURLs:
      description: Where to upload each declared object, in the order declared.
      type: object
      required: [uploads]
      properties:
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/SignedUpload'
    LogChunk:
      description: An uploaded log chunk.
      type: object
      additionalProperties: false
      required: [seq, firstAt, lastAt]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 0
          description: The chunk's sequence number, its upload's name.
        firstAt:
          type: integer
          format: int64
          minimum: 0
          description: When the chunk's first line was written, in Unix seconds.
        lastAt:
          type: integer
          format: int64
          minimum: 0
          description: When the chunk's last line was written, in Unix seconds.
    LogChunksRequest:
      description: Log chunks of the run's current state, uploaded and to be indexed.
      type: object
      additionalProperties: false
      required: [stateVersion, chunks]
      properties:
        stateVersion:
          type: integer
          format: int64
          minimum: 1
          description: The run's current state version.
        chunks:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/LogChunk'
    ArtifactRecord:
      description: An uploaded artifact, workspace or observability artifact.
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [artifact, workspace, observability]
          description: The upload's kind.
        name:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          description: The upload's name.
    ArtifactsRequest:
      description: Uploads of the run's current state, to be recorded.
      type: object
      additionalProperties: false
      required: [stateVersion, artifacts]
      properties:
        stateVersion:
          type: integer
          format: int64
          minimum: 1
          description: The run's current state version.
        artifacts:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/ArtifactRecord'
paths:
  /runs/{run}/spec:
    get:
      summary: Read a run's specification
      description: >-
        Answers the specification of the run the run token names, with its
        secrets sealed to the pool's key. A run token for another run
        answers 401, and a run that is no longer on a worker 409
        invalid-state. A ${{ }} template that fails to render answers 422
        validation-failed, naming the variable.
      operationId: workerRunSpec
      security:
        - runToken: []
      tags:
        - Runs
      parameters:
        - $ref: '#/components/parameters/Run'
      responses:
        '200':
          description: The run's specification.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSpec'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/InvalidState'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
  /runs/{run}/reports:
    post:
      summary: Report a phase of a run
      description: >-
        Reports that a phase of the run the run token names started,
        succeeded, failed or stopped, and answers what the worker does next.
        The first started report ends the handover. A report that names a
        state version the run moved on from answers 409 invalid-state, as
        does one the run's state cannot take, unless it repeats the report
        that took the run's last transition, which answers as that report
        did. A succeeded report of PLANNING carries the plan's delta, and the
        server takes the plan decision in its transaction: with no plan
        policy attached, a proposed run, or a tracked run whose plan changes
        nothing, finishes and answers exit; a tracked run with changes
        applies when its stack deploys automatically and is unlocked,
        answering execute, and waits for confirmation otherwise, answering
        pause; a test case applies. A succeeded report of PLANNING without
        a delta, or any other report with one, answers 400 invalid-request.
      operationId: workerRunReport
      security:
        - runToken: []
      tags:
        - Runs
      parameters:
        - $ref: '#/components/parameters/Run'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunReport'
      responses:
        '200':
          description: What the worker does next.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextStep'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/InvalidState'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
  /runs/{run}/upload-urls:
    post:
      summary: Sign upload URLs for a run's objects
      description: >-
        Answers a pre-signed PUT URL for each declared object of the run's
        current state, under the run's own key prefix, bound to the declared
        size and, where the store can bind it, the declared SHA-256. A name
        already declared with the same size and SHA-256 and not yet recorded
        is signed again; one declared otherwise answers 409 already-exists.
      operationId: workerRunUploadURLs
      security:
        - runToken: []
      tags:
        - Runs
      parameters:
        - $ref: '#/components/parameters/Run'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadURLsRequest'
      responses:
        '200':
          description: Where to upload each object.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadURLs'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/InvalidState'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
  /runs/{run}/log-chunks:
    post:
      summary: Index a run's uploaded log chunks
      description: >-
        Indexes log chunks of the run's current state once their uploads
        hold the declared size and SHA-256, by state version and sequence
        number. A chunk already indexed is left as it is. A chunk whose
        upload is missing or does not match answers 422 validation-failed.
      operationId: workerRunLogChunks
      security:
        - runToken: []
      tags:
        - Runs
      parameters:
        - $ref: '#/components/parameters/Run'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogChunksRequest'
      responses:
        '204':
          description: The chunks are indexed.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/InvalidState'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
  /runs/{run}/artifacts:
    post:
      summary: Record a run's uploaded artifacts
      description: >-
        Records artifacts, workspaces and observability artifacts of the
        run's current state once their uploads hold the declared size and
        SHA-256. One already recorded is left as it is. One whose upload is
        missing or does not match answers 422 validation-failed.
      operationId: workerRunArtifacts
      security:
        - runToken: []
      tags:
        - Runs
      parameters:
        - $ref: '#/components/parameters/Run'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactsRequest'
      responses:
        '204':
          description: The uploads are recorded.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/InvalidState'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
  /runs/{run}/workspace:
    get:
      summary: Fetch a run's saved workspace
      description: >-
        Redirects to a pre-signed GET of the workspace the run last
        recorded, which is encrypted to the pool's key. A run that recorded
        none answers 404.
      operationId: workerRunWorkspace
      security:
        - runToken: []
      tags:
        - Runs
      parameters:
        - $ref: '#/components/parameters/Run'
      responses:
        '307':
          description: The workspace's pre-signed GET URL is in Location.
          headers:
            Location:
              schema:
                type: string
              description: The pre-signed GET URL.
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
