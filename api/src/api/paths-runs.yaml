# Scaffolded by `specref scaffold --tag Runs` from the Spacelift reference (schema-1fc7d2c49a8e).
# This fragment is infraweave's own: curate it freely. Scaffolding again with --force overwrites it.
components:
  schemas:
    ChangeValue:
      discriminator:
        mapping:
          ChangeValueBoolean: '#/components/schemas/ChangeValueBoolean'
          ChangeValueFloat: '#/components/schemas/ChangeValueFloat'
          ChangeValueString: '#/components/schemas/ChangeValueString'
        propertyName: kind
      oneOf:
        - $ref: '#/components/schemas/ChangeValueBoolean'
        - $ref: '#/components/schemas/ChangeValueString'
        - $ref: '#/components/schemas/ChangeValueFloat'
      x-graphql-kind: UNION
      x-graphql-type: ChangeValue
    ChangeValueBoolean:
      properties:
        kind:
          description: The concrete type, for union and interface responses.
          enum:
            - ChangeValueBoolean
          type: string
        value:
          type: boolean
      required:
        - kind
        - value
      type: object
      x-graphql-type: ChangeValueBoolean
    ChangeValueFloat:
      properties:
        kind:
          description: The concrete type, for union and interface responses.
          enum:
            - ChangeValueFloat
          type: string
        value:
          type: number
      required:
        - kind
        - value
      type: object
      x-graphql-type: ChangeValueFloat
    ChangeValueString:
      properties:
        kind:
          description: The concrete type, for union and interface responses.
          enum:
            - ChangeValueString
          type: string
        value:
          type: string
      required:
        - kind
        - value
      type: object
      x-graphql-type: ChangeValueString
    EntityAttributeChange:
      properties:
        changeForPhase:
          $ref: '#/components/schemas/EntityAttributeChangeForPhase'
        path:
          description: JSON path to the changed property
          type: string
      required:
        - changeForPhase
        - path
      type: object
      x-graphql-type: EntityAttributeChange
    EntityAttributeChangeForPhase:
      properties:
        after:
          $ref: '#/components/schemas/ChangeValue'
        afterUnknown:
          description: |-
            True when the after value is "known after apply" — the value cannot be determined
            at plan time and will only be resolved during apply. Clients should render this
            as "(known after apply)" rather than treating `after` as a literal null.
          type: boolean
        before:
          $ref: '#/components/schemas/ChangeValue'
        metadata:
          $ref: '#/components/schemas/EntityAttributeChangeForPhaseMetadata'
      required:
        - afterUnknown
        - metadata
      type: object
      x-graphql-type: EntityAttributeChangeForPhase
    EntityAttributeChangeForPhaseMetadata:
      properties:
        phase:
          $ref: '#/components/schemas/EntityChangePhase'
        type:
          $ref: '#/components/schemas/EntityChangeType'
      required:
        - phase
        - type
      type: object
      x-graphql-type: EntityAttributeChangeForPhaseMetadata
    EntityChangeCollectionInputV2:
      additionalProperties: false
      properties:
        after:
          description: |-
            List the entity changes after this ID
            When paginating the PageInfo.endCursor returned contains the next after value
          nullable: true
          type: string
        changePhase:
          $ref: '#/components/schemas/EntityChangePhase'
        changeType:
          $ref: '#/components/schemas/EntityChangeType'
        first:
          description: List the first * items
          format: int32
          nullable: true
          type: integer
      type: object
      x-graphql-type: EntityChangeCollectionInputV2
    EntityChangeConnectionV2:
      properties:
        cursor:
          type: string
        node:
          $ref: '#/components/schemas/EntityChangeV2'
      required:
        - cursor
        - node
      type: object
      x-graphql-type: EntityChangeConnectionV2
    EntityChangeMetadata:
      properties:
        moved:
          type: boolean
        result:
          $ref: '#/components/schemas/EntityChangeResult'
        type:
          $ref: '#/components/schemas/EntityChangeType'
      required:
        - moved
        - result
        - type
      type: object
      x-graphql-type: EntityChangeMetadata
    EntityChangePhase:
      enum:
        - DRIFT
        - PLAN
        - APPLY
      type: string
      x-enum-descriptions:
        APPLY: entity change was performed during the applying phase
        DRIFT: entity change was performed during a drift detection run
        PLAN: entity change was performed during the planning phase
      x-graphql-type: EntityChangePhase
    EntityChangeResult:
      description: Status of a entity change.
      enum:
        - PLANNED
        - SUCCESSFUL
        - FAILED
        - PARTIAL
        - UNPLANNED
        - UNKNOWN
      type: string
      x-enum-descriptions:
        FAILED: Change was planned and has not been applied.
        PARTIAL: |-
          Change was planned and has been applied but has partially failed.
          Change type is REPLACE_* and either ADD or DELETE has not been applied.
        PLANNED: Change has not been applied.
        SUCCESSFUL: Change was planned and has been applied.
        UNKNOWN: Change result is unknown
        UNPLANNED: Change which wasn't planned but is being applied.
      x-graphql-type: EntityChangeResult
    EntityChangeType:
      description: Type of a entity change.
      enum:
        - ADD
        - CHANGE
        - DELETE
        - REPLACE_CREATE_BEFORE_DESTROY
        - REPLACE_DESTROY_BEFORE_CREATE
        - NOOP
        - READ
        - IMPORT
        - FORGET
        - CREATE_AFTER_FORGOTTEN
        - OK
        - SKIPPED
        - RESCUED
        - IGNORED
        - UNREACHABLE
        - FAILED
      type: string
      x-enum-descriptions:
        ADD: A new entity will be created.
        CHANGE: An existing entity will be updated in-place.
        CREATE_AFTER_FORGOTTEN: |-
          An existing entity will be removed from the state but not destroyed, and a
          replacement will be created.
        DELETE: An existing entity will be deleted.
        FAILED: A task that failed.
        FORGET: An existing entity will be removed from the state but not destroyed.
        IGNORED: A task that resulted with status ignored.
        IMPORT: A new entity will be imported.
        NOOP: A no-op change.
        OK: A task that resulted with status ok.
        READ: A read, no-op change.
        REPLACE_CREATE_BEFORE_DESTROY: An existing entity will replaced by first creating a replacement and then deleting the original.
        REPLACE_DESTROY_BEFORE_CREATE: An existing entity will replaced by first deleting the original and then creating a replacement.
        RESCUED: A task that resulted with status rescued.
        SKIPPED: A task that resulted with status skipped.
        UNREACHABLE: A host that was unreachable.
      x-graphql-type: EntityChangeType
    EntityChangeV2:
      description: A Terraform managed entity change description.
      properties:
        entity:
          $ref: '#/components/schemas/ManagedEntityV2'
        phase:
          $ref: '#/components/schemas/EntityChangePhase'
        type:
          $ref: '#/components/schemas/EntityChangeType'
      required:
        - entity
        - phase
        - type
      type: object
      x-graphql-type: EntityChangeV2
    EntityChangeV3:
      description: A Terraform-family (Terraform, OpenTofu, Terragrunt) managed entity change description.
      properties:
        address:
          description: The address of the resource
          type: string
        attributeChanges:
          description: |-
            Changes here is a list of the changes that happened to the individual resource
            For example: if someone edited the tags on an EC2 instance, this would be a list of the tags that changed
          items:
            $ref: '#/components/schemas/EntityAttributeChange'
          type: array
        metadata:
          $ref: '#/components/schemas/EntityChangeMetadata'
        previousAddress:
          description: The previous address of the resource in the case of the resource being moved
          type: string
      required:
        - address
        - attributeChanges
        - metadata
        - previousAddress
      type: object
      x-graphql-type: EntityChangeV3
    EntityChangesInputV3:
      additionalProperties: false
      properties:
        changePhase:
          $ref: '#/components/schemas/EntityChangePhase'
        changeType:
          $ref: '#/components/schemas/EntityChangeType'
      type: object
      x-graphql-type: EntityChangesInputV3
    EntityChangesV2:
      properties:
        edges:
          items:
            $ref: '#/components/schemas/EntityChangeConnectionV2'
          type: array
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - edges
        - pageInfo
      type: object
      x-graphql-type: EntityChangesV2
    LocalWorkspaceUpload:
      additionalProperties: false
      description: >-
        A local workspace's upload: its ID, which a proposal names, and the
        URL to upload the archive to with an HTTP PUT carrying the headers.
      properties:
        id:
          description: The upload's ID.
          type: string
        uploadHeaders:
          $ref: '#/components/schemas/StringMap'
        uploadUrl:
          description: >-
            URL to upload the archived workspace to. It accepts the declared
            bytes alone, for a limited time.
          type: string
      required:
        - id
        - uploadUrl
        - uploadHeaders
      type: object
      x-graphql-type: LocalWorkspaceUpload
    LocalWorkspaceUploadRequest:
      additionalProperties: false
      description: The archive a local workspace's upload holds.
      properties:
        sha256:
          description: The SHA-256 of the archive's bytes, in hex.
          pattern: '^[0-9a-f]{64}$'
          type: string
        size:
          description: The archive's size in bytes, at most 2 GiB.
          format: int64
          maximum: 2147483648
          minimum: 1
          type: integer
      required:
        - size
        - sha256
      type: object
    LogsResponse:
      description: A page of the lines one state of a run logged.
      properties:
        deleted:
          description: Whether the logs were deleted on demand. Implies expired.
          type: boolean
        exists:
          description: Whether the run ever entered the state at that version.
          type: boolean
        expired:
          description: >-
            Whether retention removed some of the lines the page would hold,
            which the page leaves out.
          type: boolean
        finished:
          description: >-
            Whether the page holds the state's last lines: the run has left the
            state and no lines follow.
          type: boolean
        hasMore:
          description: Whether more lines can be read now with nextToken.
          type: boolean
        messages:
          description: The lines, in the order they were written.
          items:
            $ref: '#/components/schemas/LogMessage'
          type: array
        nextToken:
          description: >-
            The token that reads the lines after this page, absent once the page
            is finished.
          nullable: true
          type: string
        ongoing:
          description: >-
            Whether the run is still in the requested state, so more lines may
            come.
          type: boolean
      required:
        - deleted
        - exists
        - expired
        - finished
        - hasMore
        - messages
        - ongoing
      type: object
      x-graphql-type: LogsResponse
    ManagedEntityV2:
      description: Managed infrastructure entity V2
      properties:
        address:
          description: Address of the ManagedEntity in the module.
          type: string
        creator:
          $ref: '#/components/schemas/RunRef'
        drifted:
          description: Unix timestamp of when drift was detected on this entity, if ever.
          format: int32
          nullable: true
          type: integer
        id:
          description: ID of the ManagedEntity, its full address.
          type: string
        name:
          description: ManagedEntity Name.
          type: string
        parent:
          description: Parent of this entity. May be a module or may be another entity.
          type: string
        thirdPartyMetadata:
          description: Custom metadata attached to the entity by a third-party integration.
          nullable: true
          type: string
        type:
          description: ManagedEntity Type.
          type: string
        updater:
          $ref: '#/components/schemas/RunRef'
      required:
        - address
        - id
        - name
        - parent
        - type
      type: object
      x-graphql-type: ManagedEntityV2
    ResourceChange:
      properties:
        resources:
          items:
            $ref: '#/components/schemas/EntityChangeV3'
          type: array
      required:
        - resources
      type: object
      x-graphql-type: ResourceChange
    RunCancelRequest:
      additionalProperties: false
      description: The arguments of runCancel not carried in the path.
      properties:
        note:
          nullable: true
          type: string
      type: object
      x-graphql-args-of: runCancel
    RunConfirmRequest:
      additionalProperties: false
      description: The arguments of runConfirm not carried in the path.
      properties:
        note:
          nullable: true
          type: string
        run:
          description: >-
            The run to confirm. When absent, the run that holds the stack's
            lock is confirmed.
          nullable: true
          type: string
      type: object
      x-graphql-args-of: runConfirm
    RunConnection:
      description: RunConnection represents a single run in a page of searchRuns results.
      properties:
        cursor:
          type: string
        node:
          $ref: '#/components/schemas/RunWithStack'
      required:
        - cursor
        - node
      type: object
      x-graphql-type: RunConnection
    RunDiscardRequest:
      additionalProperties: false
      description: The arguments of runDiscard not carried in the path.
      properties:
        note:
          nullable: true
          type: string
        run:
          description: >-
            The run to discard. When absent, the run that holds the stack's
            lock is discarded.
          nullable: true
          type: string
      type: object
      x-graphql-args-of: runDiscard
    RunPrioritySetRequest:
      additionalProperties: false
      description: The arguments of runPrioritySet not carried in the path.
      properties:
        preset:
          $ref: '#/components/schemas/RunPriorityPreset'
      required:
        - preset
      type: object
      x-graphql-args-of: runPrioritySet
    RunProposeLocalWorkspaceRequest:
      additionalProperties: false
      description: The arguments of runProposeLocalWorkspace not carried in the path.
      properties:
        workspace:
          description: The ID of the local workspace's upload.
          type: string
      required:
        - workspace
      type: object
      x-graphql-args-of: runProposeLocalWorkspace
    RunWithStack:
      description: |-
        RunWithStack is a run together with the stack (or module) it belongs to, so
        the account-wide runs view can render stack details without a separate
        per-stack query.
      properties:
        isModule:
          description: |-
            Whether the run belongs to a module. Surfaced here because the Stack type
            does not expose it.
          type: boolean
        run:
          $ref: '#/components/schemas/RunRef'
        stack:
          $ref: '#/components/schemas/StackRef'
      required:
        - isModule
        - run
        - stack
      type: object
      x-graphql-type: RunWithStack
    SearchRunsOutput:
      description: SearchRunsOutput is a page of account-wide runs returned by searchRuns.
      properties:
        edges:
          items:
            $ref: '#/components/schemas/RunConnection'
          type: array
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
        total:
          description: |-
            Total number of runs matching the query, ignoring pagination.
            Computed with a single COUNT query and resolved lazily, only select it when needed.
          format: int32
          type: integer
      required:
        - edges
        - pageInfo
        - total
      type: object
      x-graphql-type: SearchRunsOutput
    SearchRunsRequest:
      additionalProperties: false
      description: The arguments of searchRuns not carried in the path.
      properties:
        input:
          $ref: '#/components/schemas/SearchInput'
        offset:
          format: int32
          nullable: true
          type: integer
      required:
        - input
      type: object
      x-graphql-args-of: searchRuns
paths:
  /runs/{runId}:
    get:
      description: Details of a single Run by ID, without needing to know the stack.
      operationId: run
      x-infraweave-feature: runs
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
          x-graphql-arg: id
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: The run result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Get Run
      tags:
        - Runs
      x-bruno: Runs/Get Run.bru
      x-graphql:
        field: run
        operation: query
        type: Query
      x-infraweave-action: SPACE_READ
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - rate-limit
      x-infraweave-subject: path:runId:run
      x-rest-style: item
  /runs/{runId}/changes-v2:
    get:
      description: |-
        The entities the run changed, a page at a time, in the order its
        plan lists them. Pass the page's pageInfo.endCursor as input.after
        to read on. Without input.changePhase every phase's changes are
        listed. Only the plan records changes, so an apply or a drift
        detection lists none, and a run that has not planned lists none.
        Each entity's id is its address, address its address within its
        module, and parent that module, empty for the root module.
      operationId: runChangesV2
      x-infraweave-feature: runs
      parameters:
        - description: Selects the parent object.
          in: path
          name: runId
          required: true
          schema:
            type: string
        - content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityChangeCollectionInputV2'
          in: query
          name: input
          required: true
          x-graphql-arg: input
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityChangesV2'
          description: The changesV2 result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "400":
          $ref: '#/components/responses/InvalidCursor'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Run changes V2
      tags:
        - Runs
      x-graphql:
        field: changesV2
        operation: query
        type: Run
      x-infraweave-action: SPACE_READ
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - rate-limit
      x-infraweave-subject: path:runId:run
      x-rest-style: field
  /runs/{runId}/changes-v3:
    get:
      description: |-
        The resources the run changed in the phase input.changePhase names,
        else in its latest phase that recorded changes, in the order its
        plan lists them, as one set. Only the plan records changes, so an
        apply or a drift detection answers none, and a run that has not
        planned answers an empty list. Only Terraform and OpenTofu stacks
        have resource changes: another vendor's run is refused, and
        changes-v2 reads its changes. Each change's attributeChanges is
        empty.
      operationId: runChangesV3
      x-infraweave-feature: runs
      parameters:
        - description: Selects the parent object.
          in: path
          name: runId
          required: true
          schema:
            type: string
        - content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityChangesInputV3'
          in: query
          name: input
          required: true
          x-graphql-arg: input
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ResourceChange'
                type: array
          description: The changesV3 result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Run changes V3
      tags:
        - Runs
      x-graphql:
        field: changesV3
        operation: query
        type: Run
      x-infraweave-action: SPACE_READ
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - rate-limit
      x-infraweave-subject: path:runId:run
      x-rest-style: field
  /runs/{runId}/logs:
    get:
      description: |-
        A page of the lines one of the run's states logged, past or present,
        in the order they were written. Each line's timestamp is when the
        worker began the chunk that holds it.

        Pass the answer's nextToken as token to read on. While the run is
        in the state, a page may be empty and nextToken stays set; once
        finished is true the state has no more lines. A state the run never
        entered answers an empty, finished page with exists false. Set
        sanitize to strip ANSI escape sequences from each line.
      operationId: runLogs
      x-infraweave-feature: runs
      parameters:
        - description: Selects the parent object.
          in: path
          name: runId
          required: true
          schema:
            type: string
        - description: The state whose lines to read.
          in: query
          name: state
          required: true
          schema:
            $ref: '#/components/schemas/RunState'
          x-graphql-arg: state
        - description: >-
            The state's execution, counted by the run's state version. Absent,
            the latest execution of the state.
          in: query
          name: stateVersion
          schema:
            format: int32
            type: integer
          x-graphql-arg: stateVersion
        - description: The nextToken of the previous page.
          in: query
          name: token
          schema:
            type: string
          x-graphql-arg: token
        - description: Strip ANSI escape sequences from each line.
          in: query
          name: sanitize
          schema:
            type: boolean
          x-graphql-arg: sanitize
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsResponse'
          description: The logs result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "400":
          $ref: '#/components/responses/InvalidCursor'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Run logs
      tags:
        - Runs
      x-graphql:
        field: logs
        operation: query
        type: Run
      x-infraweave-action: SPACE_READ
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - rate-limit
        - DV-117
      x-infraweave-subject: path:runId:run
      x-rest-style: field
  /runs/{runId}/logs-download-url:
    get:
      description: |-
        A pre-signed URL that downloads the whole log of one of the run's
        states, once the run has left the state and its lines are written
        to one object. Until then ongoing is true; expired is true when the
        state wrote no lines or retention removed them.
      operationId: runLogsDownloadURL
      x-infraweave-feature: runs
      parameters:
        - description: Selects the parent object.
          in: path
          name: runId
          required: true
          schema:
            type: string
        - description: The state whose lines to read.
          in: query
          name: state
          required: true
          schema:
            $ref: '#/components/schemas/RunState'
          x-graphql-arg: state
        - description: >-
            The state's execution, counted by the run's state version. Absent,
            the latest execution of the state.
          in: query
          name: stateVersion
          schema:
            format: int32
            type: integer
          x-graphql-arg: stateVersion
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsDownloadURL'
          description: The logsDownloadURL result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Run logs download URL
      tags:
        - Runs
      x-graphql:
        field: logsDownloadURL
        operation: query
        type: Run
      x-infraweave-action: SPACE_READ
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - rate-limit
      x-infraweave-subject: path:runId:run
      x-rest-style: field
  /runs/{runId}/stack:
    get:
      description: Return the stack the run belongs to.
      operationId: runStack
      x-infraweave-feature: runs
      parameters:
