      x-rest-style: item
    patch:
      description: Change the members of ContextUpdateV2Request that a JSON Merge Patch (RFC 7396) names and keep the rest; null resets a member to its default. It runs through contextUpdateV2, so it validates and persists as the PUT does.
      operationId: contextPatch
      x-infraweave-feature: contexts
      x-infraweave-action: CONTEXT_UPDATE
      x-infraweave-subject: path:contextId:context
      parameters:
        - in: path
          name: contextId
          required: true
