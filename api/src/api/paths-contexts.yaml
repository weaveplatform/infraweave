            type: string
          x-graphql-arg: id
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/MergePatch'
        description: A JSON Merge Patch of ContextUpdateV2Request.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Context'
          description: The contextUpdateV2 result.
          headers:
