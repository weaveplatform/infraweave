              $ref: '#/components/headers/ETag'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/IdempotencyConflict'
        "412":
          $ref: '#/components/responses/PreconditionFailed'
        "422":
          $ref: '#/components/responses/IdempotencyMismatch'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Patch Context
      tags:
        - Contexts
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - idempotency-key
        - if-match
        - merge-patch
        - rate-limit
      x-upstream: none
    put:
      description: >-
        Replace a context's name, description, labels, hooks and space. Its
        config elements change only when replaceConfigElements is true:
        they become input.configAttachments, and an element left out is
        deleted. A move to another space needs CONTEXT_CREATE there, and is
        refused with 422 when a stack attached to the context could no
        longer reach it.
