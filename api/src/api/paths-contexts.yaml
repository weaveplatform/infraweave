  /contexts/{contextId}/configs/{configId}:
    delete:
      description: Delete a config element of a context.
      operationId: contextConfigDelete
      x-infraweave-feature: contexts
      x-infraweave-action: CONTEXT_UPDATE
      x-infraweave-subject: path:contextId:context
      parameters:
        - in: path
          name: contextId
          required: true
          schema:
            type: string
          x-graphql-arg: context
        - in: path
          name: configId
          required: true
          schema:
            type: string
          x-graphql-arg: id
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigElement'
          description: The contextConfigDelete result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Delete Config
      tags:
        - Contexts
      x-bruno: Contexts/Delete Config.bru
      x-graphql:
        field: contextConfigDelete
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - rate-limit
      x-rest-style: delete
    put:
      description: >-
        Create or replace the config element at configId, the variable's
        name or the file's path: 201 when it is created and 200 when it
        replaces one.
      operationId: contextConfigSet
      x-infraweave-feature: contexts
      x-infraweave-action: CONTEXT_UPDATE
      x-infraweave-subject: path:contextId:context
      parameters:
        - in: path
          name: contextId
          required: true
          schema:
            type: string
        - in: path
          name: configId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              description: My environment variable
              type: ENVIRONMENT_VARIABLE
              value: my-value
              writeOnly: false
            schema:
              $ref: '#/components/schemas/ConfigElementInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigElement'
          description: Replaced.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigElement'
          description: Created.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Set Config
      tags:
        - Contexts
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - DV-085
        - rate-limit
      x-upstream: none
