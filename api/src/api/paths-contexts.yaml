  /stacks/{stackId}/contexts/{contextId}:
    put:
      description: >-
        Attach a context to a stack with a priority, or change the priority
        of its attachment. Contexts attached to a stack sort by priority,
        lowest first, and a lower value takes precedence. A context outside
        the stack's space and the ancestors it inherits from is refused
        with 422.
      operationId: contextAttach
      x-infraweave-feature: contexts
      x-infraweave-action: STACK_CONTEXT_ATTACH
      x-infraweave-subject: path:stackId:stack
      parameters:
        - description: ID of the stack to attach the context to
          in: path
          name: stackId
          required: true
          schema:
            type: string
          x-graphql-arg: stack
          x-terraform:
            - spacelift_context_attachment.stack_id
        - in: path
          name: contextId
          required: true
          schema:
            type: string
          x-graphql-arg: id
      requestBody:
        content:
          application/json:
            example:
              priority: 1
            schema:
              $ref: '#/components/schemas/ContextAttachRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextStackAttachment'
          description: The contextAttach result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Attach Context
      tags:
        - Contexts
      x-bruno: Contexts/Attach Context.bru
      x-graphql:
        field: contextAttach
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - rate-limit
      x-rest-style: attach
