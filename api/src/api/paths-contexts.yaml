# Scaffolded by `specref scaffold --tag Contexts` from the Spacelift reference (schema-1fc7d2c49a8e).
# This fragment is infraweave's own: curate it freely. Scaffolding again with --force overwrites it.
components:
  schemas:
    ContextAttachRequest:
      additionalProperties: false
      description: The arguments of contextAttach not carried in the path.
      properties:
        priority:
          description: Priority of the context attachment. All the contexts attached to a stack are sorted by priority (lowest first), though values don't need to be unique. This ordering establishes precedence rules between contexts should there be a conflict and multiple contexts define the same value. Defaults to `0`.
          format: int32
          type: integer
          x-terraform:
            - spacelift_context_attachment.priority
      required:
        - priority
      type: object
      x-graphql-args-of: contextAttach
    ContextInput:
      additionalProperties: false
      description: ContextInput represents the data used to configure a Context.
      properties:
        configAttachments:
          description: >-
            The context's config elements. A create adds each; an update
            replaces the context's elements with these only when
            replaceConfigElements is true, and ignores them otherwise. Two
            elements with one ID are refused.
          items:
            $ref: '#/components/schemas/ConfigInput'
          nullable: true
          type: array
        description:
          description: Free-form context description for users
          nullable: true
          type: string
          x-terraform:
            - spacelift_context.description
        hooks:
          $ref: '#/components/schemas/HooksInput'
        labels:
          description: 'The labels of the context. To leverage the `autoattach` magic label, ensure your label follows the naming convention: `autoattach:<your-label-name>`'
          items:
            type: string
          nullable: true
          type: array
          x-terraform:
            - spacelift_context.labels
        name:
          description: Name of the context - should be unique in one account
          type: string
          x-terraform:
            - spacelift_context.name
        space:
          description: ID (slug) of the space the context is in
          nullable: true
          type: string
          x-terraform:
            - spacelift_context.space_id
        stackAttachments:
          description: >-
            Stacks a create attaches the context to, each as contextAttach
            would. An update refuses a non-empty list; contextAttach and
            contextDetach change an existing context's attachments.
          items:
            $ref: '#/components/schemas/ContextStackAttachmentInput'
          nullable: true
          type: array
      required:
        - name
      type: object
      x-graphql-type: ContextInput
    ContextStackAttachmentInput:
      additionalProperties: false
      properties:
        priority:
          format: int32
          type: integer
        stack:
          type: string
      required:
        - priority
        - stack
      type: object
      x-graphql-type: ContextStackAttachmentInput
    ContextUpdateV2Request:
      additionalProperties: false
      description: The arguments of contextUpdateV2 not carried in the path.
      properties:
        input:
          $ref: '#/components/schemas/ContextInput'
        replaceConfigElements:
          description: >-
            Whether input.configAttachments replaces the context's config
            elements. Absent or false leaves them as they are.
          nullable: true
          type: boolean
      required:
        - input
      type: object
      x-graphql-args-of: contextUpdateV2
    ContextsConnection:
      properties:
        cursor:
          type: string
        node:
          $ref: '#/components/schemas/ContextRef'
      required:
        - cursor
        - node
      type: object
      x-graphql-type: ContextsConnection
    HooksInput:
      additionalProperties: false
      properties:
        afterApply:
          items:
            type: string
          type: array
        afterDestroy:
          items:
            type: string
          type: array
        afterInit:
          items:
            type: string
          type: array
        afterPerform:
          items:
            type: string
          type: array
        afterPlan:
          items:
            type: string
          type: array
        afterRun:
          items:
            type: string
          type: array
        beforeApply:
          items:
            type: string
          type: array
        beforeDestroy:
          items:
            type: string
          type: array
        beforeInit:
          items:
            type: string
          type: array
        beforePerform:
          items:
            type: string
          type: array
        beforePlan:
          items:
            type: string
          type: array
      required:
        - afterApply
        - afterDestroy
        - afterInit
        - afterPerform
        - afterPlan
        - afterRun
        - beforeApply
        - beforeDestroy
        - beforeInit
        - beforePerform
        - beforePlan
      type: object
      x-graphql-type: HooksInput
    ConfigElementInput:
      additionalProperties: false
      description: >-
        A config element to create or replace at the ID in the path. An
        absent value keeps a replaced element's value, so a write-only
        value need not be sent again; it cannot make a write-only element
        readable.
      properties:
        description:
          description: Description of the config element.
          nullable: true
          type: string
        fileMode:
          description: File mode (user, group and other) of a file mount, in octal.
          nullable: true
          type: string
        type:
          $ref: '#/components/schemas/ConfigType'
        value:
          description: >-
            The variable's value, or the file's content in Base64, at most
            2 MB decoded.
          type: string
        writeOnly:
          description: Whether the value is readable only by runs.
          type: boolean
      required:
        - type
        - writeOnly
      type: object
    SearchContextsOutput:
      properties:
        edges:
          items:
            $ref: '#/components/schemas/ContextsConnection'
          type: array
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - edges
        - pageInfo
      type: object
      x-graphql-type: SearchContextsOutput
paths:
  /attachable-contexts-in-space:
    get:
      description: >-
        The contexts a stack in the space id may attach that the caller may
        read: those in the space, and those in each ancestor reached through
        an unbroken chain of spaces that inherit their parent's entities.
      operationId: attachableContextsInSpace
      x-infraweave-feature: contexts
      x-infraweave-action: SPACE_READ
      x-infraweave-subject: query:id
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
          x-graphql-arg: id
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextPage'
          description: The attachableContextsInSpace result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "400":
          $ref: '#/components/responses/InvalidCursor'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Attachable Contexts in Space
      tags:
