# Shapes every family shares. Problem and its responses match the Spacelift
# reference's, so scaffolded families reference them instead of copying.
# The idempotency, rate-limit and pagination pieces implement
# docs/research/decisions/0003-api-conventions.md; problem type slugs must be
# ones that record lists.
components:
  schemas:
    Problem:
      description: >-
        An RFC 9457 problem detail. Every error response uses the status code
        and this body.
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          description: A URI naming the problem type.
        title:
          type: string
          description: A short summary of the problem type.
        status:
          type: integer
          format: int32
          description: The HTTP status code, repeated for clients that lose it.
        detail:
          type: string
          description: What went wrong with this request.
        instance:
          type: string
          description: >-
            The request this problem answers, as urn:infraweave:request: and
            the request ID the X-Request-Id response header carries and the
            server logs.
        action:
          type: string
          description: >-
            For forbidden, when an action decided it, the action the caller
            may not perform, a value of the Action enum or a pseudo-action.
        lockedBy:
          type: string
          description: For resource-locked, who holds the lock.
        feature:
          type: string
          description: >-
            The feature of feature-disabled and feature-not-in-tier, a name
            of the feature catalogue.
        tiers:
          type: array
          items:
            type: string
          description: >-
            For feature-not-in-tier, the tiers that include the feature,
            smallest first.
        limit:
          type: string
          description: The limit of limit-reached, such as seats.
        scope:
          type: string
          enum: [organization, account]
          description: >-
            For limit-reached, whether the organization's pool or the
            account's limit was reached.
        value:
          type: integer
          format: int64
          description: For limit-reached, that scope's limit.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemFieldError'
          description: >-
            For invalid-request and validation-failed, each field the server
            refused.
    ProblemFieldError:
      description: A field of the request the server refused.
      type: object
      required: [pointer, reason, message]
      properties:
        pointer:
          type: string
          description: >-
            A JSON Pointer (RFC 6901) into the body, or #/query/<name>,
            #/path/<name> or #/header/<name> for a parameter.
        reason:
          type: string
          enum:
            - required
            - type
            - enum
            - format
            - pattern
            - min-length
            - max-length
            - minimum
            - maximum
            - unknown-field
            - duplicate
            - not-found
            - rule
          description: Why the field was refused, for clients to branch on.
        message:
          type: string
          description: The refusal, for people.
        range:
          $ref: '#/components/schemas/SourceRange'
    SourceRange:
      description: >-
        Where in an expression or template the fault lies, so an editor can
        underline it, from start up to but not including end. Only an error
        in source text carries one.
      type: object
      required: [start, end]
      properties:
        start:
          $ref: '#/components/schemas/SourcePosition'
        end:
          $ref: '#/components/schemas/SourcePosition'
    SourcePosition:
      description: >-
        A place in source text. Lines and columns are counted from 1, and a
        column counts Unicode code points.
      type: object
      required: [line, column]
      properties:
        line:
          type: integer
          format: int32
          minimum: 1
        column:
          type: integer
          format: int32
          minimum: 1
    MergePatch:
      description: >-
        A JSON Merge Patch (RFC 7396) of an update's input. Each member it
        names replaces the input's, an object member merges into the
        input's object, an array replaces the input's whole, and null
        resets the member to its default. Members it does not name keep
        their values.
      type: object
      additionalProperties: true
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Makes a retry of this request safe. A repeat with the same key and the
        same request replays the first response instead of acting again. Keys
        are scoped to the caller and kept for 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        The ETag of the version the change was made against, or *. When
        the entity has changed since, the request answers 412
        precondition-failed and changes nothing. Without it, the last
        write wins.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        The nextCursor of the previous page. Leave it out for the first page.
        Cursors are opaque and never expire.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Values outside 1–100 are clamped.
      schema:
        type: integer
        format: int32
        default: 20
  headers:
    RateLimitLimit:
      description: The capacity of the rate-limit bucket this request drew from.
      schema:
        type: integer
    RateLimitRemaining:
      description: Whole requests left in that bucket.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until that bucket is full again.
      schema:
        type: integer
    ETag:
      description: >-
        The strong entity tag of the version answered, which If-Match
        takes to make a later change conditional on it.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    IdempotencyReplayed:
      description: >-
        Present and true when this response is a replay of the first request
        made with the same Idempotency-Key.
      schema:
        type: boolean
  responses:
    TooManyRequests:
      description: The caller's rate-limit bucket for this operation's cost class is empty.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:infraweave:problem:rate-limited
            title: Rate limit exceeded
            status: 429
            instance: urn:infraweave:request:MSVOJ63PHPYPDOE6VID5JWYBBI
    ApiDisabled:
      description: The operator has disabled the API for this caller.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:infraweave:problem:api-disabled
            title: API disabled for this caller
            status: 503
            instance: urn:infraweave:request:MSVOJ63PHPYPDOE6VID5JWYBBI
    IdempotencyConflict:
      description: >-
        A request with this Idempotency-Key is still in flight. Retry after it
        finishes.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:infraweave:problem:idempotency-key-in-flight
            title: Idempotency key in use
            status: 409
            instance: urn:infraweave:request:MSVOJ63PHPYPDOE6VID5JWYBBI
    IdempotencyMismatch:
      description: This Idempotency-Key was already used with a different request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:infraweave:problem:idempotency-key-reuse
            title: Idempotency key reused
            status: 422
            instance: urn:infraweave:request:MSVOJ63PHPYPDOE6VID5JWYBBI
    InvalidCursor:
      description: The cursor doesn't decode, or belongs to another list.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:infraweave:problem:invalid-cursor
            title: Invalid cursor
            status: 400
            instance: urn:infraweave:request:MSVOJ63PHPYPDOE6VID5JWYBBI
    PreconditionFailed:
      description: >-
        The If-Match names no version the entity has now: it changed since
        the caller read it. Read it again and reapply the change.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:infraweave:problem:precondition-failed
            title: precondition failed
            status: 412
            instance: urn:infraweave:request:MSVOJ63PHPYPDOE6VID5JWYBBI
    NotFound:
      description: No such resource, or the caller may not see it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: The request failed; the body says why.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A JWT issued by infraweave's token endpoint.
