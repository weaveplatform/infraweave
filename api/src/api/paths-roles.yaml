      x-rest-style: list
    post:
      description: >-
        Create a custom role from actions of the catalogue, its slug derived
        from its name. A disabled action answers 422 validation-failed naming
        it; a deprecated action, which the Action enum leaves out, answers 400
        invalid-request naming it, as any value outside the enum does. A slug
        the account already has answers 409 already-exists.
      operationId: roleCreate
      x-infraweave-feature: roles
      x-infraweave-action: ACCOUNT_ADMIN
      x-infraweave-subject: account
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              actions: []
              description: Custom role
              name: my-role
            schema:
              $ref: '#/components/schemas/RoleInput'
        required: true
        x-graphql-arg: input
      responses:
        "201":
