# Scaffolded by `specref scaffold --tag Managed Users` from the Spacelift reference (schema-1fc7d2c49a8e).
# This fragment is infraweave's own: curate it freely. Scaffolding again with --force overwrites it.
components:
  schemas:
    AvailableUserGroupsPage:
      description: One page of a cursor-paginated list.
      properties:
        items:
          items:
            type: string
          type: array
        nextCursor:
          description: Pass as cursor to fetch the next page. Absent on the last page.
          type: string
      required:
        - items
      type: object
    IdentityProvider:
      enum:
        - UNKNOWN
        - GITHUB
        - GOOGLE
        - GITLAB
        - MICROSOFT
        - OIDC
        - SAML
        - EMPTY
      type: string
      x-enum-descriptions:
        EMPTY: Default setting for self-hosted installations before SAML or OIDC is configured. Not valid in SaaS.
      x-graphql-type: IdentityProvider
    ManagedUser:
      properties:
        accessRules:
          description: List of permissions given explicitly to given user.
          items:
            $ref: '#/components/schemas/SpaceAccessRule'
          type: array
        allowedActions:
          description: The actions the caller may perform on the managed user, from the rules that enforce them.
          items:
            $ref: '#/components/schemas/Action'
          type: array
        groupCount:
          description: Number of groups in your identity provider that this user was a member of on last login.
          format: int32
          type: integer
        id:
          description: Globally unique, immutable ID of ManagedUser.
          type: string
        invitationEmail:
          description: Email through which user was invited to given account. Can be empty.
          nullable: true
          type: string
        lastLoginTime:
          description: Unix timestamp (in seconds) at which user has last authenticated.
          format: int32
          nullable: true
          type: integer
        latestGroups:
          description: Groups in your identity provider that this user was a member of on last login.
          items:
            type: string
          type: array
        latestInvitation:
          $ref: '#/components/schemas/ManagedUserInvitation'
        loginMethod:
          $ref: '#/components/schemas/IdentityProvider'
        role:
          $ref: '#/components/schemas/UserRole'
        scimGroupMemberships:
          description: Names of groups the user is a SCIM-provisioned member of.
          items:
            type: string
          type: array
        scimMetadata:
          $ref: '#/components/schemas/SCIMUserMetadata'
        slackMemberID:
          description: The Slack member ID that acts with this managed user's permissions through the Slack integration.
          nullable: true
          type: string
        spaceCount:
          description: Number of spaces user was explicitly given permissions to.
          format: int32
          type: integer
        status:
          $ref: '#/components/schemas/UserStatus'
        username:
          description: Username from account's identity provider.
          type: string
      required:
        - accessRules
        - allowedActions
        - groupCount
        - id
        - latestGroups
        - loginMethod
        - role
        - scimGroupMemberships
        - spaceCount
        - status
        - username
      type: object
      x-graphql-omitted:
        personalApiKeys: served by GET /managed-users/{managedUserId}/personal-api-keys
        userRoleBindings: served by GET /managed-users/{managedUserId}/user-role-bindings
      x-graphql-type: ManagedUser
    ManagedUserGroup:
      properties:
        accessRules:
          description: List of permissions given explicitly to given user group.
          items:
            $ref: '#/components/schemas/SpaceAccessRule'
          type: array
        description:
          description: Description is optional, user-provided text describing the group resource or serving as a human-readable name.
          type: string
        groupName:
          description: Name of user group from account's identity provider.
          type: string
        id:
          description: Globally unique, immutable ID of ManagedUserGroup.
          type: string
        identityProvider:
          $ref: '#/components/schemas/IdentityProvider'
        lastLoginTime:
          description: Unix timestamp (in seconds) at which user from this group was last authenticated.
          format: int32
          nullable: true
          type: integer
        memberCount:
          description: Number of members of this group who logged into this account.
          format: int32
          type: integer
        members:
          description: Members of this group
          items:
            type: string
          type: array
        scimMetadata:
          $ref: '#/components/schemas/SCIMGroupMetadata'
        spaceCount:
          description: Number of spaces user group was explicitly given permissions to.
          format: int32
          type: integer
        status:
          $ref: '#/components/schemas/UserGroupStatus'
      required:
        - accessRules
        - description
        - groupName
        - id
        - identityProvider
        - memberCount
        - members
        - spaceCount
        - status
      type: object
      x-graphql-omitted:
        managedUsers: served by GET /managed-user-groups/{managedUserGroupId}/managed-users
        userRoleBindings: served by GET /managed-user-groups/{managedUserGroupId}/user-role-bindings
      x-graphql-type: ManagedUserGroup
    ManagedUserGroupCreateInputV2:
      properties:
        description:
          nullable: true
          type: string
        groupName:
          type: string
        roleBindings:
          items:
            $ref: '#/components/schemas/RoleBindingInput'
          type: array
      required:
        - groupName
        - roleBindings
      type: object
      x-graphql-type: ManagedUserGroupCreateInputV2
    ManagedUserGroupPage:
      description: One page of a cursor-paginated list.
      properties:
        items:
          items:
            $ref: '#/components/schemas/ManagedUserGroup'
          type: array
        nextCursor:
          description: Pass as cursor to fetch the next page. Absent on the last page.
          type: string
      required:
        - items
      type: object
    ManagedUserGroupUpdateInputV2Body:
      properties:
        description:
          nullable: true
          type: string
      type: object
      x-graphql-in-path: id
      x-graphql-type: ManagedUserGroupUpdateInputV2
    ManagedUserInvitation:
      properties:
        createdAt:
          description: Unix timestamp (in seconds) at which this invitation was issued.
          format: int32
          type: integer
        sentAt:
          description: Unix timestamp (in seconds) at which the invitation was sent. Can be empty for unsent invitations.
          format: int32
          nullable: true
          type: integer
      required:
        - createdAt
      type: object
      x-graphql-type: ManagedUserInvitation
    ManagedUserInviteInputV2:
      properties:
        invitationEmail:
          description: Email address of the user to invite.
          nullable: true
          type: string
        roleBindings:
          description: Access rules for the user.
          items:
            $ref: '#/components/schemas/RoleBindingInput'
          type: array
        slackMemberID:
          description: new slack member ID
          nullable: true
          type: string
        username:
          description: Unique identifier of a user within an identity provider.
          type: string
      required:
        - roleBindings
        - username
      type: object
      x-graphql-type: ManagedUserInviteInputV2
    ManagedUserPage:
      description: One page of a cursor-paginated list.
      properties:
        items:
          items:
            $ref: '#/components/schemas/ManagedUser'
          type: array
        nextCursor:
          description: Pass as cursor to fetch the next page. Absent on the last page.
          type: string
      required:
        - items
      type: object
    ManagedUserRequestInviteRequest:
      description: The arguments of managedUserRequestInvite not carried in the path.
      properties:
        email:
          type: string
        userName:
          type: string
      required:
        - email
        - userName
      type: object
      x-graphql-args-of: managedUserRequestInvite
    ManagedUserRequestRoleChangeRequest:
      description: The arguments of managedUserRequestRoleChange not carried in the path.
      properties:
        requestedAccessLevel:
          $ref: '#/components/schemas/SpaceAccessLevel'
      required:
        - requestedAccessLevel
      type: object
      x-graphql-args-of: managedUserRequestRoleChange
    ManagedUserUpdateInputBody:
      properties:
        accessRules:
          description: new access rules
          items:
            $ref: '#/components/schemas/SpaceAccessRuleInput'
          type: array
        slackMemberID:
          description: new slack member ID
          nullable: true
          type: string
      required:
        - accessRules
      type: object
      x-graphql-in-path: id
      x-graphql-type: ManagedUserUpdateInput
    RoleBindingInput:
      properties:
        roleID:
          description: ID of the role.
          type: string
        spaceID:
          description: ID of the space.
          type: string
      required:
        - roleID
        - spaceID
      type: object
      x-graphql-type: RoleBindingInput
    SCIMGroupMetadata:
      properties:
        externalId:
          description: External ID assigned by the SCIM identity provider
          type: string
      required:
        - externalId
      type: object
      x-graphql-type: SCIMGroupMetadata
    SCIMUserMetadata:
      properties:
        displayName:
          description: Display name from the SCIM identity provider (RFC 7643 §4.1.1)
          type: string
        email:
          description: Email address from the SCIM identity provider
          type: string
        externalId:
          description: External ID assigned by the SCIM identity provider
          type: string
        familyName:
          description: Family (last) name from the SCIM identity provider
          type: string
        formattedName:
          description: Formatted full name from the SCIM identity provider
          type: string
        givenName:
          description: Given (first) name from the SCIM identity provider
          type: string
        provisionedAt:
          description: Unix timestamp (seconds) at which the user was provisioned via SCIM
          format: int32
          type: integer
      required:
        - displayName
        - email
        - externalId
        - familyName
        - formattedName
        - givenName
        - provisionedAt
      type: object
      x-graphql-type: SCIMUserMetadata
    SpaceAccessRuleInput:
      properties:
        space:
          description: Slug of the space that this access rule affects.
          type: string
        spaceAccessLevel:
          $ref: '#/components/schemas/SpaceAccessLevel'
      required:
        - space
        - spaceAccessLevel
      type: object
      x-graphql-type: SpaceAccessRuleInput
    UserGroupStatus:
      enum:
        - ACTIVE
        - INACTIVE
      type: string
      x-graphql-type: UserGroupStatus
    UserRole:
      enum:
        - USER
        - ADMIN
        - OWNER
      type: string
      x-graphql-type: UserRole
    UserStatus:
      enum:
        - QUEUED
        - PENDING
        - ACTIVE
        - INACTIVE
      type: string
      x-graphql-type: UserStatus
paths:
  /available-user-groups:
    get:
      description: >-
        The groups the identity provider reported for the account's managed
        users at their latest sign-in, in name order: the names a managed user
        group can match.
      operationId: availableUserGroups
      x-infraweave-feature: managed-users
      x-infraweave-action: MANAGED_USER_GROUP_READ
      x-infraweave-subject: any
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableUserGroupsPage'
          description: The availableUserGroups result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "400":
          $ref: '#/components/responses/InvalidCursor'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: List Available Groups
      tags:
        - Managed Users
      x-bruno: Managed Users/User Groups/List Available Groups.bru
      x-graphql:
        field: availableUserGroups
        operation: query
        type: Query
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - cursor-pagination
        - rate-limit
      x-rest-style: read
  /managed-user-groups:
    get:
      description: >-
        The account's managed user groups, oldest first. A group is the
        account's: its members are the account's managed users whose latest
        sign-in reported its name, and it reaches no other account.
      operationId: managedUserGroups
      x-infraweave-feature: managed-users
      x-infraweave-action: MANAGED_USER_GROUP_READ
      x-infraweave-subject: any
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserGroupPage'
          description: The managedUserGroups result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "400":
          $ref: '#/components/responses/InvalidCursor'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: List User Groups
      tags:
        - Managed Users
      x-bruno: Managed Users/User Groups/List User Groups.bru
      x-graphql:
        field: managedUserGroups
        operation: query
        type: Query
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - cursor-pagination
        - rate-limit
      x-rest-style: list
    post:
      description: >-
        Create a managed user group of the account, matching the identity
        provider group groupName names. A name another group of the account
        holds answers 409 already-exists. Role bindings arrive with the
        account's roles: a non-empty roleBindings answers 400 invalid-request,
        so no grant is dropped silently.
      operationId: managedUserGroupCreateV2
      x-infraweave-feature: managed-users
      x-infraweave-action: MANAGED_USER_GROUP_CREATE
      x-infraweave-subject: account
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              description: My user group
              groupName: my-user-group
              roleBindings:
                - roleID: ROLE_ID_HERE
                  spaceID: root
            schema:
              $ref: '#/components/schemas/ManagedUserGroupCreateInputV2'
        required: true
        x-graphql-arg: input
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserGroup'
          description: Created.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "409":
          $ref: '#/components/responses/IdempotencyConflict'
        "422":
          $ref: '#/components/responses/IdempotencyMismatch'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Create User Group
      tags:
        - Managed Users
      x-bruno: Managed Users/User Groups/Create User Group.bru
      x-graphql:
        field: managedUserGroupCreateV2
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - idempotency-key
        - rate-limit
      x-rest-style: create
  /managed-user-groups/{managedUserGroupId}:
    delete:
      description: >-
        Delete the account's managed user group and answer it as it was. Its
        members stay managed users of the account.
      operationId: managedUserGroupDelete
      x-infraweave-feature: managed-users
      x-infraweave-action: MANAGED_USER_GROUP_DELETE
      x-infraweave-subject: account
      parameters:
        - in: path
          name: managedUserGroupId
          required: true
          schema:
            type: string
          x-graphql-arg: id
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserGroup'
          description: The managedUserGroupDelete result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Delete User Group
      tags:
        - Managed Users
      x-bruno: Managed Users/User Groups/Delete User Group.bru
      x-graphql:
        field: managedUserGroupDelete
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - rate-limit
      x-rest-style: delete
    get:
      description: >-
        The account's managed user group; a group of another account answers
        404.
      operationId: managedUserGroup
      x-infraweave-feature: managed-users
      x-infraweave-action: MANAGED_USER_GROUP_READ
      x-infraweave-subject: any
      parameters:
        - in: path
          name: managedUserGroupId
          required: true
          schema:
            type: string
          x-graphql-arg: id
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserGroup'
          description: The managedUserGroup result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Get User Group
      tags:
        - Managed Users
      x-bruno: Managed Users/User Groups/Get User Group.bru
      x-graphql:
        field: managedUserGroup
        operation: query
        type: Query
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - rate-limit
      x-rest-style: item
    put:
      description: >-
        Set the description of the account's managed user group.
      operationId: managedUserGroupUpdateV2
      x-infraweave-feature: managed-users
      x-infraweave-action: MANAGED_USER_GROUP_UPDATE
      x-infraweave-subject: account
      parameters:
        - description: Globally unique, immutable ID of ManagedUserGroup.
          in: path
          name: managedUserGroupId
          required: true
          schema:
            type: string
          x-graphql-arg: input.id
      requestBody:
        content:
          application/json:
            example:
              description: Updated description
            schema:
              $ref: '#/components/schemas/ManagedUserGroupUpdateInputV2Body'
        required: true
        x-graphql-arg: input
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserGroup'
          description: The managedUserGroupUpdateV2 result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Update User Group
      tags:
        - Managed Users
      x-bruno: Managed Users/User Groups/Update User Group.bru
      x-graphql:
        field: managedUserGroupUpdateV2
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - rate-limit
      x-rest-style: update
  /managed-user-groups/{managedUserGroupId}/managed-users:
    get:
      description: >-
        The managed users of the account whose latest sign-in reported the
        group's name, oldest first.
      operationId: managedUserGroupManagedUsers
      x-infraweave-feature: managed-users
      x-infraweave-action: MANAGED_USER_GROUP_READ
      x-infraweave-subject: any
      parameters:
        - description: Selects the parent object.
          in: path
          name: managedUserGroupId
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserPage'
          description: The managedUsers result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "400":
          $ref: '#/components/responses/InvalidCursor'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Managed user group managed users
      tags:
        - Managed Users
      x-graphql:
        field: managedUsers
        operation: query
        type: ManagedUserGroup
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - cursor-pagination
        - rate-limit
      x-rest-style: field
  /managed-user-invite-requests:
    post:
      description: >-
        Ask the account's admins to invite the person email and userName name.
        Nothing is delivered (no e-mail is sent): the request is recorded on the
        account's audit trail as managed_user.request_invite. Answers true.
      operationId: managedUserRequestInvite
      x-infraweave-feature: managed-users
      x-infraweave-action: AUTHENTICATED
      x-infraweave-subject: account
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              email: user@example.com
              userName: myuser
            schema:
              $ref: '#/components/schemas/ManagedUserRequestInviteRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                type: boolean
          description: Created.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "409":
          $ref: '#/components/responses/IdempotencyConflict'
        "422":
          $ref: '#/components/responses/IdempotencyMismatch'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Request Invite
      tags:
        - Managed Users
      x-bruno: Managed Users/Request Invite.bru
      x-graphql:
        field: managedUserRequestInvite
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - idempotency-key
        - rate-limit
      x-rest-style: override
  /managed-users:
    get:
      description: >-
        The account's managed users, oldest first: the organization's members
        the account admits, invited or signed in. A member another account
        admits appears here only once this account admits it too.
      operationId: managedUsers
      x-infraweave-feature: managed-users
      x-infraweave-action: MANAGED_USER_READ
      x-infraweave-subject: any
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserPage'
          description: The managedUsers result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "400":
          $ref: '#/components/responses/InvalidCursor'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: List Managed Users
      tags:
        - Managed Users
      x-bruno: Managed Users/List Managed Users.bru
      x-graphql:
        field: managedUsers
        operation: query
        type: Query
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - cursor-pagination
        - rate-limit
      x-rest-style: list
    post:
      description: >-
