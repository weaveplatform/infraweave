        login username names is admitted to the account; otherwise a PENDING
        member is created with that login. The invitation is recorded with
        invitationEmail and its sentAt, and no e-mail is sent: the person
        accepts by signing in through the invitation's link, never by an e-mail
        match. A member the account already admits, or an email with a pending
        invitation in the account, answers 409 invalid-state; a deactivated
        member 409 invalid-state. The invitation takes the member a seat unless
        another account of the organization already admits them; with billing
