components:
  schemas:
    AccountType:
      description: >-
        The type of the account's owner, as the reference enumerates GitHub
        account types. An infraweave account belongs to an organization, so
        it is always ORG.
      enum:
        - UNKNOWN
        - USER
        - ORG
      type: string
      x-enum-descriptions:
        ORG: Organization account.
        UNKNOWN: Invalid "zero value" for the account type.
        USER: Individual user account.
      x-graphql-type: AccountType
