# Scaffolded by `specref scaffold --tag Account` from the Spacelift reference (schema-1fc7d2c49a8e).
# This fragment is infraweave's own: curate it freely. Scaffolding again with --force overwrites it.
components:
  schemas:
    AccountType:
      description: >-
        The type of the account's owner, as the reference enumerates GitHub
        account types. An infraweave account belongs to an organization, so
        it is always ORG.
      enum:
        - UNKNOWN
        - USER
        - ORG
      type: string
      x-enum-descriptions:
        ORG: Organization account.
        UNKNOWN: Invalid "zero value" for the account type.
        USER: Individual user account.
      x-graphql-type: AccountType
paths:
  /default-private-worker-pool-runner-image:
    get:
      description: >-
        The account's default runner image for private pools, as
        accountUpdateDefaultWorkerPoolRunnerImages sets it, or the infraweave
        Terraform runner image when the account sets none. A run without an
        account default uses its vendor's infraweave runner image: Terraform's
        for Terraform and Terragrunt stacks, and OpenTofu's for OpenTofu stacks.
        A launcher's own default runner image overrides those vendor defaults.
      operationId: defaultPrivateWorkerPoolRunnerImage
      x-infraweave-feature: account-details
      x-infraweave-action: AUTHENTICATED
      x-infraweave-subject: account
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: The defaultPrivateWorkerPoolRunnerImage result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Get Default Private Worker Pool Runner Image
      tags:
        - Account
      x-bruno: Account/Get Default Private Worker Pool Runner Image.bru
      x-graphql:
        field: defaultPrivateWorkerPoolRunnerImage
        operation: query
        type: Query
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - rate-limit
      x-rest-style: read
  /default-public-worker-pool-runner-image:
    get:
      description: >-
        The account's default runner image for the public worker pool, as
        accountUpdateDefaultWorkerPoolRunnerImages sets it, or the infraweave
        Terraform runner image when the account sets none. A run without an
