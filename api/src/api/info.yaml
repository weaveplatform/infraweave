openapi: 3.0.3
info:
  title: infraweave Deploy API
  version: 0.1.0
  description: >-
    infraweave's infrastructure-as-code orchestration API: stacks, runs,
    policies, contexts and worker pools over REST. It starts from the
    reference specification in the repository's api/reference directory and
    may diverge from it.
servers:
  - url: /api/v1
    description: The versioned prefix on the server's single listener.
security:
  - bearerAuth: []
tags:
  - name: system
    description: Health and version endpoints that need no authentication.
  - name: handwritten
    description: Marker tag. Operations with this tag are implemented by hand and excluded from code generation.
  - name: Cloud Integrations
    description: >-
      Roles in a cloud account that runs assume instead of holding long-lived
      keys. An AWS integration lives in a space and attaches to the stacks
      that reach it, for read phases, write phases or both; each attachment
      assumes the role with an external ID fixed by the account, the
      integration, the stack and the side. An Azure integration is a
      multi-tenant Entra application the installation creates for a
      customer's tenant, whose admin consents to it; it attaches to stacks
      as an AWS integration does, with the subscription each stack uses.
  - name: Contexts
    description: >-
      Reusable bundles of environment variables, mounted files and hooks,
      attached to stacks by priority so configuration is shared rather than
      copied. Every value is sealed at rest, and a write-only one is
      readable only by runs.
  - name: Expressions
    description: >-
      The editor endpoints for the expressions users write: check a source
      against a surface, complete it at a cursor and evaluate it against
      sample values, with every secret masked.
  - name: Runs
    description: >-
      The run lifecycle: trigger, confirm, discard, cancel, stop and retry
      runs against a stack.
  - name: Spaces
    description: >-
      The account's tree of spaces, the unit of isolation and access: every
      stack, context and integration lives in one, and a space may inherit
      its parent's entities. The top space's slug is the account's.
  - name: Stacks
    description: >-
      Tracked pieces of infrastructure, each bound to a repository, a branch
      and a project root, with their locks, state and scheduled work.
  - name: Tofu Workspaces
    description: >-
      The separately locked states of each stack whose state infraweave
      manages, with who holds their locks, and the release of a lock a
      stopped or stuck run left behind.
