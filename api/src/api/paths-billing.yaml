      x-graphql:
        field: availableSelfServicePlans
        operation: query
        type: Query
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - DV-080
        - cursor-pagination
        - rate-limit
      x-rest-style: read
  /billed-externally:
    get:
      description: >-
        true: no Stripe subscription exists (decision 0021, DV-080).
      operationId: billedExternally
      x-infraweave-feature: usage
      responses:
        "200":
          content:
            application/json:
              schema:
                type: boolean
          description: The billedExternally result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Billed Externally
      tags:
        - Billing
      x-bruno: Advanced/Billing/Billed Externally.bru
      x-graphql:
        field: billedExternally
        operation: query
