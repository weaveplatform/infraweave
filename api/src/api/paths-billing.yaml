# Scaffolded by `specref scaffold --tag Billing` from the Spacelift reference (schema-1fc7d2c49a8e).
# This fragment is infraweave's own: curate it freely. Scaffolding again with --force overwrites it.
components:
  schemas:
    BillingAddon:
      description: BillingAddon represents an addon that can be bought along with the plan.
      properties:
        monthlyPrice:
          description: Monthly price of the addon in cents.
          format: int32
          type: integer
        name:
          $ref: '#/components/schemas/BillingAddonType'
        tiers:
          description: Tiers that are eligible for buying the addon.
          items:
            $ref: '#/components/schemas/BillingTier'
          type: array
        yearlyPrice:
          description: Yearly price of the addon in cents.
          format: int32
          type: integer
      required:
        - monthlyPrice
        - name
        - tiers
        - yearlyPrice
      type: object
      x-graphql-type: BillingAddon
    BillingAddonPage:
      description: One page of a cursor-paginated list (decision 0003).
      properties:
        items:
          items:
            $ref: '#/components/schemas/BillingAddon'
          type: array
        nextCursor:
          description: Pass as cursor to fetch the next page. Absent on the last page.
          type: string
      required:
        - items
      type: object
    BillingAddonType:
      description: |-
        BillingAddonType represents the addon types that are available to be subscribed to.
        This only applies to the V4_STARTER tier.
      enum:
        - ADDITIONAL_PUBLIC_WORKER
        - UNLIMITED_SEATS
      type: string
      x-graphql-type: BillingAddonType
    BillingCycleInterval:
      description: |-
        BillingCycleInterval represents the billing cycle interval for a subscription.
        This only applies to the V4_STARTER tier.
      enum:
        - MONTHLY
        - YEARLY
      type: string
      x-graphql-type: BillingCycleInterval
    BillingInfo:
      description: BillingInfo represents account billing details stored in Stripe
      properties:
        address:
          description: Billing address
          type: string
        city:
          description: Billing city
          type: string
        companyName:
          description: Company name
          type: string
        country:
          description: Country code (ISO 3166-1 alpha2)
          type: string
        email:
          description: Billing email
          type: string
        fullName:
          description: Full name of the billing contact
          type: string
        state:
          description: State (US-only)
          type: string
        taxIDType:
          description: Tax ID type (e.g., eu_vat, us_ein)
          nullable: true
          type: string
        taxIDValue:
          description: Tax ID value
          nullable: true
          type: string
        zipCode:
          description: Zip code
          type: string
      required:
        - address
        - city
        - companyName
        - country
        - email
        - fullName
        - state
        - zipCode
      type: object
      x-graphql-type: BillingInfo
    BillingPlan:
      description: BillingPlan represents a tier that can be bought.
      properties:
        monthlyPrice:
          description: Monthly price of the plan in cents.
          format: int32
          type: integer
        tier:
          $ref: '#/components/schemas/BillingTier'
        yearlyPrice:
          description: Yearly price of the plan in cents.
          format: int32
          type: integer
      required:
        - monthlyPrice
        - tier
        - yearlyPrice
      type: object
      x-graphql-type: BillingPlan
    BillingPlanPage:
      description: One page of a cursor-paginated list (decision 0003).
      properties:
        items:
          items:
            $ref: '#/components/schemas/BillingPlan'
          type: array
        nextCursor:
          description: Pass as cursor to fetch the next page. Absent on the last page.
          type: string
      required:
        - items
      type: object
    BillingSubscription:
      properties:
        addons:
          description: Addons of the subscription.
          items:
            $ref: '#/components/schemas/BillingSubscriptionAddon'
          type: array
        billingAmount:
          description: Price amount for the subscription. In cents.
          format: int32
          nullable: true
          type: integer
        billingCycleStart:
          description: Timestamp of start of the current billing cycle
          format: int32
          nullable: true
          type: integer
        billingInfo:
          $ref: '#/components/schemas/BillingInfo'
        billingInterval:
          $ref: '#/components/schemas/BillingCycleInterval'
        billingRenewalDate:
          description: Timestamp of the renewal date of the subscription
          format: int32
          nullable: true
          type: integer
        isActive:
          description: isActive describes if the account has active (premium) subscription
          type: boolean
        selfServePortalUrl:
          description: URL to Stripe-hosted portal which allows to manage subscription
          type: string
        status:
          $ref: '#/components/schemas/StripeSubscriptionStatus'
      required:
        - addons
        - isActive
        - selfServePortalUrl
        - status
      type: object
      x-graphql-type: BillingSubscription
    BillingSubscriptionAddon:
      properties:
        name:
          $ref: '#/components/schemas/BillingAddonType'
      required:
        - name
      type: object
      x-graphql-type: BillingSubscriptionAddon
    BillingSubscriptionCreateRequest:
      description: The arguments of billingSubscriptionCreate not carried in the path.
      properties:
        addons:
          items:
            $ref: '#/components/schemas/BillingAddonType'
          nullable: true
          type: array
        input:
          $ref: '#/components/schemas/SubscriptionInput'
        interval:
          $ref: '#/components/schemas/BillingCycleInterval'
        paymentMethodID:
          type: string
        tier:
          $ref: '#/components/schemas/BillingTier'
      required:
        - input
        - paymentMethodID
      type: object
      x-graphql-args-of: billingSubscriptionCreate
    BillingSubscriptionUpdateTierRequest:
      description: The arguments of billingSubscriptionUpdateTier not carried in the path.
      properties:
        interval:
          $ref: '#/components/schemas/BillingCycleInterval'
        tier:
          $ref: '#/components/schemas/BillingTier'
      required:
        - tier
      type: object
      x-graphql-args-of: billingSubscriptionUpdateTier
    BillingTier:
      description: The billing tier names the subscription operations take.
      enum:
        - FREE
        - CLOUD
        - ENTERPRISE
        - V3_FREE
        - V3_CLOUD
        - V4_FREE
        - V4_STARTER
        - V4_STARTER_PLUS
        - V4_BUSINESS
        - V4_ENTERPRISE
        - V5_FREE
        - V5_STARTER
        - V5_STARTER_PLUS
        - V5_STARTER_PLUS_2
        - V5_BUSINESS
        - V5_ENTERPRISE
        - V5_ENTERPRISE_PLUS
        - V5_STRATEGIC
      type: string
      x-enum-descriptions:
        CLOUD: Cloud billing tier.
        ENTERPRISE: Enterprise billing tier.
        FREE: Free billing tier.
        V3_CLOUD: Cloud billing tier.
        V3_FREE: Free billing tier.
        V4_BUSINESS: BUSINESS Billing tier.
        V4_ENTERPRISE: BUSINESS Billing tier.
        V4_FREE: Free Billing tier.
        V4_STARTER: Starter Billing tier.
        V4_STARTER_PLUS: Starter Plus Billing tier.
        V5_BUSINESS: Business Billing tier (V5).
        V5_ENTERPRISE: Enterprise Billing tier (V5).
        V5_ENTERPRISE_PLUS: Enterprise Plus Billing tier (V5).
        V5_FREE: Free Billing tier (V5).
        V5_STARTER: Starter Billing tier (V5).
        V5_STARTER_PLUS: Starter Plus Billing tier (V5).
        V5_STARTER_PLUS_2: Starter Plus 2 Billing tier (V5).
        V5_STRATEGIC: Strategic Billing tier (V5).
      x-graphql-type: BillingTier
    SeatLimit:
      description: >-
        A seats limit and the seats in use under it. Members and API keys share
        one count: an active member takes a seat, and an API key that is not
        personal takes one from its first use until 30 days after its last.
      properties:
        inUse:
          description: The seats in use.
          format: int64
          type: integer
        limit:
          description: The limit. Absent when there is no limit.
          format: int64
          type: integer
      required:
        - inUse
      type: object
    Seats:
      description: >-
        The seats of the caller's account: the pooled seats limit of its
        organization with the organization's use, and the account's own
        limit with its use when one is set (decision 0021, DV-080).
      properties:
        account:
          $ref: '#/components/schemas/SeatLimit'
        organization:
          $ref: '#/components/schemas/SeatLimit'
      required:
        - organization
      type: object
    StripeSubscriptionStatus:
      description: |-
        StripeSubscriptionStatus represents all states of a Stripe subscription.
        https://docs.stripe.com/api/subscriptions/object#subscription_object-status
        the convention of casing is kept to match the Stripe API.
      enum:
        - active
        - cancelled
        - incomplete
        - incomplete_expired
        - past_due
        - unpaid
        - unknown
      type: string
      x-graphql-type: StripeSubscriptionStatus
    SubscriptionInput:
      properties:
        address:
          description: Address visible on invoice
          type: string
        city:
          description: City visible on invoice
          type: string
        companyName:
          description: Company name
          nullable: true
          type: string
        country:
          description: ISO-3166-1 alpha-2 code of the country
          type: string
        email:
          description: Billing email
          type: string
        fullName:
          description: Full name of the representative
          type: string
        state:
          description: State name (US-only)
          nullable: true
          type: string
        taxIDType:
          description: Tax ID type (e.g., eu_vat, us_ein)
          nullable: true
          type: string
        taxIDValue:
          description: Tax ID value
          nullable: true
          type: string
        zipCode:
          description: Zip code
          type: string
      required:
        - address
        - city
        - country
        - email
        - fullName
        - zipCode
      type: object
      x-graphql-type: SubscriptionInput
    SubscriptionUpdateV2Input:
      properties:
        addons:
          description: addons that the subscription should have (can be ignored because it has not implemented yet).
          items:
            $ref: '#/components/schemas/BillingAddonType'
          nullable: true
          type: array
        interval:
          $ref: '#/components/schemas/BillingCycleInterval'
        tier:
          $ref: '#/components/schemas/BillingTier'
      required:
        - tier
      type: object
      x-graphql-type: SubscriptionUpdateV2Input
    Tier:
      description: >-
        A tier as the operator defines it (decision 0021, DV-079), in place of
        the BillingTier enum.
      properties:
        features:
          description: The features the tier holds, as infraweave names them, sorted.
          items:
            type: string
          type: array
        limits:
          additionalProperties:
            format: int64
            type: integer
          description: The tier's value of each limit, by limit name. A limit absent from the map has no limit.
          type: object
        name:
          type: string
      required:
        - features
        - limits
        - name
      type: object
    TierFeaturePage:
      description: One page of a cursor-paginated list (decision 0003).
      properties:
        items:
          items:
            type: string
          type: array
        nextCursor:
          description: Pass as cursor to fetch the next page. Absent on the last page.
          type: string
      required:
        - items
      type: object
paths:
  /available-billing-addons:
    get:
      description: >-
        An empty list: infraweave sells no add-ons (decision 0021, DV-080).
      operationId: availableBillingAddons
      x-infraweave-feature: usage
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAddonPage'
          description: The availableBillingAddons result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "400":
          $ref: '#/components/responses/InvalidCursor'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Available Billing Addons
      tags:
        - Billing
      x-bruno: Advanced/Billing/Available Billing Addons.bru
      x-graphql:
        field: availableBillingAddons
        operation: query
        type: Query
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - DV-080
        - cursor-pagination
        - rate-limit
      x-rest-style: read
  /available-self-service-plans:
    get:
      description: >-
        An empty list: infraweave sells no plans (decision 0021, DV-080).
