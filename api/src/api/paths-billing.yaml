      x-rest-style: read
  /billing-subscription:
    delete:
      description: >-
        Would cancel the Stripe subscription through a billing service. infraweave has none,
        so it answers 403 installation-unsupported (decision 0021, DV-080).
        The operator changes an organization's tier through the operator API.
      operationId: billingSubscriptionDelete
      x-infraweave-feature: usage
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscription'
          description: The billingSubscriptionDelete result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Billing Subscription Delete
      tags:
        - Billing
      x-bruno: Danger Zone/Billing Subscription Delete.bru
      x-graphql:
        field: billingSubscriptionDelete
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - DV-080
        - rate-limit
      x-rest-style: singleton
    get:
      description: >-
        null: no Stripe subscription exists (decision 0021, DV-080).
      operationId: billingSubscription
      x-infraweave-feature: usage
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BillingSubscription'
                nullable: true
                x-go-type: '*BillingSubscription'
          description: The billingSubscription result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Billing Subscription
      tags:
        - Billing
      x-bruno: Advanced/Billing/Billing Subscription.bru
      x-graphql:
        field: billingSubscription
        operation: query
        type: Query
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - DV-080
        - rate-limit
      x-rest-style: singleton
    post:
      description: >-
        Would create a Stripe subscription through a billing service. infraweave has none,
        so it answers 403 installation-unsupported (decision 0021, DV-080).
        The operator changes an organization's tier through the operator API.
      operationId: billingSubscriptionCreate
      x-infraweave-feature: usage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              input:
                address: example
                city: example
                country: example
                email: example
                fullName: example
                zipCode: example
              paymentMethodID: example
            schema:
              $ref: '#/components/schemas/BillingSubscriptionCreateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscription'
          description: The billingSubscriptionCreate result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "409":
          $ref: '#/components/responses/IdempotencyConflict'
        "422":
          $ref: '#/components/responses/IdempotencyMismatch'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Billing Subscription Create
      tags:
        - Billing
      x-bruno: Danger Zone/Billing Subscription Create.bru
      x-graphql:
        field: billingSubscriptionCreate
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - DV-080
        - idempotency-key
        - rate-limit
      x-rest-style: singleton
    put:
      description: >-
        Would change the Stripe subscription through a billing service. infraweave has none,
        so it answers 403 installation-unsupported (decision 0021, DV-080).
        The operator changes an organization's tier through the operator API.
      operationId: billingSubscriptionUpdateV2
      x-infraweave-feature: usage
      requestBody:
        content:
          application/json:
            example:
              tier: FREE
            schema:
              $ref: '#/components/schemas/SubscriptionUpdateV2Input'
        required: true
        x-graphql-arg: input
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscription'
          description: The billingSubscriptionUpdateV2 result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Billing Subscription Update V2
      tags:
        - Billing
      x-bruno: Danger Zone/Billing Subscription Update V2.bru
      x-graphql:
        field: billingSubscriptionUpdateV2
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - DV-080
        - rate-limit
      x-rest-style: singleton
