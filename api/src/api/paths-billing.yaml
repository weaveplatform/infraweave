      operationId: billingSubscriptionUpdateTier
      x-infraweave-feature: usage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              tier: FREE
            schema:
              $ref: '#/components/schemas/BillingSubscriptionUpdateTierRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscription'
          description: The billingSubscriptionUpdateTier result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "409":
          $ref: '#/components/responses/IdempotencyConflict'
        "422":
          $ref: '#/components/responses/IdempotencyMismatch'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Billing Subscription Update Tier
      tags:
        - Billing
      x-bruno: Danger Zone/Billing Subscription Update Tier.bru
      x-graphql:
        field: billingSubscriptionUpdateTier
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - DV-080
        - idempotency-key
        - rate-limit
      x-rest-style: singleton
  /on-trial-until:
    get:
      description: >-
