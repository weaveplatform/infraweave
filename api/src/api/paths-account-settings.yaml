# Scaffolded by `specref scaffold --tag Account Settings` from the Spacelift reference (schema-1fc7d2c49a8e).
# This fragment is infraweave's own: curate it freely. Scaffolding again with --force overwrites it.
components:
  schemas:
    AuthorizationScheme:
      type: string
      enum:
        - MANAGED_USERS
        - LOGIN_POLICIES
      x-graphql-type: AuthorizationScheme
    AccountUpdateAuthorizationSchemeRequest:
      type: object
      additionalProperties: false
      required: [schema]
      properties:
        schema:
          $ref: '#/components/schemas/AuthorizationScheme'
      x-graphql-args-of: accountUpdateAuthorizationScheme
    AccountSetOAuthRedirectAllowlistRequest:
      additionalProperties: false
      description: The arguments of accountSetOAuthRedirectAllowlist not carried in the path.
      properties:
        hosts:
          items:
            type: string
          type: array
      required:
        - hosts
      type: object
      x-graphql-args-of: accountSetOAuthRedirectAllowlist
    AccountSetOIDCSubjectTemplateRequest:
      additionalProperties: false
      description: The arguments of accountSetOIDCSubjectTemplate not carried in the path.
      properties:
        template:
          nullable: true
          type: string
      type: object
      x-graphql-args-of: accountSetOIDCSubjectTemplate
    AccountSetPersonalApiKeysEnabledRequest:
      additionalProperties: false
      description: The arguments of accountSetPersonalApiKeysEnabled not carried in the path.
      properties:
        disableExistingKeys:
          nullable: true
          type: boolean
        enabled:
          type: boolean
      required:
        - enabled
      type: object
      x-graphql-args-of: accountSetPersonalApiKeysEnabled
    AccountToggleDeletionMarkRequest:
      additionalProperties: false
      description: The arguments of accountToggleDeletionMark not carried in the path.
      properties:
        description:
          nullable: true
          type: string
        reason:
          nullable: true
          type: string
      type: object
      x-graphql-args-of: accountToggleDeletionMark
    AccountUpdateAwarenessSourceSurveyRequest:
      additionalProperties: false
      description: The arguments of accountUpdateAwarenessSourceSurvey not carried in the path.
      properties:
        completed:
          type: boolean
        response:
          nullable: true
          type: string
      required:
        - completed
      type: object
      x-graphql-args-of: accountUpdateAwarenessSourceSurvey
    AccountUpdateDefaultWorkerPoolRunnerImagesRequest:
      additionalProperties: false
      description: The arguments of accountUpdateDefaultWorkerPoolRunnerImages not carried in the path.
      properties:
        privateWorkerPoolRunnerImage:
          description: >-
            The image a run on a private worker pool uses when neither its
            runtime configuration nor its stack names one. Null or empty
            takes the launcher's default.
          nullable: true
          type: string
        publicWorkerPoolRunnerImage:
          description: >-
            The image a run on the public worker pool uses when neither its
            runtime configuration nor its stack names one. Null or empty
            takes the launcher's default.
          nullable: true
          type: string
      type: object
      x-graphql-args-of: accountUpdateDefaultWorkerPoolRunnerImages
    AccountUpdateDefaultWorkerPoolRunnerImagesResult:
      properties:
        privateWorkerPoolRunnerImage:
          nullable: true
          type: string
        publicWorkerPoolRunnerImage:
          nullable: true
          type: string
      type: object
      x-graphql-type: AccountUpdateDefaultWorkerPoolRunnerImagesResult
    AccountUpdateSecurityEmailRequest:
      additionalProperties: false
      description: The arguments of accountUpdateSecurityEmail not carried in the path.
      properties:
        securityEmail:
          type: string
      required:
        - securityEmail
      type: object
      x-graphql-args-of: accountUpdateSecurityEmail
    AccountSetFeaturePreviewsEnabledRequest:
      additionalProperties: false
      description: The arguments of accountSetFeaturePreviewsEnabled not carried in the path.
      properties:
        enabled:
          description: Whether the account opts in to feature previews.
          type: boolean
      required:
        - enabled
      type: object
      x-graphql-args-of: accountSetFeaturePreviewsEnabled
    FeaturePreview:
      description: >-
        The account's feature previews, with the account's opt-in and the
        caller's own setting.
      properties:
        account:
          $ref: '#/components/schemas/FeaturePreviewAccountSettings'
        features:
          description: >-
            Every feature in preview that the installation has not switched
            off, in catalogue order.
          items:
            $ref: '#/components/schemas/FeaturePreviewFeature'
          type: array
        personal:
          $ref: '#/components/schemas/FeaturePreviewPersonalSettings'
        visible:
          description: >-
            Whether features is not empty. Clients hide both settings while
            it is false.
          type: boolean
      required:
        - account
        - features
        - visible
      type: object
      x-graphql-type: FeaturePreview
    FeaturePreviewAccountSettings:
      description: The account's opt-in to feature previews.
      properties:
        canManage:
          description: Whether the caller is an account admin, who may change enabled.
          type: boolean
        enabled:
          description: >-
            Whether the account has opted in to feature previews. A feature
            in preview answers 403 preview-not-enabled in an account that
            has not.
          type: boolean
      required:
        - canManage
        - enabled
      type: object
    FeaturePreviewFeature:
      description: One feature in preview.
      properties:
        active:
          description: >-
            Whether the feature is on for the caller: the organization's
            entitlement holds it, the account has opted in and, for a
            caller that is a member, the member has not opted out.
          type: boolean
        description:
          type: string
        docsUrl:
          description: The feature's documentation, over https.
          type: string
        imageUrl:
          description: A screenshot of the feature, when it has one.
          nullable: true
          type: string
        key:
          description: The feature's name in the feature catalogue.
          type: string
        name:
          description: The feature's display name.
          type: string
      required:
        - active
        - description
        - docsUrl
        - key
        - name
      type: object
      x-graphql-type: FeaturePreviewFeature
    FeaturePreviewPersonalSettings:
      description: >-
        The caller's own setting, present only when the caller is a member,
        signed in or through a personal API key.
      properties:
        enabled:
          description: >-
            False while the member has opted out of feature previews, which
            hides them in the member's own clients and refuses nothing.
          type: boolean
      required:
        - enabled
      type: object
      x-graphql-type: FeaturePreviewPersonalSettings
    FeaturePreviewSetPersonalEnabledRequest:
      additionalProperties: false
      description: The arguments of featurePreviewSetPersonalEnabled not carried in the path.
      properties:
        enabled:
          description: Whether the member sees feature previews in their own clients.
          type: boolean
      required:
        - enabled
      type: object
      x-graphql-args-of: featurePreviewSetPersonalEnabled
    AwarenessSourceSurvey:
      properties:
        completed:
          type: boolean
        response:
          nullable: true
          type: string
      required:
        - completed
      type: object
      x-graphql-type: AwarenessSourceSurvey
    OauthRedirectAllowedHostsPage:
      description: One page of a cursor-paginated list.
      properties:
        items:
          items:
            type: string
          type: array
        nextCursor:
          description: Pass as cursor to fetch the next page. Absent on the last page.
          type: string
      required:
        - items
      type: object
paths:
  /account/can-be-deleted:
    get:
      description: >-
        Whether accountConfirmDelete would delete the account now: true while
        the account is marked for deletion and is not its organization's last
        account. infraweave sets no waiting period, so a mark allows deletion
        at once.
      operationId: accountCanBeDeleted
      x-infraweave-feature: account-settings
      x-infraweave-action: AUTHENTICATED
      x-infraweave-subject: account
      responses:
        "200":
          content:
            application/json:
              schema:
                type: boolean
          description: The accountCanBeDeleted result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Account Can Be Deleted
      tags:
        - Account Settings
      x-bruno: Advanced/Account Settings/Account Can Be Deleted.bru
      x-graphql:
        field: accountCanBeDeleted
        operation: query
        type: Query
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - rate-limit
      x-rest-style: singleton
  /account/can-be-deleted-at:
    get:
      description: >-
        When the account can be deleted, in Unix seconds: the time of its
        deletion mark, as infraweave sets no waiting period; 0 while the
        account is not marked.
      operationId: accountCanBeDeletedAt
      x-infraweave-feature: account-settings
      x-infraweave-action: AUTHENTICATED
      x-infraweave-subject: account
      responses:
        "200":
          content:
            application/json:
              schema:
                format: int32
                type: integer
          description: The accountCanBeDeletedAt result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Account Can Be Deleted At
      tags:
        - Account Settings
      x-bruno: Advanced/Account Settings/Account Can Be Deleted At.bru
      x-graphql:
        field: accountCanBeDeletedAt
        operation: query
        type: Query
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - rate-limit
      x-rest-style: singleton
  /account/confirm-delete:
    post:
      description: >-
        Delete the caller's account and everything it holds: its API keys,
        sessions, admitted members and account limits, in one transaction.
        Members stay in the organization. An account not marked for deletion,
        or the organization's last account, answers 409 invalid-state.
      operationId: accountConfirmDelete
      x-infraweave-feature: account-settings
      x-infraweave-action: ACCOUNT_ADMIN
      x-infraweave-subject: account
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "200":
          content:
            application/json:
              schema:
                type: boolean
          description: The accountConfirmDelete result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "409":
          $ref: '#/components/responses/IdempotencyConflict'
        "422":
          $ref: '#/components/responses/IdempotencyMismatch'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Account Confirm Delete
      tags:
        - Account Settings
      x-bruno: Danger Zone/Account Confirm Delete.bru
      x-graphql:
        field: accountConfirmDelete
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - idempotency-key
        - rate-limit
      x-rest-style: singleton
  /account/request-personal-api-keys-enabling:
    post:
      description: >-
        Ask the account's admins to enable personal API keys. The request is
        recorded in the account's audit trail; no message is delivered.
      operationId: accountRequestPersonalApiKeysEnabling
      x-infraweave-feature: account-settings
      x-infraweave-action: AUTHENTICATED
      x-infraweave-subject: account
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "200":
          content:
            application/json:
              schema:
                type: boolean
          description: The accountRequestPersonalApiKeysEnabling result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "409":
          $ref: '#/components/responses/IdempotencyConflict'
        "422":
          $ref: '#/components/responses/IdempotencyMismatch'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Account Request Personal Api Keys Enabling
      tags:
        - Account Settings
      x-bruno: Advanced/Account Settings/Account Request Personal Api Keys Enabling.bru
      x-graphql:
        field: accountRequestPersonalApiKeysEnabling
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - idempotency-key
        - rate-limit
      x-rest-style: singleton
  /account/set-feature-previews-enabled:
    post:
      description: >-
        Opt the account in to feature previews, or out of them, and answer
        the account's feature previews as featurePreview does. Opting out
        deletes nothing: a preview's background work pauses and its stored
        options read as their defaults until the account opts in again.
      operationId: accountSetFeaturePreviewsEnabled
      x-infraweave-feature: account-settings
      x-infraweave-action: ACCOUNT_ADMIN
      x-infraweave-subject: account
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              enabled: true
            schema:
              $ref: '#/components/schemas/AccountSetFeaturePreviewsEnabledRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeaturePreview'
          description: The accountSetFeaturePreviewsEnabled result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "409":
          $ref: '#/components/responses/IdempotencyConflict'
        "422":
          $ref: '#/components/responses/IdempotencyMismatch'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Account Set Feature Previews Enabled
      tags:
        - Account Settings
      x-graphql:
        field: accountSetFeaturePreviewsEnabled
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - DV-137
        - idempotency-key
        - rate-limit
      x-rest-style: singleton
  /account/set-o-auth-redirect-allowlist:
    post:
      description: >-
        Replace the account's OAuth redirect host allowlist, which the OAuth
        authorization server checks a client's https redirect URI against.
        Each entry is a bare host or a host with one leading "*."; anything
        else answers 422 validation-failed naming the entry. There is no
        built-in list of client hosts.
      operationId: accountSetOAuthRedirectAllowlist
      x-infraweave-feature: account-settings
      x-infraweave-action: ACCOUNT_ADMIN
      x-infraweave-subject: account
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              hosts:
                - example
            schema:
              $ref: '#/components/schemas/AccountSetOAuthRedirectAllowlistRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
          description: The accountSetOAuthRedirectAllowlist result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "409":
          $ref: '#/components/responses/IdempotencyConflict'
        "422":
          $ref: '#/components/responses/IdempotencyMismatch'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Account Set OAuth Redirect Allowlist
      tags:
        - Account Settings
      x-bruno: Advanced/Account Settings/Account Set OAuth Redirect Allowlist.bru
      x-graphql:
        field: accountSetOAuthRedirectAllowlist
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - idempotency-key
        - rate-limit
      x-rest-style: singleton
  /account/set-oidc-subject-template:
    post:
      description: >-
        Set the subject template of the account's OIDC federation tokens,
        which every run of the account renders into its token's sub claim,
        and answer the template now in effect. A null or empty template
        restores the default,
        space:{spaceId}:{callerType}:{callerId}:run_type:{runType}:scope:{scope}.
        A template holds at most 1000 characters: letters, digits, "-",
        "_", ":", "/", "|" and the placeholders {spaceId}, {spacePath},
        {callerType}, {callerId}, {runId}, {runType} and {scope}; anything
        else answers 422 validation-failed naming the offending part.
      operationId: accountSetOIDCSubjectTemplate
      x-infraweave-feature: oidc-federation
      x-infraweave-action: ACCOUNT_ADMIN
      x-infraweave-subject: account
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              template: space:{spaceId}:{callerType}:{callerId}
            schema:
              $ref: '#/components/schemas/AccountSetOIDCSubjectTemplateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: The accountSetOIDCSubjectTemplate result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "409":
          $ref: '#/components/responses/IdempotencyConflict'
        "422":
          $ref: '#/components/responses/IdempotencyMismatch'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Account Set OIDC Subject Template
      tags:
        - Account Settings
      x-bruno: Advanced/Account Settings/Account Set OIDCSubject Template.bru
      x-graphql:
        field: accountSetOIDCSubjectTemplate
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - idempotency-key
        - rate-limit
      x-rest-style: singleton
  /account/set-personal-api-keys-enabled:
    post:
      description: >-
        Allow or refuse personal API key creation for the account. With
        enabled false and disableExistingKeys true, every personal key of the
        account is disabled and its sessions revoked.
      operationId: accountSetPersonalApiKeysEnabled
      x-infraweave-feature: account-settings
      x-infraweave-action: ACCOUNT_ADMIN
      x-infraweave-subject: account
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              disableExistingKeys: false
              enabled: false
            schema:
              $ref: '#/components/schemas/AccountSetPersonalApiKeysEnabledRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: boolean
          description: The accountSetPersonalApiKeysEnabled result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "409":
          $ref: '#/components/responses/IdempotencyConflict'
        "422":
          $ref: '#/components/responses/IdempotencyMismatch'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Account Set Personal Api Keys Enabled
      tags:
        - Account Settings
      x-bruno: Danger Zone/Account Set Personal Api Keys Enabled.bru
      x-graphql:
        field: accountSetPersonalApiKeysEnabled
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - idempotency-key
        - rate-limit
      x-rest-style: singleton
  /account/toggle-allow-non-admin-space-creation:
    post:
      description: >-
        Flip whether admins of spaces below the account's top space may
        create, move and delete spaces below the spaces they administer, and
        answer the new value. Off by default: while off, such an admin may
        change only the name, description and labels of the spaces they
        administer. The spaces they create always inherit their parent's
        entities.
      operationId: accountToggleAllowNonAdminSpaceCreation
      x-infraweave-feature: account-settings
      x-infraweave-action: ACCOUNT_ADMIN
      x-infraweave-subject: account
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "200":
          content:
            application/json:
              schema:
                type: boolean
          description: The accountToggleAllowNonAdminSpaceCreation result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "409":
          $ref: '#/components/responses/IdempotencyConflict'
        "422":
          $ref: '#/components/responses/IdempotencyMismatch'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Account Toggle Allow Non-Admin Space Creation
      tags:
        - Account Settings
      x-bruno: Advanced/Account Settings/Account Toggle Allow Non Root Admin Space Creation.bru
      x-graphql:
        field: accountToggleAllowNonAdminSpaceCreation
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - idempotency-key
        - rate-limit
      x-rest-style: singleton
  /account/toggle-api-key-management-from-non-humans:
    post:
      description: >-
        Flip whether non-human sessions, API keys, may manage API keys, and
        answer the new value. Off by default: while off, an API key that
        creates, updates, resets, disables or deletes a key answers 403
        forbidden. Only a human session, a member's or the break-glass
        admin's, may flip it.
      operationId: accountToggleAPIKeyManagementFromNonHumans
      x-infraweave-feature: account-settings
      x-infraweave-action: ACCOUNT_ADMIN
      x-infraweave-subject: account
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "200":
          content:
            application/json:
              schema:
                type: boolean
          description: The accountToggleAPIKeyManagementFromNonHumans result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "409":
          $ref: '#/components/responses/IdempotencyConflict'
        "422":
          $ref: '#/components/responses/IdempotencyMismatch'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Account Toggle APIKey Management From Non Humans
      tags:
        - Account Settings
      x-bruno: Advanced/Account Settings/Account Toggle APIKey Management From Non Humans.bru
      x-graphql:
        field: accountToggleAPIKeyManagementFromNonHumans
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - idempotency-key
        - rate-limit
      x-rest-style: singleton
  /account/toggle-deletion-mark:
    post:
      description: >-
        Mark the account for deletion, recording the reason and description,
        or clear the mark; answers whether the account is now marked.
      operationId: accountToggleDeletionMark
      x-infraweave-feature: account-settings
      x-infraweave-action: ACCOUNT_ADMIN
      x-infraweave-subject: account
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountToggleDeletionMarkRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                type: boolean
          description: The accountToggleDeletionMark result.
