components:
  schemas:
    AccountSetOAuthRedirectAllowlistRequest:
      description: The arguments of accountSetOAuthRedirectAllowlist not carried in the path.
      properties:
        hosts:
          items:
            type: string
          type: array
      required:
        - hosts
      type: object
      x-graphql-args-of: accountSetOAuthRedirectAllowlist
    AccountSetPersonalApiKeysEnabledRequest:
      description: The arguments of accountSetPersonalApiKeysEnabled not carried in the path.
      properties:
        disableExistingKeys:
          nullable: true
          type: boolean
        enabled:
          type: boolean
      required:
        - enabled
      type: object
      x-graphql-args-of: accountSetPersonalApiKeysEnabled
    AccountToggleDeletionMarkRequest:
      description: The arguments of accountToggleDeletionMark not carried in the path.
      properties:
        description:
          nullable: true
          type: string
        reason:
          nullable: true
          type: string
      type: object
      x-graphql-args-of: accountToggleDeletionMark
    AccountUpdateAwarenessSourceSurveyRequest:
      description: The arguments of accountUpdateAwarenessSourceSurvey not carried in the path.
      properties:
        completed:
          type: boolean
        response:
          nullable: true
          type: string
      required:
        - completed
      type: object
      x-graphql-args-of: accountUpdateAwarenessSourceSurvey
    AccountUpdateSecurityEmailRequest:
      description: The arguments of accountUpdateSecurityEmail not carried in the path.
      properties:
        securityEmail:
          type: string
      required:
        - securityEmail
      type: object
      x-graphql-args-of: accountUpdateSecurityEmail
    AwarenessSourceSurvey:
      properties:
        completed:
          type: boolean
        response:
          nullable: true
          type: string
      required:
        - completed
      type: object
      x-graphql-type: AwarenessSourceSurvey
    OauthRedirectAllowedHostsPage:
      description: One page of a cursor-paginated list.
      properties:
        items:
          items:
            type: string
          type: array
        nextCursor:
          description: Pass as cursor to fetch the next page. Absent on the last page.
          type: string
      required:
        - items
      type: object
paths:
  /account/can-be-deleted:
    get:
      description: >-
        Whether accountConfirmDelete would delete the account now: true while
        the account is marked for deletion and is not its organization's last
        account. infraweave sets no waiting period, so a mark allows deletion
        at once.
      operationId: accountCanBeDeleted
      x-infraweave-feature: account-settings
      x-infraweave-action: AUTHENTICATED
      x-infraweave-subject: account
      responses:
        "200":
          content:
            application/json:
              schema:
                type: boolean
          description: The accountCanBeDeleted result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Account Can Be Deleted
      tags:
        - Account Settings
      x-bruno: Advanced/Account Settings/Account Can Be Deleted.bru
      x-graphql:
        field: accountCanBeDeleted
        operation: query
        type: Query
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - rate-limit
      x-rest-style: singleton
  /account/can-be-deleted-at:
    get:
      description: >-
        When the account can be deleted, in Unix seconds: the time of its
        deletion mark, as infraweave sets no waiting period; 0 while the
        account is not marked.
      operationId: accountCanBeDeletedAt
      x-infraweave-feature: account-settings
      x-infraweave-action: AUTHENTICATED
      x-infraweave-subject: account
      responses:
        "200":
          content:
            application/json:
              schema:
                format: int32
                type: integer
          description: The accountCanBeDeletedAt result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Account Can Be Deleted At
      tags:
        - Account Settings
      x-bruno: Advanced/Account Settings/Account Can Be Deleted At.bru
      x-graphql:
        field: accountCanBeDeletedAt
        operation: query
        type: Query
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - rate-limit
      x-rest-style: singleton
  /account/confirm-delete:
    post:
      description: >-
        Delete the caller's account and everything it holds: its API keys,
        sessions, admitted members and account limits, in one transaction.
        Members stay in the organization. An account not marked for deletion,
        or the organization's last account, answers 409 invalid-state.
      operationId: accountConfirmDelete
      x-infraweave-feature: account-settings
      x-infraweave-action: ACCOUNT_ADMIN
      x-infraweave-subject: account
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "200":
          content:
            application/json:
              schema:
                type: boolean
          description: The accountConfirmDelete result.
          headers:
            X-RateLimit-Limit:
