openapi: 3.0.3
info:
  title: infraweave operator API
  version: 0.1.0
  description: >-
    The installation operator's API: organizations, their
    first accounts and their break-glass credentials; tiers, the billing
    switch and each organization's tier and grants; the queue's dead jobs;
    and the data key's rotation. Only an operator
    token, which an operator key from auth.operator.keys exchanges for at
    POST /api/v1/auth/token, reaches it; any other credential answers 401.
    Spacelift has no counterpart, so it is outside the parity surface.
servers:
  - url: /operator/v1
    description: The operator API's prefix on the server's single listener.
security:
  - bearerAuth: []
tags:
  - name: Organizations
    description: >-
      Organizations, each created with its first account, and each
      organization's break-glass credential.
  - name: Tiers
    description: >-
      Tiers, each a set of features and a set of limit values. Enterprise
      holds every feature and no limit, and is read-only.
  - name: Billing
    description: >-
      The billing switch, which turns entitlement checks on, and the tier a
      new organization gets.
  - name: Entitlements
    description: >-
      Each organization's tier and the features and limit values granted it
      beyond the tier.
  - name: Queue
    description: >-
      The queue's dead jobs, across every organization.
  - name: Secrets
    description: >-
      The data key that seals secrets at rest.
