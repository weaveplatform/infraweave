      description: Update an existing stack dependency.
      operationId: stackDependencyUpdate
      parameters:
        - description: ID of the stack dependency to update.
          in: path
          name: stackDependencyId
          required: true
          schema:
            type: string
          x-graphql-arg: input.id
      requestBody:
        content:
          application/json:
            example:
              triggerAlways: true
            schema:
              $ref: '#/components/schemas/StackDependencyUpdateInputBody'
