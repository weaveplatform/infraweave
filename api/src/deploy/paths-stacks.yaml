        value:
          description: |-
            Environment variable value, only exposed if the variable is not
            marked as write-only.
          nullable: true
          type: string
        writeOnly:
          description: |-
            When a variable is marked as write-only, its value is only accessible
            to the Run, but not in the API or the UI.
