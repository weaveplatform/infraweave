        x-graphql-arg: input
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackDependency'
          description: The stackDependencyUpdate result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Update Dependency
      tags:
        - Stacks
      x-bruno: Stacks/Dependencies/Update Dependency.bru
      x-graphql:
        field: stackDependencyUpdate
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - rate-limit
      x-rest-style: update
