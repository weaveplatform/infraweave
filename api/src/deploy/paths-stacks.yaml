    StackConfigVendorOpenTofu:
      description: Configuration specific to OpenTofu stacks.
      properties:
        concise:
          description: |-
            When enabled, Spacelift passes -concise to tofu plan/apply/refresh to suppress "Refreshing state..." progress output.
            Requires OpenTofu 1.7+. A stack on an older version cannot enable it.
            If you're running OpenTofu 1.10+, concise flag will be also used in apply.
          type: boolean
        effectiveVersion:
          description: |-
            When the version is a version range, this is the highest supported
            version in the range that will be used for the next run. If the version
            is not a range, or is not set, this field will be null.
          nullable: true
          type: string
        enableCPUProfiling:
          description: |-
            When enabled, Spacelift captures CPU profiles from the OpenTofu init, plan, apply, destroy and show commands.
            Requires OpenTofu 1.11+ at runtime; silently omitted on older versions.
          type: boolean
        externalStateAccessEnabled:
          description: Indicates whether you can access the Stack state file from other stacks or outside of Spacelift.
          type: boolean
        kind:
          description: The concrete type, for union and interface responses.
          enum:
            - StackConfigVendorOpenTofu
          type: string
        supportedFeatures:
          description: OpenTofu features supported by the configured version.
          items:
            $ref: '#/components/schemas/OpenTofuFeatureCheck'
          type: array
        useSmartSanitization:
          description: |-
            If Smart sanitization should be used for sanitizing plans and resources.
            Smart sanitization will only sanitize values that have been marked as sensitive.
          type: boolean
        version:
          description: OpenTofu version to use.
          nullable: true
          type: string
        workflowTool:
          $ref: '#/components/schemas/OpenTofuWorkflowTool'
        workspace:
          description: OpenTofu workspace to select (not compatible with some backends).
          nullable: true
          type: string
      required:
        - concise
        - enableCPUProfiling
        - externalStateAccessEnabled
        - kind
        - supportedFeatures
        - useSmartSanitization
        - workflowTool
      type: object
      x-graphql-type: StackConfigVendorOpenTofu
