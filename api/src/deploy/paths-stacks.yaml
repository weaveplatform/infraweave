paths:
  /stack-dependencies:
    post:
      description: Create a new stack dependency.
      operationId: stackDependencyCreate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              dependsOnStackId: DEPENDENCY_STACK_ID_HERE
              stackId: STACK_ID_HERE
              triggerAlways: false
            schema:
              $ref: '#/components/schemas/StackDependencyInput'
        required: true
        x-graphql-arg: input
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackDependency'
          description: Created.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "409":
          $ref: '#/components/responses/IdempotencyConflict'
        "422":
          $ref: '#/components/responses/IdempotencyMismatch'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Create Dependency
      tags:
        - Stacks
      x-bruno: Stacks/Dependencies/Create Dependency.bru
      x-graphql:
        field: stackDependencyCreate
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - idempotency-key
        - rate-limit
      x-rest-style: create
  /stack-dependencies/{stackDependencyId}:
    delete:
      description: Delete a stack dependency.
      operationId: stackDependencyDelete
      parameters:
        - in: path
          name: stackDependencyId
          required: true
          schema:
            type: string
          x-graphql-arg: id
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackDependency'
          description: The stackDependencyDelete result.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ApiDisabled'
        default:
          $ref: '#/components/responses/Problem'
      summary: Delete Dependency
      tags:
        - Stacks
      x-bruno: Stacks/Dependencies/Delete Dependency.bru
      x-graphql:
        field: stackDependencyDelete
        operation: mutation
        type: Mutation
      x-infraweave-cost: standard
      x-infraweave-divergence:
        - rate-limit
      x-rest-style: delete
